<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="24mm"
   height="24mm"
   viewBox="0 0 90 90"
   version="1.1"
   id="cmd-pushbutton-no-start"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:df="https://dendriforge.dev/ns/1.0"
   df:profile="cmd-pushbutton-no-start"
   df:version="0.1.0">
  <title>Pushbutton NO Start (MVP hook)</title>
  <desc>Required ids: #actuator (press), #contact (NO state). Visual polish incremental.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .housing { fill: #2c3e50; stroke: #1a252f; stroke-width: 2; }
      .bezel { fill: #7f8c8d; stroke: #566573; stroke-width: 1.5; }
      #actuator { fill: #27ae60; stroke: #1e8449; stroke-width: 2; cursor: pointer; }
      #actuator.pressed { transform: translate(0, 4px); fill: #1e8449; }
      #contact { fill: none; stroke: #ecf0f1; stroke-width: 2; }
      #contact.closed { stroke: #f1c40f; }
      .label { fill: #ecf0f1; font-family: sans-serif; font-size: 8px; text-anchor: middle; }
    ]]></style>
  </defs>
  <rect class="housing" x="8" y="8" width="74" height="74" rx="6" ry="6"/>
  <circle class="bezel" cx="45" cy="40" r="22"/>
  <g id="actuator" transform="translate(0,0)">
    <circle cx="45" cy="40" r="16"/>
    <text class="label" x="45" y="43">START</text>
  </g>
  <!-- NO contact schematic cue -->
  <g id="contact" class="open">
    <line x1="22" y1="72" x2="38" y2="72"/>
    <line x1="52" y1="72" x2="68" y2="72"/>
    <line x1="38" y1="72" x2="48" y2="64"/>
  </g>
  <text id="port-NO1" class="label" x="45" y="86">NO1</text>
</svg>
