v_abs_max_v = 30.0

[[ports]]
id = "GND"
label = "0V / Loop Return"
domain = "electrical"
role = "gnd"
nominal_v = 0.0
v_abs_max_v = 30.0

[params.pressure_bar]
type = "real"
unit = "bar"
min = 0.0
max = 10.0
default = 0.0

[params.max_bar]
type = "real"
unit = "bar"
min = 1.0
max = 100.0
default = 10.0

[physics]
model = "spice_current_source_4_20ma"
