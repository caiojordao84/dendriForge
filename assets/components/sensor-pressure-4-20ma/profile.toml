# Certified Component Profile — Industrial 4-20 mA Pressure Transmitter (IEC 61131-2 / IEC 60617-S00894)

schema_version = "2.0"

[meta]
id = "sensor-pressure-4-20ma"
name = "Pressure Transmitter (4-20 mA)"
category = "sensor"
ref_designator = "-B"
standards = ["IEC 61131-2", "IEC 60617", "IEC 61082", "IEC 81346"]

[provenance]
source = "original"
symbol_ref = "IEC 60617-S00894"
reviewed_by = "caio"
reviewed_on = "2026-11-23"
ml_restricted = false

[geometry]
grid_px = 48
pin_px = 8
pin_pitch_px = 24
physical_grid_w = 2.0
physical_grid_h = 3.0
schematic_grid_w = 2.0
schematic_grid_h = 2.0

[svg]
