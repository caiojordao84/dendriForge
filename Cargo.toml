[workspace]
resolver = "2"
members = [
    "crates/dendri-span",
    "crates/dendri-theme",
    "crates/dendri-stdlib",
    "crates/dendri-cli",
]
exclude = [
    "legacy",
    "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
authors = ["DendriForge"]
repository = "https://github.com/caiojordao84/dendriForge"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Gate 2: Zero panics, exhaustive enum matches, deterministic iteration in production code.
# Test-only carve-outs live in clippy.toml (allow-{unwrap,expect,indexing-slicing,panic}-in-tests).
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "deny"
iter_over_hash_type = "deny"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
libm = "0.2"
proptest = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
thiserror = "2"
toml = "0.8"

# Internal Layer 0 crates
dendri-stdlib = { path = "crates/dendri-stdlib" }
