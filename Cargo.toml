[workspace]
resolver = "2"
members = [
    "crates/dendri-span",
    "crates/dendri-theme",
    "crates/dendri-stdlib",
    "crates/dendri-ast",
    "crates/dendri-expr",
    "crates/dendri-assets",
    "crates/dendri-project",
    "crates/dendri-validate",
    "crates/dendri-vm",
    "crates/dendri-sim-kernel",
    "crates/dendri-circuit",
    "crates/dendri-bus",
    "crates/dendri-physics",
    "crates/dendri-frontend-core",
    "crates/dendri-cli",
]
exclude = [
    "legacy",
    "fuzz",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "UNLICENSED"
authors = ["DendriForge"]
repository = "https://github.com/caiojordao84/dendriForge"

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Gate 2: Zero panics, exhaustive enum matches, deterministic iteration in production code.
# Test-only carve-outs live in clippy.toml (allow-{unwrap,expect,indexing-slicing,panic}-in-tests).
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
wildcard_enum_match_arm = "deny"
iter_over_hash_type = "deny"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
libm = "0.2"
proptest = "1"
resvg = { version = "0.48", default-features = false }
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tiny-skia = "0.12"
toml = "0.8"
usvg = { version = "0.48", default-features = false }

# Internal workspace crates
dendri-span = { path = "crates/dendri-span" }
dendri-theme = { path = "crates/dendri-theme" }
dendri-stdlib = { path = "crates/dendri-stdlib" }
dendri-ast = { path = "crates/dendri-ast" }
dendri-expr = { path = "crates/dendri-expr" }
dendri-assets = { path = "crates/dendri-assets" }
dendri-project = { path = "crates/dendri-project" }
dendri-validate = { path = "crates/dendri-validate" }
dendri-vm = { path = "crates/dendri-vm" }
dendri-sim-kernel = { path = "crates/dendri-sim-kernel" }
dendri-circuit = { path = "crates/dendri-circuit" }
dendri-bus = { path = "crates/dendri-bus" }
