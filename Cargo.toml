[workspace]
resolver = "2"
members = [
    "crates/dendri-ast",
    "crates/dendri-stdlib",
    "crates/dendri-parse",
    "crates/dendri-validate",
    "crates/dendri-emit",
    "crates/dendri-backend-st",
    "crates/dendri-frontend-cpp",
    "crates/dendri-frontend-micropython",
    "crates/dendri-frontend-ladder",
    "crates/dendri-frontend-sfc",
    "crates/dendri-frontends",
    "crates/dendri-sync",
    "crates/dendri-editor",
    "crates/dendri-profiles",
    "crates/dendri-sim",
    "crates/dendri-cli",
]

[workspace.package]
# Crate packaging only — NOT an ASL language version. ASL is unversioned until MVP (then 0.0.1).
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
authors = ["DendriForge"]
repository = "https://github.com/caiojordao84/dendriForge"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
dendri-ast = { path = "crates/dendri-ast" }
dendri-stdlib = { path = "crates/dendri-stdlib" }
dendri-parse = { path = "crates/dendri-parse" }
dendri-validate = { path = "crates/dendri-validate" }
dendri-emit = { path = "crates/dendri-emit" }
dendri-backend-st = { path = "crates/dendri-backend-st" }
dendri-frontend-cpp = { path = "crates/dendri-frontend-cpp" }
dendri-frontend-micropython = { path = "crates/dendri-frontend-micropython" }
dendri-frontend-ladder = { path = "crates/dendri-frontend-ladder" }
dendri-frontend-sfc = { path = "crates/dendri-frontend-sfc" }
dendri-frontends = { path = "crates/dendri-frontends" }
dendri-sync = { path = "crates/dendri-sync" }
dendri-profiles = { path = "crates/dendri-profiles" }
dendri-sim = { path = "crates/dendri-sim" }
# iced 0.13 needs rustc ≥ 1.86 (wayland/calloop). Workspace toolchain is 1.86.0.
iced = { version = "0.13", default-features = true }
