<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="24mm"
   height="24mm"
   viewBox="0 0 90 90"
   version="1.1"
   id="cmd-pushbutton-nc-stop"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:df="https://dendriforge.dev/ns/1.0"
   df:profile="cmd-pushbutton-nc-stop"
   df:version="0.1.0">
  <title>Pushbutton NC Stop (22 mm)</title>
  <desc>Required ids: #actuator (press), #contact (NC state). Same 22 mm style as NO start; dedicated NC asset.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .housing { fill: #2c3e50; stroke: #1a252f; stroke-width: 2; }
      .bezel { fill: #7f8c8d; stroke: #566573; stroke-width: 1.5; }
      #actuator { fill: #c0392b; stroke: #922b21; stroke-width: 2; cursor: pointer; }
      #actuator.pressed { transform: translate(0, 4px); fill: #922b21; }
      #contact { fill: none; stroke: #f1c40f; stroke-width: 2; }
      #contact.open { stroke: #ecf0f1; }
      .label { fill: #ecf0f1; font-family: sans-serif; font-size: 8px; text-anchor: middle; }
    ]]></style>
  </defs>
  <rect class="housing" x="8" y="8" width="74" height="74" rx="6" ry="6"/>
  <circle class="bezel" cx="45" cy="40" r="22"/>
  <g id="actuator" transform="translate(0,0)">
    <circle cx="45" cy="40" r="16"/>
    <text class="label" x="45" y="43">STOP</text>
  </g>
  <!-- NC contact schematic cue (closed at rest) -->
  <g id="contact" class="closed">
    <line x1="22" y1="72" x2="38" y2="72"/>
    <line x1="52" y1="72" x2="68" y2="72"/>
    <line x1="38" y1="72" x2="52" y2="72"/>
  </g>
  <text id="port-NC1" class="label" x="45" y="86">NC1</text>
</svg>
