# DendriForge compliance spine — Tier A norms bind to crates/content from day one.
# Process: unknown `standard:` strings warn; Tier A identifiers must resolve in stdlib.


[[tier_a]]
norm = "IEC 61131-3"
binds = [
  "dendri-stdlib canonical names/types",
  "data types BOOL/INT/DINT/UINT/REAL/LREAL/TIME/STRING/BYTE/WORD/DWORD",
  "scopes CONST/VAR/RETAIN/PERSISTENT/TEMP/EXTERN",
  "timer/counter FBs TON/TOF/TP/CTU/CTD/CTUD",
  "ST frontend/backend (Phase 1+)",
  "Ladder cell model + dendri-frontend-ladder (DEN-8 MVP)",
]
day_one_action = "Freeze identifiers from crates/dendri-stdlib/data/catalog.toml; type enum matches goldens"
test_ids = ["G01", "G03", "G05", "G08", "G17", "L01", "L02"]

[[tier_a]]
norm = "IEC 60848"
binds = [
  "GrafcetBlock / GrafcetStep / GrafcetTransition + dendri-frontend-sfc (DEN-8 MVP)",
]
day_one_action = "Editors + sync via dendri-sync / dendri-editor"
test_ids = ["G01-sfc"]

[[tier_a]]
norm = "IEC 61131-2"
binds = [
  "PLC board profile I/O class metadata",
]
day_one_action = "Keep on PLC boards; validate optional fields"
test_ids = []

