warnings = ["Pins IO6-IO11 reserved for internal SPI flash — do NOT use", "Pins IO34, IO35, IO36, IO39 are input-only (no pull-up/pull-down)", "IO0 must be HIGH at boot; pulling LOW enters download mode", "IO12 must be LOW at boot; HIGH triggers 1.8V flash voltage (brick risk)", "ADC2 pins unavailable during active Wi-Fi", "IO1/IO3 (TX0/RX0) shared with USB-Serial bridge"]

