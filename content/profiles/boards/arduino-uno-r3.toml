[usb]
chip = "ATmega16U2"
pid = "0x0043"
type = "USB-B"
vid = "0x2341"

[simulation]
# Board logic-high for LED DC model (board_logic_high_v). [specs].voltage is ignored.
logic_high = 5
model = "mcu-gpio"
states = ["powered", "run", "reset"]
# D13 sourcing 5 V for load (C01). ASL set_adc / READ_ADC = 0–65535 normalized;
# platform edge is 10-bit 0–1023 (norm * 1023 / 65535). See sim-components-d2-pr.md.
adc_v_full_scale = 5
adc_platform_max = 1023
equation = "V_do = 5 when pin high (sourcing); V_ai = 0..5; norm = V_ai/5*65535; counts_uno = norm*1023/65535"

[restrictions]
max_io_current = "40mA"
total_current_limit = "200mA"
warnings = ["Pins 0/1 shared with USB Serial", "Pin 13 has onboard LED interference", "Polyfuse protects USB over 500mA", "Do not expand SVG tags beyond led-pin13 / pads (D-C5); A0 terminals are scene-only (D-comp-12)"]

[compatibility]
arduino_core = "1.8.19"
bootloader = "optiboot"
frameworks = "arduino"
languages = "arduino-cpp"
pio = "atmelavr"

[dendri]
board_family_skill_id = "avr-family"
board_profile_id = "arduino-uno-r3"
default_language_skills = ["arduino-cpp-avr", "rust-embassy-avr"]
svg_path = "content/assets/svg/boards/arduino-uno-r3.svg"
svg_status = "authored"
visual_mvp = true
svg_required_ids = ["led-pin13"]
svg_note = "Canvas binds #led-pin13 + D13 pad; prefers content/assets/svg/. SVG tag contract frozen (D-C5)."
