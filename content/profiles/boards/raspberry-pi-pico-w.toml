[restrictions]
max_io_current = "12mA"
total_current_limit = "300mA"
warnings = ["GP23, GP24, GP25, GP29 are used by the CYW43439 wireless chip — avoid as general GPIO", "GP25 is connected to the onboard LED and WiFi SPI chip select — active HIGH on Pico W", "GP26-GP28 share ADC function; GP29 used for WiFi IRQ and VSYS monitoring", "ADC reference voltage is 3.3V; max ADC input must not exceed 3.3V", "Flash memory uses QSPI interface internally; do not conflict with GP0-GP5 in boot mode", "WiFi and BLE cannot be used simultaneously on the CYW43439 — only one at a time"]

