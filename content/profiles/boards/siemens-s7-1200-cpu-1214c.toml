[restrictions]
max_io_current = "500mA"
total_current_limit = "1500mA"
warnings = ["Digital outputs (MOSFET) have NO overload or short-circuit protection — always install external fuses or breakers rated for the load; a short circuit on any DO will permanently damage the output MOSFET driver; use 0.5A fuses per output channel", "PTO pulse train output is fully supported on this DC/DC/DC variant — Qa.0-Qa.3 support up to 100kHz; Qa.4 supports up to 20kHz; use MC_MoveAbsolute/MC_MoveRelative/MC_MoveVelocity with an external PULSE+DIR drive", "The 2 built-in analog inputs (AIW0, AIW2) support ONLY 0-10VDC — there is NO built-in current (4-20mA) input; to measure 4-20mA, add an external shunt resistor (500 ohm precision) across the analog input; alternatively install SM1231 AI or SB1231 AI for true current inputs with proper isolation", "The built-in analog inputs have NO isolation from the CPU logic — always use shielded and twisted pair cables (max 100m) and connect the shield at only one end (preferably the PLC end) to avoid ground loops; floating signal sources require a reference connection to M terminal of the CPU sensor supply", "The 5VDC backplane bus for expansion modules is limited to 1600mA total — each SM draws approximately 40-200mA from the backplane; if the total current exceeds 1600mA a Power Module PM1207 must be inserted between SMs; always calculate the backplane current budget before selecting expansion modules", "The RTC backup uses an internal supercapacitor (no battery) that provides approximately 480 hours (20 days) of clock backup after power loss — for longer retention the SB1297 Battery Board must be installed in the Signal Board slot; installing SB1297 permanently occupies the SB slot and prevents use of other Signal Boards simultaneously", "OPC UA server is available from firmware V4.4 and TIA Portal V16 — older firmware versions do NOT support OPC UA; before enabling OPC UA ensure the CPU firmware is updated; OPC UA requires a security certificate to be configured in TIA Portal and deployed to the CPU; unsecured OPC UA is disabled by default from V4.4"]

