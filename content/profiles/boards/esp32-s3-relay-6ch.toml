[restrictions]
max_io_current = "40mA"
total_current_limit = "1200mA"
warnings = ["GPIO1-GPIO6 drive relay coils via optocouplers; GPIO only sources signal (~5mA); relay coil powered by internal 5V; relay contact max 10A 250VAC or 30VDC (SRD-05VDC-SL-C); never connect loads exceeding 10A to relay contacts", "GPIO2 is a strapping pin; must be HIGH at boot for normal SPI boot; pulling LOW at power-on forces download mode; add 10k pull-up if relay driver circuit can backfeed GPIO2 LOW during power-on transients", "GPIO8 is a strapping pin; HIGH at reset enables ROM UART messages on UART0; ensure GPIO8 is LOW (RS485 RX mode) before reset to avoid unexpected serial output on boot", "ADC2 channels (GPIO11-GPIO20) unreliable during active WiFi TX; use only ADC1 (GPIO1-GPIO10) for analog sensing concurrent with WiFi", "GPIO19/GPIO20 are native USB D-/D+; do not use as GPIO when USB CDC or JTAG is active; only free for GPIO in non-USB applications", "RS485 isolated via digital isolator; RS485-GND terminal must be connected to bus common ground at remote device; floating RS485-GND causes common-mode noise and Modbus CRC errors; isolation rated typically 2500V RMS", "Relay contacts are electrically independent but share PCB proximity; mains voltage on one relay can capacitively couple to adjacent contacts; maintain IEC 60664-1 creepage/clearance for mains-rated applications", "DC input 7-30V via screw terminal; below 7V relay coils may chatter; above 30V input protection may be damaged; install TVS diode on input rail when sharing supply with inductive loads", "GPIO48 onboard status LED; also a strapping pin on some HW revisions; verify silkscreen revision before using GPIO48 for application logic"]
compatibility = "pio esp32s3box | frameworks \"arduino;espidf\" | languages \"arduino-cpp;micropython;rust-embassy\" | bootloader \"esp-idf-bootloader\""

