warnings = ["PA5 (D13) is shared between SPI1_SCK; user LED and DAC1_CH2", "PA2/PA3 are routed to ST-LINK Virtual COM — conflict if used as GPIO", "DAC and ADC are mutually exclusive on A2 (PA4) and D13 (PA5)", "Most GPIO pins are 5V tolerant for input but always output 3.3V logic", "On-board LDO 3.3V output is limited — do not exceed ~100mA total load", "Cortex-M0+ has no FPU and no hardware divide — SDIV/UDIV take 2-12 cycles"]

