warnings = ["All I/O pins operate at 1.8V; NOT compatible with 3.3V/5V Arduino shields without level shifting", "nRF7002 is a Wi-Fi companion IC only; connected to nRF5340 via QSPI — not exposed on headers", "P0.28/P0.29 serve as both LED1/LED2 and SPI SS/MOSI; do not use SPI and LEDs simultaneously", "P0.23/P0.24 serve as BTN1/BTN2; may conflict with D3 or general GPIO use", "P0.19/P0.21 are UART0 CTS/RTS; tri-stated when no terminal connected to VCOM", "nRF5340 dual-core: App core (128MHz/1MB) is user target; Net core (64MHz/256KB) runs protocol stack", "NFC antenna connector present; NFC pins (P0.09/P0.10) not broken out on Arduino headers", "Power supply 2.9-5.0V only; board has no 3.3V regulator output on VDD — use VIO_REF for reference"]

