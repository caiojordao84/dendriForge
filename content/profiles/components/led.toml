# component profile — led (migrated from legacy TOON)
# Source: led.toon
# ASL 0.0.1 lives on program IR (metadata.asl_version), not profiles.


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "led-profile"

[identification]
category = "passive"
family = "electricals"
id = "led"
image = "led.svg"
name = "LED (Light Emitting Diode)"
standard = "IEC 60810"
subfamily = "passives"
symbol = "led-symbol.svg"
symbol_standard = "IEC"

[params.color]
default = "red"
editable = true
label = "Color"
options = ["red", "green", "blue", "yellow", "orange", "white", "warm-white", "cool-white", "uv", "ir", "custom"]
type = "enum"

# Modular LED modules with a built-in series resistor (ohms). When set, no discrete
# `r_led` series resistor is required in project wiring.
[params.integrated_resistance]
default = 0
editable = true
label = "Integrated series resistance"
max = 100000
min = 0
type = "int"
unit = "ohm"

[params.if_max]
default = 0.03
editable = false
label = "Absolute Max Forward Current"
max = 5
min = 0.003
type = "float"
unit = "A"

[params.if_rated]
default = 0.02
editable = true
label = "Rated Forward Current (If)"
options = [0.002, 0.005, 0.01, 0.02, 0.03, 0.05, 0.1, 0.35, 0.7, 1, 3]
type = "enum"
unit = "A"

[params.luminous_intensity]
default = 20
editable = false
label = "Luminous Intensity (Iv)"
max = 100000
min = 0.5
type = "float"
unit = "V"

[params.power_rated]
default = 0.065
editable = false
label = "Power Rating"
max = 10
min = 0.001
type = "float"
unit = "W"

[params.vf]
default = 2.1
editable = false
label = "Forward Voltage (Vf)"
max = 4.5
min = 1.5
type = "float"
unit = "V"

[params.vr_max]
default = 5
editable = false
label = "Max Reverse Voltage (Vr)"
max = 50
min = 3
type = "float"
unit = "V"

[params.wavelength_peak]
default = 660
editable = false
label = "Peak Wavelength (λp)"
max = 940
min = 280
type = "float"
unit = "V"

[[ports]]
current_max = "5A"
direction = "input"
id = "A"
notes = "anode (positive terminal)"
type = "power"
voltage_max = "50V"

[[ports]]
direction = "input"
id = "K"
notes = "cathode (negative terminal)"
type = "ground"

[simulation]
bidirectional = false
dynamic = false
equation = "I = (V_pin - vf) / integrated_resistance; I = 0 if V_pin <= vf; I > if_max => burned. R=0 with V_pin > vf → unbounded I (no NaN)."
model = "basic-analog"
noise_model = false
states = ["off", "on", "burned", "fault"]
thermal_model = false

[limits]
max_current = "5A"
max_power = "{power_rated}W"
max_temp = 85
max_voltage = "50V"
min_temp = -40
warnings = ["Always use a current-limiting resistor or constant-current driver — never connect LED directly to voltage source", "Do not exceed absolute max forward current — LED degrades irreversibly above thermal limit; overcurrent burns the load in sim", "Reverse voltage above Vr_max causes breakdown — add protection diode in AC circuits", "RGB and addressable LEDs (WS2812) require specific drive logic — verify timing and voltage levels"]

[connections]
allowed_with = ["*"]
forbidden_with = []
requires = []
typical_context = ["indicator", "backlight", "lighting", "optocoupler-input", "status-display"]

[canvas]
animated = true
height = 40
label_position = "top"

[canvas.port_A]
x = 0
y = 20

[canvas.port_K]
x = 50
y = 20
ports_layout = "custom"
value_display = "{color} / Vf={vf}V / If={if_rated}A / R={integrated_resistance}Ω"
width = 50

[dendri]
component_family_skill_id = "electricals-family"
component_profile_id = "led"
palette_group = "Fundamental Electricals > Passives"
simulation_engine = "basic-analog"
svg_path = "content/assets/svg/components/led.svg"
tags = ["led", "diode", "light", "indicator", "passive", "optical", "iec-60810"]
svg_status = "authored"
visual_mvp = true
svg_required_ids = ["led-body"]
sim_role = "led-load"
