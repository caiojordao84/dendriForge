editable = true
label = "Host Interface"
options = ["SPI", "I2C", "UART"]
type = "enum"

[params.irq_mode]
default = "open-drain"
editable = true
label = "IRQ Interrupt Mode"
options = ["open-drain", "CMOS-push-pull"]
type = "enum"

[params.power_down_current]
default = 10
editable = false
label = "Power-Down Current (uA)"
max = 10
min = 10
