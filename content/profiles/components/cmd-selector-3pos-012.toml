max_voltage = "400V"
min_temp = -25
warnings = ["Do not exceed rated voltage or current on contact terminals", "This is a maintained selector — position holds after actuation", "Verify panel cutout dimensions before mounting (IEC 60947-5-1)"]

[connections]
