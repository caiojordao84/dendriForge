editable = true
label = "Illuminated"
type = "bool"

[params.is_maintained]
default = true
editable = false
label = "Maintained Action"
type = "bool"

[params.positions]
default = 3
editable = false
label = "Number of Positions"
options = [3]
type = "enum"

[params.voltage_rating]
default = 240
editable = false
label = "Voltage Rating"
options = [24, 110, 240, 400]
type = "enum"
