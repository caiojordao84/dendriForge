default = 180
editable = true
label = "Rated Armature Voltage"
options = [24, 48, 90, 110, 180, 220, 440, 600, 750]
type = "enum"
unit = "V"

[[ports]]
current_max = "10000A"
direction = "input"
id = "A1"
notes = "armature terminal A1 (positive)"
type = "power"
voltage_max = "750V"

[[ports]]
direction = "input"
id = "A2"
notes = "armature terminal A2 (negative)"
type = "ground"

[[ports]]
current_max = "10A"
direction = "input"
id = "F1"
notes = "field winding terminal F1 (positive)"
type = "analog"
voltage_max = "440V"

[[ports]]
current_max = "10A"
direction = "input"
id = "F2"
notes = "field winding terminal F2 (negative)"
type = "analog"
voltage_max = "440V"

[simulation]
bidirectional = true
dynamic = true
equation = "V_a = back_emf_constant * speed + current_rated * armature_resistance; T = torque_constant * current_rated"
model = "basic-analog"
motion = "rotary"
noise_model = false
states = ["off", "starting", "running", "braking", "fault"]
thermal_model = true

[limits]
ip_rating = "IP44"
max_current = "10000A"
max_temp = 40
max_voltage = "750V"
min_temp = -20
warnings = ["Never open the field circuit of shunt or compound motors under load — runaway condition may occur", "Armature current must be limited at startup — use soft-start or current-limited drive", "4Q drive required for regenerative braking and rapid direction reversal", "Brush inspection and replacement must be performed at scheduled maintenance intervals", "Field weakening above base speed reduces torque — verify load requirements before operating in flux-weakening region"]

[connections]
allowed_with = ["dc-source", "dc-psu-prog", "battery"]
forbidden_with = ["ac-source", "ac-source-3phase"]
requires = ["dc-source"]
typical_context = ["dc-drive", "conveyor", "crane", "winder", "extruder", "rolling-mill"]

[canvas]
animated = true
height = 80
label_position = "right"

[canvas.port_A1]
x = 0
y = 20

[canvas.port_A2]
x = 0
y = 40

[canvas.port_F1]
x = 0
y = 60

[canvas.port_F2]
x = 0
y = 75
ports_layout = "custom"
value_display = "{power_rated}W / {voltage_rated}V / {speed_rated}rpm ({excitation_type})"
width = 90

[dendri]
component_family_skill_id = "actuators-family"
component_profile_id = "motor-dc-industrial"
palette_group = "Actuators > Industrial Electrical"
simulation_engine = "digital-io"
svg_path = "content/assets/svg/components/motor-dc-industrial.svg"
tags = ["motor", "dc", "industrial", "actuator", "brushed", "variable-speed", "torque-control", "iec-60034"]
svg_status = "missing"
