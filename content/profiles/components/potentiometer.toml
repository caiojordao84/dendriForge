# component profile — potentiometer (migrated from legacy TOON)
# Source: potentiometer.toon
# ASL 0.0.1 lives on program IR (metadata.asl_version), not profiles.


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "potentiometer-profile"

[identification]
category = "passive"
family = "electricals"
id = "potentiometer"
image = "potentiometer.svg"
name = "Potentiometer"
standard = "IEC 60393-1"
subfamily = "passives"
symbol = "potentiometer-symbol.svg"
symbol_standard = "IEC"

[params.package]
default = "THT-rotary"
editable = true
label = "Package"
options = ["THT-rotary", "THT-trimmer", "SMD-trimmer", "slide", "digital-SPI", "digital-I2C"]
type = "enum"

[params.power_rating]
default = 0.25
editable = true
label = "Power Rating"
options = [0.1, 0.25, 0.5, 1, 2, 3, 5]
type = "enum"
unit = "W"

[params.resistance]
default = 10000
editable = true
label = "Total Resistance"
max = 10000000
min = 10
type = "float"
unit = "Ω"

[params.resolution]
default = "continuous"
editable = true
label = "Resolution"
options = ["continuous", "16-steps", "32-steps", "64-steps", "256-steps"]
type = "enum"

[params.taper]
default = "linear"
editable = true
label = "Taper (Law)"
options = ["linear", "logarithmic", "anti-logarithmic"]
type = "enum"

[params.tolerance]
default = 20
editable = true
label = "Resistance Tolerance"
options = [5, 10, 20]
type = "enum"
unit = "%"

[params.wiper_position]
default = 50
editable = true
label = "Wiper Position"
max = 100
min = 0
type = "float"
unit = "%"

[[ports]]
direction = "passive"
id = "A"
notes = "resistive track terminal A (full resistance end)"
type = "analog"

[[ports]]
direction = "passive"
id = "B"
notes = "resistive track terminal B (zero resistance end)"
type = "analog"

[[ports]]
direction = "output"
id = "W"
notes = "wiper / sliding contact output"
type = "analog"

[simulation]
bidirectional = true
dynamic = true
equation = "R_AW = resistance * f(wiper_position, taper); R_WB = resistance - R_AW"
model = "ohms-law"
noise_model = false
states = ["nominal", "fault"]
thermal_model = false

[limits]

[limits.max_power]
unit = "W"
value = "{power_rating}"
max_temp = 125
min_temp = -55
warnings = ["Do not exceed rated power dissipation across the full resistive track", "Wiper current must not exceed the contact current rating (typically 1% of power rating)", "Logarithmic taper is designed for audio applications — do not use for linear control"]

[connections]
allowed_with = ["*"]
forbidden_with = []
requires = []
typical_context = ["voltage-divider", "volume-control", "bias-adjustment", "sensor-calibration"]

[canvas]
animated = true
height = 50
label_position = "top"

[canvas.port_A]
x = 0
y = 10

[canvas.port_B]
x = 0
y = 40

[canvas.port_W]
x = 60
y = 25
ports_layout = "custom"
value_display = "{resistance}Ω / {wiper_position}% ({taper})"
width = 60

[dendri]
component_family_skill_id = "electricals-family"
component_profile_id = "potentiometer"
palette_group = "Fundamental Electricals > Passives"
simulation_engine = "basic-analog"
svg_path = "content/assets/svg/components/potentiometer.svg"
tags = ["potentiometer", "passive", "analog", "variable-resistor", "wiper", "voltage-divider"]
svg_status = "missing"
