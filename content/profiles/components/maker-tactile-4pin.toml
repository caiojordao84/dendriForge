# component profile — maker-tactile-4pin (D0a; SVG in D1)
# ASL 0.0.1 lives on program IR (metadata.asl_version), not profiles.


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "maker-tactile-4pin-profile"

[identification]
category = "passive"
family = "electricals"
id = "maker-tactile-4pin"
image = "maker-tactile-4pin.svg"
name = "Tactile Pushbutton 4-Pin"
standard = "IEC 61058"
subfamily = "passives"
symbol = "maker-tactile-4pin-symbol.svg"
symbol_standard = "IEC"

[params.actuation_force]
default = 1.6
editable = true
label = "Actuation Force"
options = [0.5, 1.0, 1.6, 2.5, 3.5]
type = "enum"
unit = "N"

[params.contact_form]
default = "no"
editable = false
label = "Contact Form"
options = ["no", "nc"]
type = "enum"

[params.contact_state]
default = "normally-open"
editable = true
label = "Contact State"
options = ["normally-open", "momentary", "spring-return"]
type = "enum"

# Uno pull-up active-low: pin INPUT_PULLUP; contact closes to GND → pressed reads LOW.
[params.pull]
default = "pullup"
editable = true
label = "Input Pull"
options = ["none", "pullup", "pulldown"]
type = "enum"

[params.active_level]
default = "low"
editable = true
label = "Active Level When Closed"
options = ["high", "low"]
type = "enum"

[params.contact_rating_dc]
default = 0.05
editable = true
label = "DC Contact Rating"
options = [0.02, 0.05, 0.1, 0.2]
type = "enum"
unit = "A"

[params.package]
default = "12x12mm-THT"
editable = true
label = "Package"
options = ["6x6mm-THT", "12x12mm-THT", "SMD"]
type = "enum"

[params.mechanical_life]
default = 100000
editable = false
label = "Mechanical Life"
max = 1000000
min = 10000
type = "float"
unit = "cycles"

[[ports]]
direction = "passive"
id = "1"
notes = "leg 1 (internally tied to leg 2 in typical 4-pin tactile)"
type = "digital"
voltage_max = "12V"
current_max = "50mA"

[[ports]]
direction = "passive"
id = "2"
notes = "leg 2 (same pole as leg 1)"
type = "digital"
voltage_max = "12V"
current_max = "50mA"

[[ports]]
direction = "passive"
id = "3"
notes = "leg 3 (same pole as leg 4 — closes to 1/2 when pressed)"
type = "digital"
voltage_max = "12V"
current_max = "50mA"

[[ports]]
direction = "passive"
id = "4"
notes = "leg 4 (same pole as leg 3)"
type = "digital"
voltage_max = "12V"
current_max = "50mA"

# Convenience aliases for wiring (same electrical poles).
[[ports]]
direction = "passive"
id = "A"
notes = "alias for pole A (legs 1/2) — typically to MCU pin"
type = "digital"
voltage_max = "12V"
current_max = "50mA"

[[ports]]
direction = "passive"
id = "B"
notes = "alias for pole B (legs 3/4) — typically to GND for Uno pull-up"
type = "digital"
voltage_max = "12V"
current_max = "50mA"

[simulation]
bidirectional = false
dynamic = true
model = "ideal"
noise_model = false
states = ["open", "closed"]
thermal_model = false
equation = "pressed => poles A–B closed. With pull=pullup + active_level=low (Uno): closed → GPIO LOW. Industrial contrast: cmd-pushbutton-* default active_level=high."

[limits]
max_current = "50mA"
max_temp = 70
max_voltage = "12V"
min_temp = -25
warnings = ["Momentary — returns to open when released", "For Uno INPUT_PULLUP wiring: one pole to pin, other to GND; pressed reads LOW", "Do not switch inductive loads without protection; contact rating is low"]

[connections]
allowed_with = ["mcu-gpio", "pullup-resistor", "dc-source"]
forbidden_with = ["ac-source"]
requires = []
typical_context = ["maker-input", "breadboard", "uno-digital-in"]

[canvas]
animated = false
height = 24
label_position = "top"

[canvas.port_A]
x = 0
y = 12

[canvas.port_B]
x = 40
y = 12
ports_layout = "horizontal"
value_display = "Tactile NO / pull={pull} / active={active_level}"
width = 40

[dendri]
component_family_skill_id = "electricals-family"
component_profile_id = "maker-tactile-4pin"
palette_group = "Fundamental Electricals > Switches"
simulation_engine = "basic-analog"
svg_path = "content/assets/svg/components/maker-tactile-4pin.svg"
tags = ["tactile", "pushbutton", "no", "momentary", "maker", "4pin"]
svg_status = "missing"
svg_required_ids = ["actuator", "contact"]
svg_note = "D1 owns SVG. Not used by C01 (keeps cmd-pushbutton-no-start)."
sim_role = "momentary-contact"
