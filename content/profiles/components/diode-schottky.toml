[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "diode-schottky-profile"

[identification]
category = "passive"
family = "electricals"
id = "diode-schottky"
image = "diode-schottky.svg"
name = "Schottky Diode"
standard = "IEC 60747-2"
subfamily = "passives"
symbol = "diode-schottky-symbol.svg"
symbol_standard = "IEC"

[params.if_rated]
default = 1
editable = true
label = "Rated Forward Current"
options = [0.1, 0.2, 0.5, 1, 3, 5, 10, 20]
type = "enum"
unit = "A"

[params.junction_capacitance]
default = 20
editable = false
label = "Junction Capacitance"
max = 500
min = 1
type = "float"
unit = "V"

[params.leakage_current]
default = 0.0001
editable = false
label = "Reverse Leakage Current"
max = 0.5
min = 0
type = "float"
unit = "A"

[params.package]
default = "SOD-123"
editable = true
label = "Package"
options = ["SOD-123", "SOD-323", "SMA", "SMB", "SMC", "TO-220", "TO-247"]
type = "enum"

[params.recovery_time]
default = 5
editable = true
label = "Reverse Recovery Time"
options = [1, 2, 5, 10, 20, 50]
type = "enum"
unit = "V"

[params.vf]
default = 0.3
editable = false
label = "Forward Voltage (Vf)"
max = 1
min = 0.1
type = "float"
unit = "V"

[params.vr_max]
default = 40
editable = true
label = "Max Reverse Voltage"
options = [20, 30, 40, 60, 80, 100, 150, 200]
type = "enum"
unit = "V"

[[ports]]
current_max = "20A"
direction = "input"
id = "A"
notes = "anode (positive terminal)"
type = "power"
voltage_max = "200V"

[[ports]]
direction = "output"
id = "K"
notes = "cathode (negative terminal)"
type = "ground"

[simulation]
bidirectional = false
dynamic = true
equation = "I = I_s * (exp(V_d/(n*Vt)) - 1)"
model = "basic-analog"
noise_model = false
states = ["off", "forward", "breakdown"]
thermal_model = true

[limits]
max_current = "20A"
max_temp = 175
max_voltage = "200V"
min_temp = -55
warnings = ["Schottky diodes have low forward drop but higher reverse leakage than PN diodes", "Reverse voltage must be derated — Schottky junctions are more susceptible to leakage and breakdown", "Thermal rise increases leakage current significantly at elevated temperature", "Use Schottky parts for fast switching and low losses, not for high reverse-voltage blocking"]

[connections]
allowed_with = ["*"]
forbidden_with = []
requires = []
typical_context = ["rectifier", "freewheel", "power-supply", "OR-ing", "clamp"]

[canvas]
animated = false
height = 30
label_position = "top"

[canvas.port_A]
x = 0
y = 15

[canvas.port_K]
x = 50
y = 15
ports_layout = "horizontal"
value_display = "Schottky Vf={vf}V / Vr={vr_max}V"
width = 50

[dendri]
component_family_skill_id = "electricals-family"
component_profile_id = "diode-schottky"
palette_group = "Fundamental Electricals > Passives"
simulation_engine = "basic-analog"
svg_path = "content/assets/svg/components/diode-schottky.svg"
tags = ["diode", "schottky", "rectifier", "passive", "semiconductor", "fast-switching", "iec-60747-2"]
