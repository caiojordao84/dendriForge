# component profile — pneu-cylinder-da-cushioned (migrated from legacy TOON)
# Source: pneu-cylinder-da-cushioned.toon
# ASL 0.0.1 lives on program IR (metadata.asl_version), not profiles.


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "pneu-cylinder-da-cushioned-profile"

[identification]
category = "actuator"
family = "pneumatics"
id = "pneu-cylinder-da-cushioned"
image = "pneu-cylinder-da-cushioned.svg"
name = "Double-Acting Cushioned Pneumatic Cylinder (Cilindro DA com amortecimento)"
standard = "ISO 15552"
subfamily = "pneumatic-actuators"
symbol = "pneu-cylinder-da-cushioned-symbol.svg"
symbol_standard = "ISO"

[params.bore]
default = 40
editable = true
label = "Bore Diameter"
options = [32, 40, 50, 63, 80, 100, 125]
type = "enum"
unit = "mm"

[params.cushioning]
default = "adjustable"
editable = true
label = "Cushioning Type"
options = ["fixed", "adjustable", "self-adjusting"]
type = "enum"

[params.initial_position]
default = "retracted"
editable = true
label = "Initial Position"
options = ["retracted", "extended"]
type = "enum"

[params.port_size]
default = "G1/4"
editable = true
label = "Port Size"
options = ["G1/8", "G1/4", "G3/8", "G1/2"]
type = "enum"

[params.rod_diameter]
default = 16
editable = false
label = "Rod Diameter"
type = "float"
unit = "mm"

[params.stroke]
default = 160
editable = true
label = "Stroke"
max = 2000
min = 10
type = "float"
unit = "mm"

[params.supply_pressure]
default = 6
editable = true
label = "Supply Pressure"
max = 10
min = 1.5
type = "float"
unit = "bar"
ports = []

[[pneumatic_ports]]
direction = "bidirectional"
id = "A"
notes = "port A — extend"
pressure_max = "10bar"
type = "pneumatic"

[[pneumatic_ports]]
direction = "bidirectional"
id = "B"
notes = "port B — retract"
pressure_max = "10bar"
type = "pneumatic"

[[sensor_slots]]
compatible_sensors = ["pneu-magnetic-cylinder-sensor", "pneu-reed-switch-cylinder"]
id = "S1"
position = "retracted-end"

[[sensor_slots]]
compatible_sensors = ["pneu-magnetic-cylinder-sensor", "pneu-reed-switch-cylinder"]
id = "S2"
position = "extended-end"

[simulation]
bidirectional = true
dynamic = true
model = "pneumatic-linear-actuator"
motion = "linear"
noise_model = false
position_feedback = true
states = ["retracted", "extending", "extended", "retracting"]
thermal_model = false
velocity_model = "simplified"

[limits]

[limits.max_force]
extend = "calc:pi*(bore/2)^2 * supply_pressure * 0.1"
retract = "calc:pi*((bore/2)^2-(rod_diameter/2)^2) * supply_pressure * 0.1"
max_pressure = 10
max_temp = 80
min_pressure = 1.5
min_temp = -20
warnings = ["Double-acting cylinders require a 5/2 or 5/3 directional valve for standard operation", "Adjust cushioning screws to prevent mechanical shock at the end of the stroke"]

[connections]
allowed_with = ["pneu-valve-5-2-*", "pneu-valve-5-3-*", "pneu-flow-control-*", "pneu-quick-exhaust"]
forbidden_with = ["hyd-*", "act-motor-*"]
requires = ["pneu-frl-unit"]
typical_context = ["pushing", "pulling", "clamping", "high-speed-positioning"]

[canvas]
animated = true
height = 40
label_position = "bottom"

[canvas.port_A]
x = 20
y = 0

[canvas.port_B]
x = 100
y = 0
ports_layout = "custom"
value_display = "DA-Cush Ø{bore}mm × {stroke}mm"
width = 120

[dendri]
component_family_skill_id = "pneumatics-family"
component_profile_id = "pneu-cylinder-da-cushioned"
palette_group = "Pneumatics > Pneumatic Actuators"
simulation_engine = "pneumatic-motion"
svg_path = "content/assets/svg/components/pneu-cylinder-da-cushioned.svg"
tags = ["cylinder", "double-acting", "cushioned", "pneumatic", "actuator", "linear"]
svg_status = "missing"
