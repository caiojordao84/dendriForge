# component profile — mosfet-n (migrated from legacy TOON)
# Source: mosfet-n.toon
# ASL 0.0.1 lives on program IR (metadata.asl_version), not profiles.


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "mosfet-n-profile"

[identification]
category = "semiconductor"
family = "electricals"
id = "mosfet-n"
image = "mosfet-n.svg"
name = "N-Channel MOSFET"
standard = "IEC 60617"
subfamily = "semiconductors"
symbol = "mosfet-n-symbol.svg"
symbol_standard = "IEC"

[params.rds_on]
default = 0.05
editable = true
label = "Static Drain-Source On-Resistance"
max = 10.0
min = 0.001
type = "float"
unit = "Ω"

[params.vds_max]
default = 60
editable = false
label = "Max Drain-Source Voltage"
type = "float"
unit = "V"

[params.vgs_th]
default = 2.0
editable = true
label = "Gate-Source Threshold Voltage"
max = 5.0
min = 0.5
type = "float"
unit = "V"

[[ports]]
direction = "input"
id = "G"
notes = "Gate terminal"
type = "analog"
voltage_max = "20V"

[[ports]]
direction = "passive"
id = "D"
notes = "Drain terminal"
type = "analog"
voltage_max = "{vds_max}"

[[ports]]
direction = "passive"
id = "S"
notes = "Source terminal"
type = "analog"

[simulation]
bidirectional = false
dynamic = true
model = "ideal"
noise_model = false
states = ["off", "conducting"]
thermal_model = false

[limits]
max_current = "30A"

[limits.max_power]
unit = "W"
value = 150
max_temp = 175
max_voltage = "{vds_max}"
min_temp = -55
warnings = ["Exceeding Vgs max (typically 20V) will puncture the gate oxide", "Ensure adequate heatsinking for high continuous currents"]

[connections]
allowed_with = ["*"]
forbidden_with = []
requires = []
typical_context = ["switching", "pwm-control", "power-management"]

[canvas]
animated = true
height = 40
label_position = "right"

[canvas.port_D]
x = 20
y = 0

[canvas.port_G]
x = 0
y = 20

[canvas.port_S]
x = 20
y = 40
ports_layout = "custom"
value_display = "{vgs_th}V Th"
width = 40

[dendri]
component_family_skill_id = "electricals-family"
component_profile_id = "mosfet-n"
palette_group = "Fundamental Electricals > Semiconductors"
simulation_engine = "basic-analog"
svg_path = "content/assets/svg/components/mosfet-n.svg"
tags = ["mosfet", "n-channel", "semiconductor"]
svg_status = "missing"
