# component profile — hyd-cylinder-da (migrated from legacy TOON)
# Source: hyd-cylinder-da.toon
# ASL 0.0.1 lives on program IR (metadata.asl_version), not profiles.


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "hyd-cylinder-da-profile"

[identification]
category = "actuator"
family = "hydraulics"
id = "hyd-cylinder-da"
image = "hyd-cylinder-da.svg"
name = "Double-Acting Hydraulic Cylinder (Cilindro hidráulico duplo efeito)"
standard = "ISO 6020-2"
subfamily = "hydraulic-actuators"
symbol = "hyd-cylinder-da-symbol.svg"
symbol_standard = "ISO"

[params.bore]
default = 50
editable = true
label = "Bore Diameter"
options = [25, 32, 40, 50, 63, 80, 100, 125, 160]
type = "enum"
unit = "mm"

[params.initial_position]
default = "retracted"
editable = true
label = "Initial Position"
options = ["retracted", "extended"]
type = "enum"

[params.operating_pressure]
default = 150
editable = true
label = "Operating Pressure"
max = 350
min = 10
type = "float"
unit = "bar"

[params.port_size]
default = "G1/2"
editable = true
label = "Port Size"
options = ["G1/4", "G3/8", "G1/2", "G3/4", "G1"]
type = "enum"

[params.rod_diameter]
default = 36
editable = false
label = "Rod Diameter"
type = "float"
unit = "mm"

[params.stroke]
default = 200
editable = true
label = "Stroke"
max = 5000
min = 25
type = "float"
unit = "mm"
ports = []

[[hydraulic_ports]]
direction = "bidirectional"
id = "A"
notes = "port A — extend (piston side)"
pressure_max = "{operating_pressure}bar"
type = "hydraulic"

[[hydraulic_ports]]
direction = "bidirectional"
id = "B"
notes = "port B — retract (rod side)"
pressure_max = "{operating_pressure}bar"
type = "hydraulic"

[[sensor_slots]]
compatible_sensors = ["hyd-pressure-switch-no", "sensor-limit-switch"]
id = "S1"
position = "retracted-end"

[[sensor_slots]]
compatible_sensors = ["hyd-pressure-switch-no", "sensor-limit-switch"]
id = "S2"
position = "extended-end"

[simulation]
bidirectional = true
dynamic = true
leakage_model = true
model = "hydraulic-linear-actuator"
motion = "linear"
noise_model = false
position_feedback = true
states = ["retracted", "extending", "extended", "retracting"]
thermal_model = false
velocity_model = "simplified"

[limits]

[limits.max_force]
extend = "calc:pi*(bore/2)^2 * operating_pressure * 0.1"
retract = "calc:pi*((bore/2)^2-(rod_diameter/2)^2) * operating_pressure * 0.1"
max_pressure = "{operating_pressure}"
max_temp = 80
min_pressure = 10
min_temp = -20
warnings = ["Differential area between piston and rod side causes speed/force asymmetry during extend vs retract strokes", "Hydraulic pressure can be lethal — ensure system is depressurised before maintenance", "Use a 4/2 or 4/3 directional control valve for standard operation"]

[connections]
allowed_with = ["hyd-valve-4-2-*", "hyd-valve-4-3-*", "hyd-flow-control-*", "hyd-check-valve", "hyd-manifold-block"]
forbidden_with = ["pneu-*", "act-motor-*"]
requires = ["hyd-power-unit"]
typical_context = ["heavy-lifting", "pressing", "clamping", "steering", "industrial-machinery"]

[canvas]
animated = true
height = 40
label_position = "bottom"

[canvas.port_A]
x = 20
y = 0

[canvas.port_B]
x = 100
y = 0
ports_layout = "custom"
value_display = "DA Ø{bore}mm × {stroke}mm"
width = 120

[dendri]
component_family_skill_id = "hydraulics-family"
component_profile_id = "hyd-cylinder-da"
palette_group = "Hydraulics > Hydraulic Actuators"
simulation_engine = "hydraulic-motion"
svg_path = "content/assets/svg/components/hyd-cylinder-da.svg"
tags = ["cylinder", "hydraulic", "double-acting", "actuator", "linear"]
svg_status = "missing"
