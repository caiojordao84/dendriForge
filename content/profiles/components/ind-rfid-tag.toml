[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "ind-rfid-tag-profile"

[identification]
category = "node"
family = "communication"
id = "ind-rfid-tag"
image = "ind-rfid-tag.svg"
name = "Industrial RFID Tag (Tag RFID Industrial)"
standard = "ISO/IEC 15693"
subfamily = "wireless"
symbol = "ind-rfid-tag-symbol.svg"
symbol_standard = "custom"

[params.frequency_band]
default = "HF-13.56MHz"
editable = true
label = "Frequency Band"
options = ["LF-125kHz", "HF-13.56MHz", "UHF-860MHz"]
type = "enum"

[params.mounting_type]
default = "on-metal"
editable = true
label = "Mounting Type"
options = ["on-metal", "flush", "non-metal"]
type = "enum"

[params.uid]
default = "E0:04:01:00:00:00:00:00"
editable = true
label = "Tag UID (Hex)"
type = "string"

[params.user_memory]
default = 896
editable = false
label = "User Memory"
type = "float"
unit = "bytes"
ports = []

[[protocol_ports]]
direction = "bidirectional"
id = "RF"
notes = "wireless RF interface"
protocol = "ISO-15693"

[simulation]
bidirectional = true
dynamic = true
model = "digital-io"
noise_model = false
protocol_emulation = true
states = ["idle", "transmitting"]
thermal_model = false

[limits]
ip_rating = "IP68"
max_temp = 85
min_temp = -25
warnings = ["Passive rugged tag — powered entirely by the reader's RF field", "Select correct mounting type (e.g. 'on-metal') to prevent detuning of the antenna"]

[connections]
allowed_with = ["comm-rfid-industrial*", "comm-*"]
forbidden_with = []
requires = []
typical_context = ["traceability", "asset-tracking", "harsh-environments", "logistics"]

[canvas]
animated = true
height = 20
