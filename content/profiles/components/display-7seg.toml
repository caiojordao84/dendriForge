[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "display-7seg-profile"

[identification]
category = "signal"
family = "electricals"
id = "display-7seg"
image = "display-7seg.svg"
name = "7-Segment Display"
standard = "IEC 60810"
subfamily = "displays"
symbol = "display-7seg-symbol.svg"
symbol_standard = "IEC"

[params.brightness]
default = 50
editable = true
label = "Brightness"
max = 100
min = 0
type = "float"
unit = "%"

[params.color]
default = "red"
editable = true
label = "LED Color"
options = ["red", "green", "blue", "yellow", "amber", "white"]
type = "enum"

[params.decimal_point]
default = true
editable = true
label = "Decimal Point"
type = "bool"

[params.digits]
default = 1
editable = true
label = "Number of Digits"
options = [1, 2, 3, 4, 6, 8]
type = "enum"

[params.display_type]
default = "common-cathode"
editable = true
label = "Display Type"
options = ["common-cathode", "common-anode"]
type = "enum"

[params.if_max]
default = 0.03
editable = false
label = "Absolute Max Segment Current"
max = 0.1
min = 0.005
type = "float"
unit = "A"

[params.if_rated]
default = 0.02
editable = true
label = "Rated Segment Current"
options = [0.005, 0.01, 0.02, 0.03, 0.05]
type = "enum"
unit = "A"

[params.package]
default = "14-pin"
editable = true
label = "Package"
options = ["10-pin", "12-pin", "14-pin", "16-pin", "20-pin", "24-pin"]
type = "enum"

[params.vf_segment]
default = 2.0
editable = false
label = "Segment Forward Voltage"
max = 4.5
min = 1.5
type = "float"
unit = "V"

[[ports]]
current_max = "100mA"
direction = "input"
id = "A"
notes = "segment a"
type = "power"
voltage_max = "5V"

[[ports]]
