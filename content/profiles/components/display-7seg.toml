[simulation]
bidirectional = false
dynamic = false
equation = "segments = {a,b,c,d,e,f,g,dp}; brightness = f(if_rated)"
model = "basic-analog"
noise_model = false
states = ["off", "active", "fault"]
thermal_model = false

[limits]
max_current = "100mA"
max_temp = 85
max_voltage = "5V"
min_temp = -40
warnings = ["Each segment requires its own current-limiting resistor or constant-current driver", "Common-anode and common-cathode variants require inverted drive logic", "Do not drive all segments simultaneously without checking supply current budget", "Use multiplexing timing within persistence-of-vision limits to avoid flicker"]

[connections]
allowed_with = ["*"]
forbidden_with = []
requires = []
typical_context = ["numeric-display", "clock-display", "panel-meter", "counter", "status-display"]

