# component profile — hyd-valve-4-3 (migrated from legacy TOON)
# Source: hyd-valve-4-3.toon
# ASL 0.0.1 lives on program IR (metadata.asl_version), not profiles.


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "hyd-valve-4-3-profile"

[identification]
category = "valve"
family = "hydraulics"
id = "hyd-valve-4-3"
image = "hyd-valve-4-3.svg"
name = "4/3 Directional Control Valve (Válvula hidráulica 4/3 Vias)"
standard = "ISO 1219-1"
subfamily = "directional-valves"
symbol = "hyd-valve-4-3-symbol.svg"
symbol_standard = "ISO"

[params.actuation_type]
default = "solenoid"
editable = true
label = "Actuation Type (Acionamento)"
options = ["solenoid", "manual-lever", "hydraulic-pilot"]
type = "enum"

[params.center_position]
default = "closed"
editable = true
label = "Center Position Type (Tipo de Centro)"
options = ["closed", "tandem", "open", "float"]
type = "enum"

[params.flow_rate]
default = 40
editable = true
label = "Nominal Flow Rate"
max = 150
min = 5
type = "float"
unit = "l/min"

[params.operating_pressure]
default = 250
editable = false
label = "Max Operating Pressure"
max = 350
min = 10
type = "float"
unit = "bar"

[params.return_type]
default = "spring"
editable = true
label = "Return Mechanism (Retorno)"
options = ["spring", "hydraulic-pilot"]
type = "enum"

[[ports]]
current_max = "1.5A"
direction = "input"
id = "SOL_A_VCC"
notes = "solenoid A power (actuate position A)"
type = "power"
voltage_max = "24V"

[[ports]]
direction = "input"
id = "SOL_A_GND"
notes = "solenoid A ground"
type = "ground"

[[ports]]
current_max = "1.5A"
direction = "input"
id = "SOL_B_VCC"
notes = "solenoid B power (actuate position B)"
type = "power"
voltage_max = "24V"

[[ports]]
direction = "input"
id = "SOL_B_GND"
notes = "solenoid B ground"
type = "ground"

[[hydraulic_ports]]
direction = "input"
flow_max = "{flow_rate}"
id = "P"
notes = "pressure supply port"
pressure_max = "250bar"
type = "hydraulic"

[[hydraulic_ports]]
direction = "output"
flow_max = "{flow_rate}"
id = "T"
notes = "tank return port"
pressure_max = "10bar"
type = "hydraulic"

[[hydraulic_ports]]
direction = "bidirectional"
flow_max = "{flow_rate}"
id = "A"
notes = "work port A"
pressure_max = "250bar"
type = "hydraulic"

[[hydraulic_ports]]
direction = "bidirectional"
flow_max = "{flow_rate}"
id = "B"
notes = "work port B"
pressure_max = "250bar"
type = "hydraulic"

[simulation]
bidirectional = false
dynamic = true
leakage_model = true
model = "hydraulic-valve"
motion = "none"
noise_model = false
states = ["center-state", "position-a-active", "position-b-active"]
thermal_model = false

[limits]
ip_rating = "IP65"
max_current = "1.5A"
max_pressure = 250
max_temp = 80
max_voltage = "24V"
min_pressure = 0
min_temp = -20
warnings = ["Closed center traps fluid in A/B, blocking actuator movement (internal leakage may cause drift).", "Tandem center connects P->T, unloading pump, while A/B are blocked.", "Open center connects P, T, A, B together; used to freely move actuator and unload pump.", "Float center blocks P but connects A/B->T; actuator floats but pump is under pressure."]

[connections]
allowed_with = ["hyd-cylinder-da-*", "hyd-motor-*", "hyd-power-unit", "hyd-check-valve", "relay-*", "plc-*", "mcu-*", "ind-do-bank", "dc-source", "ac-source"]
forbidden_with = ["pneu-*"]
requires = ["hyd-power-unit"]
typical_context = ["directional-control", "load-holding", "pump-unloading"]

[canvas]
animated = true
height = 60
label_position = "bottom"

[canvas.port_A]
x = 50
y = 60

[canvas.port_B]
x = 70
y = 60

[canvas.port_P]
x = 50
y = 0

[canvas.port_SOL_A_GND]
x = 0
y = 40

[canvas.port_SOL_A_VCC]
x = 0
y = 20

[canvas.port_SOL_B_GND]
x = 120
y = 40

[canvas.port_SOL_B_VCC]
x = 120
y = 20

[canvas.port_T]
x = 70
y = 0
ports_layout = "custom"
value_display = "4/3 {center_position}-center"
width = 120

[dendri]
component_family_skill_id = "hydraulics-family"
component_profile_id = "hyd-valve-4-3"
palette_group = "Hydraulics > Directional Valves"
simulation_engine = "hydraulic-motion"
svg_path = "content/assets/svg/components/hyd-valve-4-3.svg"
tags = ["valve", "size-4-3", "directional", "hydraulic", "center-closed", "solenoid", "double-acting"]
svg_status = "missing"
