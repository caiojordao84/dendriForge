# component profile — hyd-cylinder-sa-spring (migrated from legacy TOON)
# Source: hyd-cylinder-sa-spring.toon
# DEN-14: do not assign ASL 0.0.1


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "hyd-cylinder-sa-spring-profile"

[identification]
category = "actuator"
family = "hydraulics"
id = "hyd-cylinder-sa-spring"
image = "hyd-cylinder-sa-spring.svg"
name = "Single-Acting Hydraulic Cylinder (Cilindro hid. simples efeito mola)"
standard = "ISO 6020-2"
subfamily = "hydraulic-actuators"
symbol = "hyd-cylinder-sa-spring-symbol.svg"
symbol_standard = "ISO"

[params.bore]
default = 40
editable = true
label = "Bore Diameter"
options = [25, 32, 40, 50, 63, 80, 100]
type = "enum"
unit = "mm"

[params.operating_pressure]
default = 150
editable = true
label = "Operating Pressure"
max = 250
min = 10
type = "float"
unit = "bar"

[params.port_size]
default = "G3/8"
editable = true
label = "Port Size"
options = ["G1/4", "G3/8", "G1/2", "G3/4"]
type = "enum"

[params.stroke]
default = 100
editable = true
label = "Stroke"
max = 500
min = 25
type = "float"
unit = "mm"
ports = []

[[hydraulic_ports]]
direction = "bidirectional"
id = "A"
notes = "port A — extend"
pressure_max = "{operating_pressure}bar"
type = "hydraulic"

[[sensor_slots]]
compatible_sensors = ["hyd-pressure-switch-no", "sensor-limit-switch"]
id = "S1"
position = "retracted-end"

[[sensor_slots]]
compatible_sensors = ["hyd-pressure-switch-no", "sensor-limit-switch"]
id = "S2"
position = "extended-end"

[simulation]
bidirectional = false
dynamic = true
leakage_model = true
model = "hydraulic-linear-actuator"
motion = "linear"
noise_model = false
position_feedback = true
states = ["retracted", "extending", "extended", "retracting"]
thermal_model = false
velocity_model = "simplified"

[limits]

[limits.max_force]
extend = "calc:pi*(bore/2)^2 * operating_pressure * 0.1"
max_pressure = "{operating_pressure}"
max_temp = 80
min_pressure = 10
min_temp = -20
warnings = ["Retract stroke is driven purely by the internal mechanical spring; do not apply excessive retracting loads", "Ensure cylinder has a breather port on the non-pressurised side to prevent vacuum formation"]

[connections]
allowed_with = ["hyd-valve-3-2-*", "hyd-flow-control-*", "hyd-check-valve", "hyd-manifold-block"]
forbidden_with = ["pneu-*", "act-motor-*"]
requires = ["hyd-power-unit"]
typical_context = ["clamping", "lifting", "pressing", "holding"]

[canvas]
animated = true
height = 40
label_position = "bottom"

[canvas.port_A]
x = 20
y = 0
ports_layout = "custom"
value_display = "SA Ø{bore}mm × {stroke}mm"
width = 120

[dendri]
component_family_skill_id = "hydraulics-family"
component_profile_id = "hyd-cylinder-sa-spring"
palette_group = "Hydraulics > Hydraulic Actuators"
simulation_engine = "hydraulic-motion"
svg_path = "content/assets/svg/components/hyd-cylinder-sa-spring.svg"
tags = ["cylinder", "hydraulic", "single-acting", "spring-return", "actuator"]
svg_status = "missing"
