min_temp = -20
warnings = ["Each core should be current-limited according to the manufacturer specification", "Do not exceed the rated supply voltage or the lamp modules may fail", "Stack height and mounting affect visibility and ingress protection", "Use the correct color sequence for the intended alarm or status convention"]

