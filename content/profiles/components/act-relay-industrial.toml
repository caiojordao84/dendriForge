[simulation]
bidirectional = false
dynamic = true
model = "relay-coil"
noise_model = false
states = ["de-energised", "energised", "fault"]
thermal_model = false

[limits]
max_current = "25A"

[limits.max_power]
unit = "W"
value = 2.4
max_temp = 85
max_voltage = "400V"
min_temp = -40
warnings = ["Always install flyback protection on the coil supply when driven by MCU or PLC outputs", "Do not exceed rated contact current — use contactor for loads above 16A", "Contact bounce may occur at switching; use debounce logic for digital inputs", "Coil pickup and dropout voltages define safe operating voltage window"]

[connections]
allowed_with = ["relay-driver", "relay-driver-opto", "ind-do-bank", "mcu-gpio", "dc-source", "ac-source", "pneu-valve-*", "hyd-valve-*", "act-motor-*"]
