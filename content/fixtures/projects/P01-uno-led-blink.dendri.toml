# Single-file simulation project — hardware + wiring + sources + ASL
# Visual MVP hooks: arduino-uno-r3 + led (+ button profile reserved)
# P1 text frontends (DEN-7): cpp / micropython / st texts filled from ASL; ladder/sfc remain DEN-8 stubs.

[metadata]
project_name = "P01-uno-led-blink"
editor = "dendriForge"
author = "dendriForge Phase 1"
notes = "Portable project: reopen without external dependency loss"

[board]
profile = "arduino-uno-r3"
instance_id = "board"

[[components]]
instance_id = "led1"
profile = "led"
params = { color = "red" }

[[components]]
instance_id = "btn_start"
profile = "cmd-pushbutton-no-start"

[[wiring]]
from = "board.D13"
to = "led1.A"
signal = "digital"

[[wiring]]
from = "board.GND"
to = "led1.K"
signal = "gnd"

[[wiring]]
from = "board.D2"
to = "btn_start.NO1"
signal = "digital"

[[sources]]
language = "st"
name = "main"
text = """
(* DendriForge ST frontend — MVP subset *)
(* project: P01-uno-led-blink-asl *)
PROGRAM MAIN
(* hardware *)
(* HW: pin=13 type=Digital mode=Do label=ledPin role=digital-out *)
VAR
    CONSTANT INTERVAL : TIME := T#250ms;
    ledState : BOOL := FALSE;
END_VAR

SETUP
    CFG_DIGITAL_OUTPUT(13);

LOOP
    ledState := NOT (ledState);
    SET_BOOL(13, ledState);
    WAIT_TIME(INTERVAL);
END_PROGRAM
"""
path_hint = "main.st"

[[sources]]
language = "cpp"
name = "main"
text = """
// DendriForge C++ frontend — MVP Arduino subset
// project: P01-uno-led-blink-asl

const int ledPin = 13;

const unsigned long INTERVAL = 250UL;
bool ledState = false;

void setup() {
  pinMode(ledPin, OUTPUT);
}

void loop() {
  ledState = !(ledState);
  digitalWrite(ledPin, ledState);
  delay(INTERVAL);
}
"""
path_hint = "main.cpp"

[[sources]]
language = "micropython"
name = "main"
text = """
# DendriForge MicroPython frontend — MVP subset
# project: P01-uno-led-blink-asl
from machine import Pin
from time import sleep_ms

LED_PIN = 13

INTERVAL = 250
ledState = False

led_pin = None

def setup():
    global led_pin
    led_pin = Pin(LED_PIN, Pin.OUT)

def loop():
    global ledState
    ledState = (not ledState)
    led_pin.value(ledState)
    sleep_ms(INTERVAL)

setup()
while True:
    loop()
"""
path_hint = "main.py"

