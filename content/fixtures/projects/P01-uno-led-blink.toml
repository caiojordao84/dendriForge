# P01 — UNO + modular LED (integrated 220Ω) + start button on D2–GND with pull-up.
# ASL is the sole source of truth; backends emit into build/ on export.
# Button is active-low: pressed → LOW; ASL uses NOT GET_BOOL (no backend invert).

[metadata]
asl_version = "0.0.1"
project_name = "P01-uno-led-blink"
editor = "dendriForge"
author = "dendriForge Phase 1"
notes = "Portable project: board + wiring + ASL only (no embedded sources). Integrated-resistance LED module; button pull-up."

[board]
profile = "arduino-uno-r3"
instance_id = "board"

[[components]]
instance_id = "led1"
profile = "led"
label = "Status LED"

[components.params]
color = "red"
integrated_resistance = 220

[[components]]
instance_id = "btn_start"
profile = "cmd-pushbutton-no-start"
label = "Start button"

[components.params]

# D13 → LED anode; LED cathode → GND (series R is integrated in the module)
[[wiring]]
from = "board.D13"
to = "led1.A"
signal = "digital"

[[wiring]]
from = "board.GND"
to = "led1.K"
signal = "gnd"

# Button: D2 ← NO, COM → GND; MCU INPUT_PULLUP (active-low when pressed)
[[wiring]]
from = "board.D2"
to = "btn_start.NO"
signal = "digital"

[[wiring]]
from = "board.GND"
to = "btn_start.COM"
signal = "gnd"

[asl]
functions = []

[asl.metadata]
asl_version = "0.0.1"
project_name = "P01-uno-led-blink"
editor = "dendriForge"
author = "dendriForge Phase 1"
notes = "Logical IO names in actions; pins only via hardware + wiring; pullup on btnPin"

[[asl.hardware]]
pin = 13
hw_type = "digital"
io_mode = "DO"
label = "ledPin"
target_role = "digital-out"

[[asl.hardware]]
pin = 2
hw_type = "digital"
io_mode = "DI"
label = "btnPin"
target_role = "digital-in"
pull = "pullup"

[[asl.data]]
name = "INTERVAL"
type = "TIME"
scope = "CONST"
init = "T#250ms"
unit = "ms"

[[asl.data]]
name = "ledState"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[asl.data]]
name = "pressed"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[asl.setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "var", name = "ledPin" }]

[[asl.setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "var", name = "btnPin" }]

[[asl.setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "var", name = "ledPin" }, { kind = "bool", value = false }]

[[asl.loop]]
kind = "assign"
target = "pressed"

[asl.loop.value]
kind = "unary"
op = "not"

[asl.loop.value.expr]
kind = "call"
name = "GET_BOOL"
args = [{ kind = "var", name = "btnPin" }]

[[asl.loop]]
kind = "if"
condition = { kind = "var", name = "pressed" }
then = [
  { kind = "assign", target = "ledState", value = { kind = "unary", op = "not", expr = { kind = "var", name = "ledState" } } },
  { kind = "call", name = "SET_BOOL", args = [{ kind = "var", name = "ledPin" }, { kind = "var", name = "ledState" }] },
  { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "INTERVAL" }] },
]
else = [
  { kind = "call", name = "SET_BOOL", args = [{ kind = "var", name = "ledPin" }, { kind = "var", name = "ledState" }] },
]
