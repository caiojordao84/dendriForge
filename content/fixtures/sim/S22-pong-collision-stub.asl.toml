# Sim S22 — Pong wall/paddle collision stub (scenario 10)
# Forced ball update each scan; OLED pixel + PLAY_TONE on bounce.

[metadata]
asl_version = "0.0.1"
project_name = "S22-pong-collision-stub"
editor = "dendriForge"
author = "dendriForge DEN-21"
notes = "Collision + tone evidence; full interactive Pong still partial"

[[hardware]]
pin = 11
hw_type = "digital"
io_mode = "DO"
label = "buzzer"
target_role = "pwm-out"

[[data]]
name = "WHITE"
type = "UINT"
scope = "CONST"
init = "1"
unit = "-"

[[data]]
name = "TONE_MS"
type = "TIME"
scope = "CONST"
init = "T#30ms"
unit = "ms"

[[data]]
name = "ballX"
type = "UINT"
scope = "VAR"
init = "0"
unit = "px"

[[data]]
name = "paddleY"
type = "UINT"
scope = "VAR"
init = "20"
unit = "px"

[[data]]
name = "score"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[setup]]
kind = "call"
name = "CFG_OLED"
args = [{ kind = "hex", value = "0x3C" }]

[[setup]]
kind = "call"
name = "CFG_PWM_OUTPUT"
args = [{ kind = "uint", value = 11 }, { kind = "uint", value = 1000 }]

[[loop]]
kind = "call"
name = "OLED_CLEAR"
args = []

# Wall hit at x==0 → bounce tone + score, then nudge right.
[[loop]]
kind = "if"
condition = { kind = "binop", op = "eq", left = { kind = "var", name = "ballX" }, right = { kind = "uint", value = 0 } }
then = [
  { kind = "assign", target = "score", value = { kind = "binop", op = "add", left = { kind = "var", name = "score" }, right = { kind = "uint", value = 1 } } },
  { kind = "call", name = "PLAY_TONE", args = [{ kind = "uint", value = 11 }, { kind = "uint", value = 880 }, { kind = "var", name = "TONE_MS" }] },
  { kind = "assign", target = "ballX", value = { kind = "uint", value = 1 } },
]
else = [
  { kind = "assign", target = "ballX", value = { kind = "binop", op = "add", left = { kind = "var", name = "ballX" }, right = { kind = "uint", value = 1 } } },
]

[[loop]]
kind = "call"
name = "OLED_DRAW_PIXEL"
args = [
  { kind = "var", name = "ballX" },
  { kind = "var", name = "paddleY" },
  { kind = "var", name = "WHITE" },
]

[[loop]]
kind = "call"
name = "OLED_FILL_RECT"
args = [
  { kind = "uint", value = 0 },
  { kind = "var", name = "paddleY" },
  { kind = "uint", value = 2 },
  { kind = "uint", value = 8 },
  { kind = "var", name = "WHITE" },
]

[[loop]]
kind = "call"
name = "OLED_DISPLAY"
args = []
