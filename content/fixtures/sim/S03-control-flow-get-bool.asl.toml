# Sim fixture S03 — control flow + GET_BOOL + typed data (sim MVP opcodes)
# Covers: CFG_DIGITAL_INPUT/OUTPUT, GET_BOOL, SET_BOOL, WAIT_TIME,
# if/elif/else, for, BOOL/UINT/INT/TIME. No PWM/ADC/UART (priority 2).

[metadata]
project_name = "S03-control-flow-get-bool"
editor = "dendriForge"
author = "dendriForge Phase 1"
notes = "Frontend depth fixture — control flow + GET/SET honesty on current sim set"

[[hardware]]
pin = 2
hw_type = "digital"
io_mode = "DI"
label = "btnPin"
target_role = "digital-in"

[[hardware]]
pin = 13
hw_type = "digital"
io_mode = "DO"
label = "ledPin"
target_role = "digital-out"

[[data]]
name = "PULSE"
type = "TIME"
scope = "CONST"
init = "T#50ms"
unit = "ms"

[[data]]
name = "LIMIT"
type = "UINT"
scope = "CONST"
init = "3"
unit = "-"

[[data]]
name = "pressed"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "count"
type = "INT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "mode"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "uint", value = 2 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 13 }]

[[setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "uint", value = 13 }, { kind = "bool", value = false }]

[[loop]]
kind = "assign"
target = "pressed"
value = { kind = "call", name = "GET_BOOL", args = [{ kind = "uint", value = 2 }] }

[[loop]]
kind = "if"
condition = { kind = "var", name = "pressed" }
then = [
  { kind = "assign", target = "mode", value = { kind = "uint", value = 1 } },
  { kind = "call", name = "SET_BOOL", args = [
    { kind = "uint", value = 13 },
    { kind = "bool", value = true },
  ] },
]
elif = [
  { condition = { kind = "binop", op = "eq", left = { kind = "var", name = "mode" }, right = { kind = "uint", value = 1 } }, then = [
    { kind = "assign", target = "mode", value = { kind = "uint", value = 2 } },
    { kind = "call", name = "SET_BOOL", args = [
      { kind = "uint", value = 13 },
      { kind = "bool", value = false },
    ] },
  ] },
]
else = [
  { kind = "for", counter = "i", to = { kind = "var", name = "LIMIT" }, body = [
    { kind = "assign", target = "count", value = { kind = "var", name = "i" } },
  ] },
  { kind = "call", name = "SET_BOOL", args = [
    { kind = "uint", value = 13 },
    { kind = "bool", value = false },
  ] },
]

[[loop]]
kind = "call"
name = "WAIT_TIME"
args = [{ kind = "var", name = "PULSE" }]
