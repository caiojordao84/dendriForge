# Scenario 1 subset — 3-mode blink (OFF / slow / fast) via R_TRIG on button.
# Runnable on current sim: GPIO + R_TRIG + WAIT_TIME. Debounce soft (no TIME_DIFF).
# Drive pin 2 from the test harness / canvas between scans for mode changes.

[metadata]
asl_version = "0.0.1"
project_name = "S08-scenario1-three-mode-blink"
editor = "dendriForge"
author = "dendriForge Priority 6"
notes = "MVP scenario 1 composition — DEN-15"

[[hardware]]
pin = 2
hw_type = "digital"
io_mode = "DI"
label = "btnPin"
target_role = "digital-in"

[[hardware]]
pin = 13
hw_type = "digital"
io_mode = "DO"
label = "ledPin"
target_role = "digital-out"

[[data]]
name = "MODE_OFF"
type = "UINT"
scope = "CONST"
init = "0"
unit = "-"

[[data]]
name = "MODE_SLOW"
type = "UINT"
scope = "CONST"
init = "1"
unit = "-"

[[data]]
name = "MODE_FAST"
type = "UINT"
scope = "CONST"
init = "2"
unit = "-"

[[data]]
name = "SLOW_TIME"
type = "TIME"
scope = "CONST"
init = "T#200ms"
unit = "ms"

[[data]]
name = "FAST_TIME"
type = "TIME"
scope = "CONST"
init = "T#50ms"
unit = "ms"

[[data]]
name = "IDLE_TIME"
type = "TIME"
scope = "CONST"
init = "T#50ms"
unit = "ms"

[[data]]
name = "btn"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "rise"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "mode"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "ledState"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "var", name = "btnPin" }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "var", name = "ledPin" }]

[[setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "var", name = "ledPin" }, { kind = "bool", value = false }]

[[loop]]
kind = "assign"
target = "btn"
value = { kind = "call", name = "GET_BOOL", args = [{ kind = "var", name = "btnPin" }] }

[[loop]]
kind = "assign"
target = "rise"
value = { kind = "call", name = "R_TRIG", args = [
  { kind = "string", value = "rt_btn" },
  { kind = "var", name = "btn" },
]}

[[loop]]
kind = "if"
condition = { kind = "var", name = "rise" }
then = [
  { kind = "assign", target = "mode", value = { kind = "expr_text", text = "MOD(mode + 1, 3)" } },
  { kind = "assign", target = "ledState", value = { kind = "bool", value = false } },
]

[[loop]]
kind = "if"
condition = { kind = "binop", op = "eq", left = { kind = "var", name = "mode" }, right = { kind = "var", name = "MODE_OFF" } }
then = [
  { kind = "call", name = "SET_BOOL", args = [{ kind = "var", name = "ledPin" }, { kind = "bool", value = false }] },
  { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "IDLE_TIME" }] },
]
elif = [
  { condition = { kind = "binop", op = "eq", left = { kind = "var", name = "mode" }, right = { kind = "var", name = "MODE_SLOW" } }, then = [
    { kind = "assign", target = "ledState", value = { kind = "unary", op = "not", expr = { kind = "var", name = "ledState" } } },
    { kind = "call", name = "SET_BOOL", args = [{ kind = "var", name = "ledPin" }, { kind = "var", name = "ledState" }] },
    { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "SLOW_TIME" }] },
  ]},
  { condition = { kind = "binop", op = "eq", left = { kind = "var", name = "mode" }, right = { kind = "var", name = "MODE_FAST" } }, then = [
    { kind = "assign", target = "ledState", value = { kind = "unary", op = "not", expr = { kind = "var", name = "ledState" } } },
    { kind = "call", name = "SET_BOOL", args = [{ kind = "var", name = "ledPin" }, { kind = "var", name = "ledState" }] },
    { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "FAST_TIME" }] },
  ]},
]
