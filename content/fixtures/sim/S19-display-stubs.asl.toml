# Sim S19 — LCD / OLED / TFT stubs + PLAY_TONE (scenario 10 honesty)
# Multi-display page flip + tone; full Pong collision stays partial elsewhere.

[metadata]
project_name = "S19-display-stubs"
editor = "dendriForge"
author = "dendriForge DEN-18"
notes = "Display + tone stubs — DEN-18 (scenario 10 subset)"

[[hardware]]
pin = 11
hw_type = "digital"
io_mode = "DO"
label = "buzzer"
target_role = "pwm-out"

[[data]]
name = "page"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "tempC"
type = "REAL"
scope = "CONST"
init = "28.5"
unit = "C"

[[data]]
name = "ldrPct"
type = "UINT"
scope = "CONST"
init = "72"
unit = "%"

[[data]]
name = "COLOR_BG"
type = "UINT"
scope = "CONST"
init = "0"
unit = "-"

[[data]]
name = "COLOR_FG"
type = "UINT"
scope = "CONST"
init = "65535"
unit = "-"

[[data]]
name = "WHITE"
type = "UINT"
scope = "CONST"
init = "1"
unit = "-"

[[data]]
name = "BLACK"
type = "UINT"
scope = "CONST"
init = "0"
unit = "-"

[[data]]
name = "msg"
type = "STRING"
scope = "VAR"
init = "\"\""
unit = "-"

[[setup]]
kind = "call"
name = "CFG_I2C"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 21 }, { kind = "uint", value = 22 }, { kind = "int", value = 400000 }]

[[setup]]
kind = "call"
name = "CFG_LCD"
args = [{ kind = "hex", value = "0x27" }, { kind = "uint", value = 16 }, { kind = "uint", value = 2 }]

[[setup]]
kind = "call"
name = "CFG_OLED"
args = [{ kind = "hex", value = "0x3C" }]

[[setup]]
kind = "call"
name = "CFG_TFT"
args = [{ kind = "uint", value = 2 }, { kind = "int", value = -1 }, { kind = "int", value = 5 }]

[[setup]]
kind = "call"
name = "LCD_PRINT"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "Multi-disp" }]

[[loop]]
kind = "call"
name = "OLED_CLEAR"
args = []

[[loop]]
kind = "call"
name = "LCD_CLEAR"
args = []

[[loop]]
kind = "call"
name = "TFT_FILL"
args = [{ kind = "var", name = "COLOR_BG" }]

[[loop]]
kind = "call"
name = "TFT_SET_TEXT_COLOR"
args = [{ kind = "var", name = "COLOR_FG" }, { kind = "var", name = "COLOR_BG" }]

[[loop]]
kind = "call"
name = "TFT_SET_TEXT_SIZE"
args = [{ kind = "uint", value = 2 }]

[[loop]]
kind = "assign"
target = "msg"
value = { kind = "expr_text", text = "CONCAT(\"T=\", TO_STRING_FMT(tempC, 1))" }

[[loop]]
kind = "call"
name = "TFT_PRINT"
args = [{ kind = "uint", value = 10 }, { kind = "uint", value = 20 }, { kind = "var", name = "msg" }]

[[loop]]
kind = "call"
name = "TFT_DRAW_ROUND_RECT"
args = [
  { kind = "uint", value = 4 },
  { kind = "uint", value = 4 },
  { kind = "uint", value = 120 },
  { kind = "uint", value = 60 },
  { kind = "uint", value = 4 },
  { kind = "var", name = "COLOR_FG" },
]

[[loop]]
kind = "call"
name = "OLED_SET_TEXT_COLOR"
args = [{ kind = "var", name = "WHITE" }, { kind = "var", name = "BLACK" }]

[[loop]]
kind = "call"
name = "OLED_SET_CURSOR"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }]

[[loop]]
kind = "call"
name = "OLED_PRINT"
args = [{ kind = "string", value = "LIGHT" }]

[[loop]]
kind = "call"
name = "OLED_DRAW_RECT"
args = [
  { kind = "uint", value = 0 },
  { kind = "uint", value = 28 },
  { kind = "uint", value = 102 },
  { kind = "uint", value = 10 },
  { kind = "var", name = "WHITE" },
]

[[loop]]
kind = "call"
name = "OLED_FILL_RECT"
args = [
  { kind = "uint", value = 1 },
  { kind = "uint", value = 29 },
  { kind = "var", name = "ldrPct" },
  { kind = "uint", value = 8 },
  { kind = "var", name = "WHITE" },
]

[[loop]]
kind = "call"
name = "OLED_DRAW_VLINE"
args = [
  { kind = "uint", value = 12 },
  { kind = "uint", value = 8 },
  { kind = "uint", value = 16 },
  { kind = "var", name = "WHITE" },
]

[[loop]]
kind = "call"
name = "OLED_DRAW_PIXEL"
args = [{ kind = "uint", value = 64 }, { kind = "uint", value = 32 }, { kind = "var", name = "WHITE" }]

[[loop]]
kind = "call"
name = "OLED_DISPLAY"
args = []

[[loop]]
kind = "call"
name = "LCD_PRINT"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "page0 env" }]

[[loop]]
kind = "call"
name = "LCD_PRINT"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 1 }, { kind = "var", name = "msg" }]

[[loop]]
kind = "call"
name = "PLAY_TONE"
args = [{ kind = "uint", value = 11 }, { kind = "uint", value = 440 }, { kind = "time", value = "T#50ms" }]

[[loop]]
kind = "assign"
target = "page"
value = { kind = "uint", value = 1 }
