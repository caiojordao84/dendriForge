# Sim S16 — ISR ring-buffer capture + main-loop drain (scenario 8 / G12 core)

[metadata]
asl_version = "0.0.1"
project_name = "S16-isr-ring-buffer"
editor = "dendriForge"
author = "dendriForge DEN-17"
notes = "Ring buffer head/tail + overflow — DEN-17"

[[hardware]]
pin = 14
hw_type = "digital"
io_mode = "DI"
label = "capturePin"
target_role = "int-rising"

[[hardware]]
pin = 15
hw_type = "digital"
io_mode = "DO"
label = "ledOverflow"
target_role = "digital-out"

[[hardware]]
pin = 16
hw_type = "digital"
io_mode = "DO"
label = "ledDraining"
target_role = "digital-out"

[[data]]
name = "BUF_SIZE"
type = "UINT"
scope = "CONST"
init = "4"
unit = "-"

[[data]]
name = "buf0"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "us"

[[data]]
name = "buf1"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "us"

[[data]]
name = "buf2"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "us"

[[data]]
name = "buf3"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "us"

[[data]]
name = "bufHead"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "bufTail"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "nextHead"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "bufOverflow"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "captureCount"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "drainCount"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "nowUs"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "us"

[[data]]
name = "slotVal"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "us"

[[setup]]
kind = "call"
name = "CFG_SERIAL"
args = [{ kind = "uint", value = 115200 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "uint", value = 14 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 15 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 16 }]

[[setup]]
kind = "call"
name = "CFG_ATTACH_INTERRUPT"
args = [{ kind = "uint", value = 14 }, { kind = "var", name = "isr_capture" }, { kind = "string", value = "RISING" }]

[[setup]]
kind = "call"
name = "SERIAL_PRINTLN"
args = [{ kind = "string", value = "idx,ts_us" }]

[[loop]]
kind = "if"
condition = { kind = "var", name = "bufOverflow" }
then = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = true }] }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "string", value = "OVERFLOW" }] }, { kind = "assign", target = "bufOverflow", value = { kind = "bool", value = false } }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "bufHead != bufTail" }
then = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 16 }, { kind = "bool", value = true }] }, { kind = "while", condition = { kind = "expr_text", text = "bufHead != bufTail" }, body = [{ kind = "call", name = "drain_next", args = [] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 16 }, { kind = "bool", value = false }] }] }]
else = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = false }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 16 }, { kind = "bool", value = false }] }]

[[functions]]
name = "isr_capture"
params = []
body = [{ kind = "assign", target = "nowUs", value = { kind = "expr_text", text = "GET_SYS_TIME_US()" } }, { kind = "assign", target = "nextHead", value = { kind = "expr_text", text = "MOD(bufHead + 1, BUF_SIZE)" } }, { kind = "if", condition = { kind = "expr_text", text = "nextHead = bufTail" }, then = [{ kind = "assign", target = "bufOverflow", value = { kind = "bool", value = true } }, { kind = "return" }] }, { kind = "call", name = "buf_write", args = [{ kind = "var", name = "bufHead" }, { kind = "var", name = "nowUs" }] }, { kind = "assign", target = "bufHead", value = { kind = "var", name = "nextHead" } }, { kind = "assign", target = "captureCount", value = { kind = "expr_text", text = "captureCount + 1" } }]

[[functions]]
name = "buf_write"
params = ["idx", "val"]
body = [{ kind = "if", condition = { kind = "expr_text", text = "idx = 0" }, then = [{ kind = "assign", target = "buf0", value = { kind = "var", name = "val" } }], elif = [{ condition = { kind = "expr_text", text = "idx = 1" }, then = [{ kind = "assign", target = "buf1", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "idx = 2" }, then = [{ kind = "assign", target = "buf2", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "idx = 3" }, then = [{ kind = "assign", target = "buf3", value = { kind = "var", name = "val" } }] }] }]

[[functions]]
name = "buf_read"
params = ["idx"]
body = [{ kind = "if", condition = { kind = "expr_text", text = "idx = 0" }, then = [{ kind = "return", value = { kind = "var", name = "buf0" } }], elif = [{ condition = { kind = "expr_text", text = "idx = 1" }, then = [{ kind = "return", value = { kind = "var", name = "buf1" } }] }, { condition = { kind = "expr_text", text = "idx = 2" }, then = [{ kind = "return", value = { kind = "var", name = "buf2" } }] }, { condition = { kind = "expr_text", text = "idx = 3" }, then = [{ kind = "return", value = { kind = "var", name = "buf3" } }] }] }, { kind = "return", value = { kind = "uint", value = 0 } }]

[[functions]]
name = "drain_next"
params = []
body = [{ kind = "assign", target = "slotVal", value = { kind = "call", name = "buf_read", args = [{ kind = "var", name = "bufTail" }] } }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(TO_STRING(drainCount), \",\", TO_STRING(slotVal))" }] }, { kind = "assign", target = "bufTail", value = { kind = "expr_text", text = "MOD(bufTail + 1, BUF_SIZE)" } }, { kind = "assign", target = "drainCount", value = { kind = "expr_text", text = "drainCount + 1" } }]
