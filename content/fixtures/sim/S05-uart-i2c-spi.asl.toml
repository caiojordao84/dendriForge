# Sim snapshot S05 — UART print + I2C/SPI bus config (scenario 2 buses)

[metadata]
asl_version = "0.0.1"
project_name = "S05-uart-i2c-spi"
editor = "dendriForge"
author = "dendriForge Priority 2"
notes = "CFG_SERIAL / SERIAL_PRINTLN / CFG_I2C / CFG_SPI — DEN-11"

[[hardware]]
pin = 21
hw_type = "digital"
io_mode = "BI"
label = "sdaPin"
target_role = "i2c-sda"

[[hardware]]
pin = 22
hw_type = "digital"
io_mode = "BI"
label = "sclPin"
target_role = "i2c-scl"

[[hardware]]
pin = 23
hw_type = "digital"
io_mode = "DO"
label = "mosiPin"
target_role = "spi-mosi"

[[hardware]]
pin = 19
hw_type = "digital"
io_mode = "DI"
label = "misoPin"
target_role = "spi-miso"

[[hardware]]
pin = 18
hw_type = "digital"
io_mode = "DO"
label = "sckPin"
target_role = "spi-sck"

[[hardware]]
pin = 5
hw_type = "digital"
io_mode = "DO"
label = "csPin"
target_role = "spi-cs"

[[data]]
name = "msg"
type = "STRING"
scope = "CONST"
init = "\"telemetry\""
unit = "-"

[[setup]]
kind = "call"
name = "CFG_SERIAL"
args = [{ kind = "uint", value = 115200 }]

[[setup]]
kind = "call"
name = "CFG_I2C"
args = [
  { kind = "uint", value = 0 },
  { kind = "uint", value = 21 },
  { kind = "uint", value = 22 },
  { kind = "uint", value = 400000 },
]

[[setup]]
kind = "call"
name = "CFG_SPI"
args = [
  { kind = "uint", value = 1 },
  { kind = "uint", value = 23 },
  { kind = "uint", value = 19 },
  { kind = "uint", value = 18 },
  { kind = "uint", value = 5 },
]

[[loop]]
kind = "call"
name = "SERIAL_PRINTLN"
args = [{ kind = "var", name = "msg" }]
