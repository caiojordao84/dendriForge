# Sim S18 — thermal PID + E-Stop ISR + LCD (scenario 7)
# Uses SQRT/LOG math, CFG_ATTACH_INTERRUPT, plant thermal, anti-windup PID.

[metadata]
asl_version = "0.0.1"
project_name = "S18-pid-estop"
editor = "dendriForge"
author = "dendriForge DEN-18"
notes = "PID + E-Stop path — DEN-18 (scenario 7)"

[[hardware]]
pin = 14
hw_type = "digital"
io_mode = "DO"
label = "heaterPwm"
target_role = "pwm-out"

[[hardware]]
pin = 2
hw_type = "digital"
io_mode = "DI"
label = "eStop"
target_role = "int-falling"

[[data]]
name = "SETPOINT"
type = "REAL"
scope = "CONST"
init = "40.0"
unit = "C"

[[data]]
name = "KP"
type = "REAL"
scope = "CONST"
init = "800.0"
unit = "-"

[[data]]
name = "KI"
type = "REAL"
scope = "CONST"
init = "40.0"
unit = "-"

[[data]]
name = "KD"
type = "REAL"
scope = "CONST"
init = "20.0"
unit = "-"

[[data]]
name = "I_CLAMP"
type = "REAL"
scope = "CONST"
init = "200.0"
unit = "-"

[[data]]
name = "SCAN_DT"
type = "TIME"
scope = "CONST"
init = "T#200ms"
unit = "ms"

[[data]]
name = "dx"
type = "REAL"
scope = "CONST"
init = "3.0"
unit = "mm"

[[data]]
name = "dy"
type = "REAL"
scope = "CONST"
init = "4.0"
unit = "mm"

[[data]]
name = "currentTemp"
type = "REAL"
scope = "VAR"
init = "25.0"
unit = "C"

[[data]]
name = "pidError"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "-"

[[data]]
name = "integral"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "-"

[[data]]
name = "derivative"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "-"

[[data]]
name = "lastError"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "-"

[[data]]
name = "pidOutput"
type = "INT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "dist"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "mm"

[[data]]
name = "logVal"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "-"

[[data]]
name = "sysSafetyHalt"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "msg"
type = "STRING"
scope = "VAR"
init = "\"\""
unit = "-"

[[setup]]
kind = "call"
name = "CFG_PWM_OUTPUT"
args = [{ kind = "uint", value = 14 }, { kind = "uint", value = 1000 }]

[[setup]]
kind = "call"
name = "CFG_LCD"
args = [{ kind = "hex", value = "0x27" }, { kind = "uint", value = 16 }, { kind = "uint", value = 2 }]

[[setup]]
kind = "call"
name = "CFG_PLANT_THERMAL"
args = [
  { kind = "real", value = 25.0 },
  { kind = "uint", value = 14 },
  { kind = "real", value = 30.0 },
  { kind = "real", value = 0.15 },
]

[[setup]]
kind = "call"
name = "CFG_ATTACH_INTERRUPT"
args = [
  { kind = "uint", value = 2 },
  { kind = "var", name = "isr_estop" },
  { kind = "string", value = "FALLING" },
]

[[setup]]
kind = "call"
name = "LCD_PRINT"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "PID ready" }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "NOT sysSafetyHalt" }
then = [
  { kind = "assign", target = "dist", value = { kind = "expr_text", text = "SQRT(dx * dx + dy * dy)" } },
  { kind = "assign", target = "currentTemp", value = { kind = "call", name = "READ_TEMPERATURE", args = [] } },
  { kind = "assign", target = "logVal", value = { kind = "call", name = "LOG", args = [{ kind = "expr_text", text = "currentTemp + 1.0" }] } },
  { kind = "assign", target = "pidError", value = { kind = "expr_text", text = "SETPOINT - currentTemp" } },
  { kind = "assign", target = "integral", value = { kind = "expr_text", text = "integral + pidError" } },
  { kind = "if", condition = { kind = "expr_text", text = "integral > I_CLAMP" }, then = [{ kind = "assign", target = "integral", value = { kind = "var", name = "I_CLAMP" } }] },
  { kind = "if", condition = { kind = "expr_text", text = "integral < -I_CLAMP" }, then = [{ kind = "assign", target = "integral", value = { kind = "expr_text", text = "-I_CLAMP" } }] },
  { kind = "assign", target = "derivative", value = { kind = "expr_text", text = "pidError - lastError" } },
  { kind = "assign", target = "pidOutput", value = { kind = "expr_text", text = "REAL_TO_INT((KP * pidError) + (KI * integral) + (KD * derivative))" } },
  { kind = "assign", target = "pidOutput", value = { kind = "expr_text", text = "CLAMP(pidOutput, 0, 65535)" } },
  { kind = "assign", target = "lastError", value = { kind = "var", name = "pidError" } },
  { kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "uint", value = 14 }, { kind = "var", name = "pidOutput" }] },
  { kind = "call", name = "LCD_CLEAR", args = [] },
  { kind = "assign", target = "msg", value = { kind = "expr_text", text = "CONCAT(\"T=\", TO_STRING_FMT(currentTemp, 1))" } },
  { kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "var", name = "msg" }] },
]

[[loop]]
kind = "call"
name = "WAIT_TIME"
args = [{ kind = "var", name = "SCAN_DT" }]

[[functions]]
name = "isr_estop"
params = []
body = [
  { kind = "assign", target = "sysSafetyHalt", value = { kind = "bool", value = true } },
  { kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "uint", value = 14 }, { kind = "uint", value = 0 }] },
  { kind = "call", name = "LCD_CLEAR", args = [] },
  { kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "## E-STOP ##" }] },
  { kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 1 }, { kind = "string", value = "SYSTEM HALTED" }] },
]
