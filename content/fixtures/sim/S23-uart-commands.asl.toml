# Sim S23 — UART multi-command parser subset (scenario 11)
# PING / STATUS / LED:ON via SERIAL_READLN + string compare (structured).

[metadata]
asl_version = "0.0.1"
project_name = "S23-uart-commands"
editor = "dendriForge"
author = "dendriForge DEN-21"
notes = "G13 subset — multi-command path; full G13 suite still structural"

[[hardware]]
pin = 13
hw_type = "digital"
io_mode = "DO"
label = "statusLed"
target_role = "digital-out"

[[data]]
name = "cmd"
type = "STRING"
scope = "VAR"
init = "\"\""
unit = "-"

[[data]]
name = "paused"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "errCount"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "statusLine"
type = "STRING"
scope = "VAR"
init = "\"\""
unit = "-"

[[setup]]
kind = "call"
name = "CFG_SERIAL"
args = [{ kind = "uint", value = 115200 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 13 }]

[[setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "uint", value = 13 }, { kind = "bool", value = false }]

[[loop]]
kind = "assign"
target = "cmd"
value = { kind = "call", name = "SERIAL_READLN", args = [] }

[[loop]]
kind = "if"
condition = { kind = "binop", op = "eq", left = { kind = "var", name = "cmd" }, right = { kind = "string", value = "PING" } }
then = [
  { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "string", value = "PONG" }] },
]
elif = [{ condition = { kind = "binop", op = "eq", left = { kind = "var", name = "cmd" }, right = { kind = "string", value = "STATUS" } }, then = [{ kind = "assign", target = "statusLine", value = { kind = "call", name = "CONCAT", args = [{ kind = "string", value = "paused=" }, { kind = "call", name = "TO_STRING", args = [{ kind = "var", name = "paused" }] }, { kind = "string", value = ",err=" }, { kind = "call", name = "TO_STRING", args = [{ kind = "var", name = "errCount" }] }] } }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "var", name = "statusLine" }] }] }, { condition = { kind = "binop", op = "eq", left = { kind = "var", name = "cmd" }, right = { kind = "string", value = "LED:ON" } }, then = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 13 }, { kind = "bool", value = true }] }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "string", value = "OK" }] }] }, { condition = { kind = "binop", op = "eq", left = { kind = "var", name = "cmd" }, right = { kind = "string", value = "PAUSE" } }, then = [{ kind = "assign", target = "paused", value = { kind = "bool", value = true } }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "string", value = "PAUSED" }] }] }]
else = [
  { kind = "assign", target = "errCount", value = { kind = "binop", op = "add", left = { kind = "var", name = "errCount" }, right = { kind = "uint", value = 1 } } },
  { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "string", value = "ERR:unknown" }] },
]
