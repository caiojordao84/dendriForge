# Sim snapshot S04 — ADC read → MAP_RANGE → PWM duty (scenario 2 core)
# Duty is Arduino-style 0–255 UINT for honest C++ analogWrite round-trip.

[metadata]
asl_version = "0.0.1"
project_name = "S04-pwm-adc-map"
editor = "dendriForge"
author = "dendriForge Priority 2"
notes = "PWM + ADC + MAP_RANGE — DEN-11"

[[hardware]]
pin = 34
hw_type = "analog"
io_mode = "DI"
label = "potPin"
target_role = "analog-in"

[[hardware]]
pin = 25
hw_type = "digital"
io_mode = "DO"
label = "fanPwm"
target_role = "pwm-out"

[[data]]
name = "raw"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "duty"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[setup]]
kind = "call"
name = "CFG_ADC_INPUT"
args = [{ kind = "var", name = "potPin" }]

[[setup]]
kind = "call"
name = "CFG_PWM_OUTPUT"
args = [{ kind = "var", name = "fanPwm" }, { kind = "uint", value = 5000 }]

[[setup]]
kind = "call"
name = "SET_PWM_DUTY"
args = [{ kind = "var", name = "fanPwm" }, { kind = "uint", value = 0 }]

[[loop]]
kind = "assign"
target = "raw"
value = { kind = "call", name = "READ_ADC", args = [{ kind = "var", name = "potPin" }] }

[[loop]]
kind = "assign"
target = "duty"
value = { kind = "call", name = "REAL_TO_INT", args = [
  { kind = "call", name = "MAP_RANGE", args = [
    { kind = "var", name = "raw" },
    { kind = "uint", value = 0 },
    { kind = "uint", value = 65535 },
    { kind = "uint", value = 0 },
    { kind = "uint", value = 255 },
  ]},
]}

[[loop]]
kind = "call"
name = "SET_PWM_DUTY"
args = [{ kind = "var", name = "fanPwm" }, { kind = "var", name = "duty" }]
