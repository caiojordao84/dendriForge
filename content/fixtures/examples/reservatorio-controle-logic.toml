# Migrated from core/asl/v010/examples/reservatorio-controle-logic.toon
# Legacy TOON retained under core/asl/v010/ (read-only).

[metadata]
asl_version = "0.0.1"
project_name = "reservatorio-controle-logic"
editor = "dendriForge"
author = "Caio Jordão Barradas"
notes = "Migrated from legacy v010 TOON — ASL 0.0.1"

[[hardware]]
pin = 0
hw_type = "digital"
io_mode = "BI"
label = "sdaPin"
target_role = "i2c-sda"

[[hardware]]
pin = 1
hw_type = "digital"
io_mode = "BI"
label = "sclPin"
target_role = "i2c-scl"

[[hardware]]
pin = 15
hw_type = "digital"
io_mode = "DO"
label = "servoValvePin"
target_role = "pwm-out"

[[hardware]]
pin = 16
hw_type = "digital"
io_mode = "DO"
label = "trigPin"
target_role = "digital-out"

[[hardware]]
pin = 17
hw_type = "digital"
io_mode = "DI"
label = "echoPin"
target_role = "digital-int"

[[hardware]]
pin = 18
hw_type = "digital"
io_mode = "DO"
label = "buzzerPin"
target_role = "pwm-out"

[[hardware]]
pin = 19
hw_type = "digital"
io_mode = "DI"
label = "manualBtn"
target_role = "int-rising"

[[hardware]]
pin = 20
hw_type = "digital"
io_mode = "DO"
label = "ledIndicator"
target_role = "digital-out"

[[hardware]]
pin = 26
hw_type = "analog"
io_mode = "DI"
label = "potPin"
target_role = "adc:t"

[[data]]
name = "RESERVOIR_HEIGHT"
type = "UINT"
scope = "CONST"
init = "300"
unit = "cm"

[[data]]
name = "LEVEL_MIN"
type = "UINT"
scope = "CONST"
init = "20"
unit = "cm"

[[data]]
name = "LEVEL_HYSTERESIS"
type = "UINT"
scope = "CONST"
init = "5"
unit = "cm"

[[data]]
name = "CRIT_LOW"
type = "UINT"
scope = "CONST"
init = "10"
unit = "cm"

[[data]]
name = "CRIT_HIGH"
type = "UINT"
scope = "CONST"
init = "10"
unit = "cm"

[[data]]
name = "DEBOUNCE_TIME"
type = "TIME"
scope = "CONST"
init = "T#300ms"
unit = "ms"

[[data]]
name = "SERVO_DUTY_MIN"
type = "UINT"
scope = "CONST"
init = "1966"
unit = "-"

[[data]]
name = "SERVO_DUTY_MAX"
type = "UINT"
scope = "CONST"
init = "7864"
unit = "-"

[[data]]
name = "LOOP_INTERVAL"
type = "TIME"
scope = "CONST"
init = "T#500ms"
unit = "ms"

[[data]]
name = "valveOpen"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "alarming"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "lastToggleTime"
type = "TIME"
scope = "VAR"
init = "T#0ms"
unit = "ms"

[[data]]
name = "targetLevel"
type = "UINT"
scope = "VAR"
init = "0"
unit = "cm"

[[data]]
name = "currentLevel"
type = "UINT"
scope = "VAR"
init = "0"
unit = "cm"

[[data]]
name = "avgDist"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "cm"

[[data]]
name = "_i"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[setup]]
kind = "call"
name = "CFG_I2C_BUS"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "uint", value = 1 }, { kind = "uint", value = 400000 }]

[[setup]]
kind = "call"
name = "CFG_LCD_I2C"
args = [{ kind = "hex", value = "0x27" }, { kind = "uint", value = 16 }, { kind = "uint", value = 2 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "var", name = "trigPin" }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "var", name = "echoPin" }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT_PULLDOWN"
args = [{ kind = "var", name = "manualBtn" }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "var", name = "ledIndicator" }]

[[setup]]
kind = "call"
name = "CFG_PWM_OUTPUT"
args = [{ kind = "var", name = "servoValvePin" }, { kind = "uint", value = 50 }]

[[setup]]
kind = "call"
name = "CFG_PWM_OUTPUT"
args = [{ kind = "var", name = "buzzerPin" }, { kind = "uint", value = 1000 }]

[[setup]]
kind = "call"
name = "CFG_ISR"
args = [{ kind = "uint", value = 19 }, { kind = "var", name = "button_interrupt_handler" }, { kind = "string", value = "RISING" }]

[[setup]]
kind = "call"
name = "set_valve"
args = [{ kind = "bool", value = false }]

[[setup]]
kind = "call"
name = "LCD_PRINT"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "Iniciando..." }]

[[setup]]
kind = "assign"
target = "alarming"
value = { kind = "bool", value = false }

[[loop]]
kind = "assign"
target = "targetLevel"
value = { kind = "expr_text", text = "TO_INT((READ_ADC(26) / 65535.0) * RESERVOIR_HEIGHT)" }

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "targetLevel <= LEVEL_MIN" }
then = [{ kind = "assign", target = "targetLevel", value = { kind = "expr_text", text = "LEVEL_MIN + 1" } }]

[[loop]]
kind = "assign"
target = "sumDist"
value = { kind = "uint", value = 0 }

[[loop]]
kind = "for"
counter = "_i"
to = { kind = "uint", value = 5 }
body = [{ kind = "assign", target = "sumDist", value = { kind = "expr_text", text = "sumDist + READ_DISTANCE_CM(16, 17)" } }]

[[loop]]
kind = "assign"
target = "avgDist"
value = { kind = "expr_text", text = "sumDist / 5.0" }

[[loop]]
kind = "assign"
target = "currentLevel"
value = { kind = "expr_text", text = "TO_INT(RESERVOIR_HEIGHT - avgDist)" }

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "currentLevel < 0" }
then = [{ kind = "assign", target = "currentLevel", value = { kind = "uint", value = 0 } }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "currentLevel > RESERVOIR_HEIGHT" }
then = [{ kind = "assign", target = "currentLevel", value = { kind = "var", name = "RESERVOIR_HEIGHT" } }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "NOT valveOpen AND currentLevel <= LEVEL_MIN" }
then = [{ kind = "call", name = "set_valve", args = [{ kind = "bool", value = true }] }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "valveOpen AND currentLevel >= (targetLevel - LEVEL_HYSTERESIS)" }
then = [{ kind = "call", name = "set_valve", args = [{ kind = "bool", value = false }] }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "currentLevel < CRIT_LOW OR currentLevel > (targetLevel + CRIT_HIGH)" }
then = []

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "NOT alarming" }
then = [{ kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "var", name = "buzzerPin" }, { kind = "uint", value = 32768 }] }]

[[loop]]
kind = "assign"
target = "alarming"
value = { kind = "bool", value = true }

[[loop]]
kind = "vendor_extension"
reason = "ORPHAN_ELSE"

[[loop]]
kind = "if"
condition = { kind = "var", name = "alarming" }
then = [{ kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "var", name = "buzzerPin" }, { kind = "uint", value = 0 }] }]

[[loop]]
kind = "assign"
target = "alarming"
value = { kind = "bool", value = false }

[[loop]]
kind = "call"
name = "update_display"
args = []

[[loop]]
kind = "call"
name = "WAIT_TIME"
args = [{ kind = "var", name = "LOOP_INTERVAL" }]

[[functions]]
name = "set_servo_angle"
params = ["angle"]
body = [{ kind = "assign", target = "angle", value = { kind = "expr_text", text = "CLAMP(angle, 0, 180)" } }, { kind = "assign", target = "duty", value = { kind = "expr_text", text = "TO_INT(SERVO_DUTY_MIN + (SERVO_DUTY_MAX - SERVO_DUTY_MIN) * (angle / 180.0))" } }, { kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "var", name = "servoValvePin" }, { kind = "var", name = "duty" }] }]

[[functions]]
name = "set_valve"
params = ["open"]
body = [{ kind = "assign", target = "valveOpen", value = { kind = "var", name = "open" } }, { kind = "if", condition = { kind = "var", name = "valveOpen" }, then = [{ kind = "call", name = "set_servo_angle", args = [{ kind = "uint", value = 180 }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "var", name = "ledIndicator" }, { kind = "bool", value = true }] }], else = [{ kind = "call", name = "set_servo_angle", args = [{ kind = "uint", value = 0 }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "var", name = "ledIndicator" }, { kind = "bool", value = false }] }] }]

[[functions]]
name = "toggle_valve"
params = []
body = [{ kind = "call", name = "set_valve", args = [{ kind = "expr_text", text = "NOT valveOpen" }] }]

[[functions]]
name = "update_display"
params = []
body = [{ kind = "call", name = "LCD_CLEAR", args = [] }, { kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "expr_text", text = "STR_CONCAT(\"Pret: \", TO_STRING(targetLevel), \"cm\")" }] }, { kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 1 }, { kind = "expr_text", text = "STR_CONCAT(\"Atual: \", TO_STRING(currentLevel), \"cm\")" }] }]

[[functions]]
name = "button_interrupt_handler"
params = []
body = [{ kind = "assign", target = "currentTime", value = { kind = "expr_text", text = "GET_TIMESTAMP()" } }, { kind = "if", condition = { kind = "expr_text", text = "(currentTime - lastToggleTime) > DEBOUNCE_TIME" }, then = [{ kind = "call", name = "toggle_valve", args = [] }, { kind = "assign", target = "lastToggleTime", value = { kind = "var", name = "currentTime" } }] }]
