[[functions]]
name = "check_arrival"
params = []
body = [{ kind = "if", condition = { kind = "expr_text", text = "currentFloor == 0 AND call0" }, then = [{ kind = "assign", target = "call0", value = { kind = "bool", value = false } }, { kind = "call", name = "open_doors", args = [] }] }, { kind = "if", condition = { kind = "expr_text", text = "currentFloor == 1 AND call1" }, then = [{ kind = "assign", target = "call1", value = { kind = "bool", value = false } }, { kind = "call", name = "open_doors", args = [] }] }, { kind = "if", condition = { kind = "expr_text", text = "currentFloor == 2 AND call2" }, then = [{ kind = "assign", target = "call2", value = { kind = "bool", value = false } }, { kind = "call", name = "open_doors", args = [] }] }, { kind = "if", condition = { kind = "expr_text", text = "currentFloor == 3 AND call3" }, then = [{ kind = "assign", target = "call3", value = { kind = "bool", value = false } }, { kind = "call", name = "open_doors", args = [] }] }]

