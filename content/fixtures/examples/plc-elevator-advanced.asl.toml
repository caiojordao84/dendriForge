[[functions]]
name = "decide_movement"
params = []
body = [{ kind = "if", condition = { kind = "expr_text", text = "elevState == 0" }, then = [] }, { kind = "if", condition = { kind = "expr_text", text = "currentFloor == 0 AND (call1 OR call2 OR call3)" }, then = [{ kind = "assign", target = "elevState", value = { kind = "uint", value = 1 } }] }, { kind = "if", condition = { kind = "expr_text", text = "currentFloor == 1 AND (call2 OR call3)" }, then = [{ kind = "assign", target = "elevState", value = { kind = "uint", value = 1 } }] }, { kind = "if", condition = { kind = "expr_text", text = "currentFloor == 1 AND call0" }, then = [{ kind = "assign", target = "elevState", value = { kind = "uint", value = 2 } }] }, { kind = "if", condition = { kind = "expr_text", text = "currentFloor == 2 AND call3" }, then = [{ kind = "assign", target = "elevState", value = { kind = "uint", value = 1 } }] }, { kind = "if", condition = { kind = "expr_text", text = "currentFloor == 2 AND (call0 OR call1)" }, then = [{ kind = "assign", target = "elevState", value = { kind = "uint", value = 2 } }] }, { kind = "if", condition = { kind = "expr_text", text = "currentFloor == 3 AND (call0 OR call1 OR call2)" }, then = [{ kind = "assign", target = "elevState", value = { kind = "uint", value = 2 } }] }]

[[functions]]
name = "handle_doors"
params = []
body = [{ kind = "if", condition = { kind = "expr_text", text = "elevState == 3" }, then = [] }, { kind = "if", condition = { kind = "var", name = "irBlocked" }, then = [{ kind = "assign", target = "doorTimer", value = { kind = "expr_text", text = "GET_TIMESTAMP()" } }] }, { kind = "if", condition = { kind = "expr_text", text = "(GET_TIMESTAMP() - doorTimer) > DOOR_DELAY" }, then = [{ kind = "assign", target = "elevState", value = { kind = "uint", value = 0 } }] }]

