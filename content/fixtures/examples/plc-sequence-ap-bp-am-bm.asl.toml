[[functions]]
name = "read_inputs"
params = []
body = [{ kind = "assign", target = "startBtn", value = { kind = "expr_text", text = "GET_BOOL(0)" } }, { kind = "assign", target = "snsA0", value = { kind = "expr_text", text = "GET_BOOL(1)" } }, { kind = "assign", target = "snsA1", value = { kind = "expr_text", text = "GET_BOOL(2)" } }, { kind = "assign", target = "snsB0", value = { kind = "expr_text", text = "GET_BOOL(3)" } }, { kind = "assign", target = "snsB1", value = { kind = "expr_text", text = "GET_BOOL(4)" } }]

[[functions]]
name = "process_state_machine"
params = []
body = [{ kind = "if", condition = { kind = "expr_text", text = "seqStep == 0 AND startBtn AND snsA0 AND snsB0" }, then = [{ kind = "assign", target = "seqStep", value = { kind = "uint", value = 1 } }] }, { kind = "if", condition = { kind = "expr_text", text = "seqStep == 1 AND snsA1" }, then = [{ kind = "assign", target = "seqStep", value = { kind = "uint", value = 2 } }] }, { kind = "if", condition = { kind = "expr_text", text = "seqStep == 2 AND snsB1" }, then = [{ kind = "assign", target = "seqStep", value = { kind = "uint", value = 3 } }] }, { kind = "if", condition = { kind = "expr_text", text = "seqStep == 3 AND snsA0" }, then = [{ kind = "assign", target = "seqStep", value = { kind = "uint", value = 4 } }] }, { kind = "if", condition = { kind = "expr_text", text = "seqStep == 4 AND snsB0" }, then = [{ kind = "assign", target = "seqStep", value = { kind = "uint", value = 0 } }] }]

[[functions]]
name = "write_outputs"
params = []
body = [{ kind = "assign", target = "outA", value = { kind = "expr_text", text = "(seqStep == 1) OR (seqStep == 2)" } }, { kind = "assign", target = "outB", value = { kind = "expr_text", text = "(seqStep == 2) OR (seqStep == 3)" } }, { kind = "if", condition = { kind = "var", name = "outA" }, then = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 14 }, { kind = "bool", value = true }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = false }] }], else = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 14 }, { kind = "bool", value = false }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = true }] }] }, { kind = "if", condition = { kind = "var", name = "outB" }, then = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 16 }, { kind = "bool", value = true }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 17 }, { kind = "bool", value = false }] }], else = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 16 }, { kind = "bool", value = false }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 17 }, { kind = "bool", value = true }] }] }]
