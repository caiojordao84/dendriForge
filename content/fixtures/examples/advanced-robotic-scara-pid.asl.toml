[[loop]]
kind = "if"
condition = { kind = "var", name = "sysSafetyHalt" }
then = [{ kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "SAFETY_POLL" }] }, { kind = "assign", target = "currentTemp", value = { kind = "expr_text", text = "read_temperature_celsius()" } }, { kind = "call", name = "compute_thermal_pid", args = [] }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "NOT sysSafetyHalt" }
then = [{ kind = "call", name = "move_to_vpos", args = [{ kind = "real", value = 200.0 }, { kind = "real", value = 150.0 }] }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "LOOP_DELAY_SHORT" }] }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "NOT sysSafetyHalt" }
then = [{ kind = "call", name = "move_to_vpos", args = [{ kind = "real", value = 120.5 }, { kind = "real", value = 85.0 }] }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "LOOP_DELAY_LONG" }] }]

[[functions]]
name = "move_to_vpos"
params = ["valX", "valY"]
body = [{ kind = "assign", target = "targetX", value = { kind = "var", name = "valX" } }, { kind = "assign", target = "targetY", value = { kind = "var", name = "valY" } }, { kind = "assign", target = "deltaX", value = { kind = "expr_text", text = "targetX - currentX" } }, { kind = "assign", target = "deltaY", value = { kind = "expr_text", text = "targetY - currentY" } }, { kind = "assign", target = "distance", value = { kind = "expr_text", text = "SQRT((deltaX * deltaX) + (deltaY * deltaY))" } }, { kind = "if", condition = { kind = "expr_text", text = "distance > 0.1" }, then = [] }, { kind = "if", condition = { kind = "expr_text", text = "deltaX >= 0" }, then = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = true }] }], else = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = false }] }, { kind = "assign", target = "totalSteps", value = { kind = "expr_text", text = "TO_INT(distance * STEPS_PER_MM)" } }, { kind = "call", name = "execute_trajectory_pulses", args = [{ kind = "var", name = "totalSteps" }] }, { kind = "assign", target = "currentX", value = { kind = "var", name = "targetX" } }, { kind = "assign", target = "currentY", value = { kind = "var", name = "targetY" } }] }]

[[functions]]
name = "execute_trajectory_pulses"
params = ["pulses"]
body = [{ kind = "for", counter = "_i", to = { kind = "var", name = "pulses" }, body = [{ kind = "if", condition = { kind = "expr_text", text = "NOT sysSafetyHalt" }, then = [{ kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "uint", value = 14 }, { kind = "uint", value = 32768 }] }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "STEP_PULSE_DT" }] }, { kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "uint", value = 14 }, { kind = "uint", value = 0 }] }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "STEP_PULSE_DT" }] }] }] }]

[[functions]]
name = "compute_thermal_pid"
params = []
body = [{ kind = "assign", target = "pidError", value = { kind = "expr_text", text = "SETPOINT_TEMP - currentTemp" } }, { kind = "assign", target = "integral", value = { kind = "expr_text", text = "integral + pidError" } }, { kind = "if", condition = { kind = "expr_text", text = "integral > INTEGRAL_CLAMP" }, then = [{ kind = "assign", target = "integral", value = { kind = "var", name = "INTEGRAL_CLAMP" } }] }, { kind = "if", condition = { kind = "expr_text", text = "integral < -INTEGRAL_CLAMP" }, then = [{ kind = "assign", target = "integral", value = { kind = "expr_text", text = "-INTEGRAL_CLAMP" } }, { kind = "assign", target = "derivative", value = { kind = "expr_text", text = "pidError - lastError" } }, { kind = "assign", target = "pidOutput", value = { kind = "expr_text", text = "TO_INT((KP * pidError) + (KI * integral) + (KD * derivative))" } }, { kind = "assign", target = "pidOutput", value = { kind = "expr_text", text = "CLAMP(pidOutput, 0, 65535)" } }, { kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "uint", value = 16 }, { kind = "var", name = "pidOutput" }] }, { kind = "assign", target = "lastError", value = { kind = "var", name = "pidError" } }] }]

[[functions]]
name = "read_temperature_celsius"
params = []
body = [{ kind = "assign", target = "rawAdc", value = { kind = "expr_text", text = "READ_ADC(26)" } }, { kind = "assign", target = "resistance", value = { kind = "expr_text", text = "(65535.0 / rawAdc) - 1.0" } }, { kind = "assign", target = "calculatedTemp", value = { kind = "expr_text", text = "1.0 / (0.001129148 + (0.000234125 * LOG(resistance)))" } }, { kind = "assign", target = "calculatedTemp", value = { kind = "expr_text", text = "calculatedTemp - 273.15" } }, { kind = "return", value = { kind = "var", name = "calculatedTemp" } }]

[[functions]]
name = "isr_emergency_halt"
params = []
body = [{ kind = "assign", target = "sysSafetyHalt", value = { kind = "bool", value = true } }, { kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "uint", value = 14 }, { kind = "uint", value = 0 }] }, { kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "uint", value = 16 }, { kind = "uint", value = 0 }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = false }] }, { kind = "call", name = "LCD_CLEAR", args = [] }, { kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "## E-STOP ##" }] }, { kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 1 }, { kind = "string", value = "SYSTEM HALTED" }] }]

[[functions]]
name = "isr_encoder_pulse"
params = []
body = [{ kind = "assign", target = "timeNow", value = { kind = "expr_text", text = "GET_TIMESTAMP()" } }, { kind = "if", condition = { kind = "expr_text", text = "(timeNow - lastInterruptTime) > ENCODER_DEBOUNCE" }, then = [{ kind = "assign", target = "lastInterruptTime", value = { kind = "var", name = "timeNow" } }] }]
