# Migrated from core/asl/v010/golden/G07-servo-sweep-sine.toon
# Legacy TOON retained under core/asl/v010/ (read-only).

[metadata]
project_name = "G07-servo-sweep-sine"
editor = "dendriForge"
author = "dendriForge Golden Suite"
notes = "Migrated from legacy v010 TOON — ASL unversioned"

[[hardware]]
pin = 15
hw_type = "digital"
io_mode = "DO"
label = "servoPin"
target_role = "pwm-out"

[[hardware]]
pin = 32
hw_type = "analog"
io_mode = "DI"
label = "speedPot"
target_role = "adc:t"

[[hardware]]
pin = 33
hw_type = "analog"
io_mode = "DI"
label = "ampPot"
target_role = "adc:t"

[[data]]
name = "PWM_FREQ_SERVO"
type = "UINT"
scope = "CONST"
init = "50"
unit = "Hz"

[[data]]
name = "DUTY_US_MIN"
type = "UINT"
scope = "CONST"
init = "1638"
unit = "-"

[[data]]
name = "DUTY_US_MAX"
type = "UINT"
scope = "CONST"
init = "8192"
unit = "-"

[[data]]
name = "ANGLE_MIN"
type = "REAL"
scope = "CONST"
init = "0.0"
unit = "deg"

[[data]]
name = "ANGLE_MAX"
type = "REAL"
scope = "CONST"
init = "180.0"
unit = "deg"

[[data]]
name = "PI"
type = "REAL"
scope = "CONST"
init = "3.14159265"
unit = "-"

[[data]]
name = "TWO_PI"
type = "REAL"
scope = "CONST"
init = "6.28318530"
unit = "-"

[[data]]
name = "STEP_DELAY_MIN"
type = "TIME"
scope = "CONST"
init = "T#5ms"
unit = "ms"

[[data]]
name = "STEP_DELAY_MAX"
type = "TIME"
scope = "CONST"
init = "T#50ms"
unit = "ms"

[[data]]
name = "STEPS_PER_CYCLE"
type = "UINT"
scope = "CONST"
init = "200"
unit = "-"

[[data]]
name = "phase"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "rad"

[[data]]
name = "phaseStep"
type = "REAL"
scope = "VAR"
init = "0.031416"
unit = "rad"

[[data]]
name = "amplitude"
type = "REAL"
scope = "VAR"
init = "90.0"
unit = "deg"

[[data]]
name = "targetAngle"
type = "REAL"
scope = "VAR"
init = "90.0"
unit = "deg"

[[data]]
name = "stepDelay"
type = "TIME"
scope = "VAR"
init = "T#15ms"
unit = "ms"

[[setup]]
kind = "call"
name = "CFG_PWM_OUTPUT"
args = [{ kind = "uint", value = 15 }, { kind = "uint", value = 50 }]

[[setup]]
kind = "call"
name = "CFG_ADC_INPUT"
args = [{ kind = "uint", value = 32 }]

[[setup]]
kind = "call"
name = "CFG_ADC_INPUT"
args = [{ kind = "uint", value = 33 }]

[[loop]]
kind = "assign"
target = "phaseStep"
value = { kind = "expr_text", text = "MAP_RANGE(INT_TO_REAL(READ_ADC(32)), 0.0, 65535.0, 0.005, 0.2)" }

[[loop]]
kind = "assign"
target = "amplitude"
value = { kind = "expr_text", text = "MAP_RANGE(INT_TO_REAL(READ_ADC(33)), 0.0, 65535.0, 10.0, 90.0)" }

[[loop]]
kind = "assign"
target = "phase"
value = { kind = "expr_text", text = "phase + phaseStep" }

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "phase >= TWO_PI" }
then = [{ kind = "assign", target = "phase", value = { kind = "expr_text", text = "phase - TWO_PI" } }]

[[loop]]
kind = "assign"
target = "targetAngle"
value = { kind = "expr_text", text = "90.0 + amplitude * SIN(phase)" }

[[loop]]
kind = "assign"
target = "targetAngle"
value = { kind = "expr_text", text = "CLAMP(targetAngle, ANGLE_MIN, ANGLE_MAX)" }

[[loop]]
kind = "call"
name = "set_servo_angle"
args = [{ kind = "var", name = "targetAngle" }]

[[loop]]
kind = "assign"
target = "stepDelay"
value = { kind = "expr_text", text = "REAL_TO_INT(MAP_RANGE(INT_TO_REAL(READ_ADC(32)), 0.0, 65535.0, 5.0, 50.0))" }

[[loop]]
kind = "call"
name = "WAIT_TIME"
args = [{ kind = "var", name = "stepDelay" }]

[[functions]]
name = "set_servo_angle"
params = ["angleDeg"]
body = [{ kind = "assign", target = "angleDeg", value = { kind = "expr_text", text = "CLAMP(angleDeg, ANGLE_MIN, ANGLE_MAX)" } }, { kind = "assign", target = "duty", value = { kind = "expr_text", text = "REAL_TO_INT(MAP_RANGE(angleDeg, ANGLE_MIN, ANGLE_MAX, INT_TO_REAL(DUTY_US_MIN), INT_TO_REAL(DUTY_US_MAX)))" } }, { kind = "call", name = "SET_PWM_DUTY", args = [{ kind = "uint", value = 15 }, { kind = "var", name = "duty" }] }]

[[functions]]
name = "get_servo_duty_pct"
params = []
body = [{ kind = "assign", target = "currentDuty", value = { kind = "expr_text", text = "GET_PWM_DUTY(15)" } }, { kind = "return", value = { kind = "expr_text", text = "MAP_RANGE(INT_TO_REAL(currentDuty), INT_TO_REAL(DUTY_US_MIN), INT_TO_REAL(DUTY_US_MAX), 0.0, 100.0)" } }]
