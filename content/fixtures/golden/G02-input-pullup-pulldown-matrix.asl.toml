# Migrated from core/asl/v010/golden/G02-input-pullup-pulldown-matrix.toon
# Legacy TOON retained under core/asl/v010/ (read-only).

[metadata]
project_name = "G02-input-pullup-pulldown-matrix"
editor = "dendriForge"
author = "dendriForge Golden Suite"
notes = "Migrated from legacy v010 TOON — ASL unversioned"

[[hardware]]
pin = 8
hw_type = "digital"
io_mode = "DI"
label = "btnPullUp"
target_role = "int-falling"

[[hardware]]
pin = 9
hw_type = "digital"
io_mode = "DI"
label = "btnPullDown"
target_role = "int-rising"

[[hardware]]
pin = 10
hw_type = "digital"
io_mode = "DO"
label = "ledPullUp"
target_role = "digital-out"

[[hardware]]
pin = 11
hw_type = "digital"
io_mode = "DO"
label = "ledPullDown"
target_role = "digital-out"

[[hardware]]
pin = 12
hw_type = "digital"
io_mode = "DO"
label = "ledBoth"
target_role = "digital-out"

[[data]]
name = "DEBOUNCE_MS"
type = "TIME"
scope = "CONST"
init = "T#50ms"
unit = "ms"

[[data]]
name = "statePullUp"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "statePullDown"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "lastTimePullUp"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "ms"

[[data]]
name = "lastTimePullDown"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "ms"

[[data]]
name = "flagPullUp"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "flagPullDown"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "nowPullUp"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "ms"

[[data]]
name = "nowPullDown"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "ms"

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT_PULLUP"
args = [{ kind = "uint", value = 8 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT_PULLDOWN"
args = [{ kind = "uint", value = 9 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 10 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 11 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 12 }]

[[loop]]
kind = "assign"
target = "nowPullUp"
value = { kind = "expr_text", text = "GET_SYS_TIME()" }

[[loop]]
kind = "assign"
target = "nowPullDown"
value = { kind = "expr_text", text = "GET_SYS_TIME()" }

[[loop]]
kind = "assign"
target = "statePullUp"
value = { kind = "expr_text", text = "NOT GET_BOOL(8)" }

[[loop]]
kind = "assign"
target = "statePullDown"
value = { kind = "expr_text", text = "GET_BOOL(9)" }

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "statePullUp AND TIME_DIFF(nowPullUp, lastTimePullUp) > DEBOUNCE_MS" }
then = [{ kind = "assign", target = "flagPullUp", value = { kind = "expr_text", text = "NOT flagPullUp" } }, { kind = "assign", target = "lastTimePullUp", value = { kind = "var", name = "nowPullUp" } }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "statePullDown AND TIME_DIFF(nowPullDown, lastTimePullDown) > DEBOUNCE_MS" }
then = [
  { kind = "assign", target = "flagPullDown", value = { kind = "expr_text", text = "NOT flagPullDown" } },
  { kind = "assign", target = "lastTimePullDown", value = { kind = "var", name = "nowPullDown" } },
]

[[loop]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "uint", value = 10 }, { kind = "var", name = "flagPullUp" }]

[[loop]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "uint", value = 11 }, { kind = "var", name = "flagPullDown" }]

[[loop]]
kind = "call"
name = "SET_BOOL"
args = [
  { kind = "uint", value = 12 },
  { kind = "expr_text", text = "flagPullUp AND flagPullDown" },
]

[[functions]]
name = "reset_flags"
params = []
body = [{ kind = "assign", target = "flagPullUp", value = { kind = "bool", value = false } }, { kind = "assign", target = "flagPullDown", value = { kind = "bool", value = false } }]
