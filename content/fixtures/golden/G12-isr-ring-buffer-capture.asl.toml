[[loop]]
kind = "if"
condition = { kind = "var", name = "bufOverflow" }
then = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = true }] }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "string", value = "OVERFLOW" }] }, { kind = "assign", target = "bufOverflow", value = { kind = "bool", value = false } }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "bufHead != bufTail" }
then = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 16 }, { kind = "bool", value = true }] }, { kind = "while", condition = { kind = "expr_text", text = "bufHead != bufTail" }, body = [{ kind = "call", name = "drain_next", args = [] }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "DRAIN_DELAY" }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 16 }, { kind = "bool", value = false }] }] }]
else = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = false }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 16 }, { kind = "bool", value = false }] }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "LOOP_DELAY" }] }]

[[functions]]
name = "isr_capture"
params = []
body = [{ kind = "assign", target = "nowUs", value = { kind = "expr_text", text = "GET_SYS_TIME_US()" } }, { kind = "assign", target = "nextHead", value = { kind = "expr_text", text = "MOD(bufHead + 1, BUF_SIZE)" } }, { kind = "if", condition = { kind = "expr_text", text = "nextHead = bufTail" }, then = [{ kind = "assign", target = "bufOverflow", value = { kind = "bool", value = true } }, { kind = "return" }, { kind = "call", name = "buf_write", args = [{ kind = "var", name = "bufHead" }, { kind = "var", name = "nowUs" }] }, { kind = "assign", target = "bufHead", value = { kind = "var", name = "nextHead" } }, { kind = "assign", target = "captureCount", value = { kind = "expr_text", text = "captureCount + 1" } }] }]

[[functions]]
name = "buf_write"
params = ["idx", "val"]
body = [{ kind = "if", condition = { kind = "expr_text", text = "idx = 0" }, then = [{ kind = "assign", target = "buf0", value = { kind = "var", name = "val" } }], elif = [{ condition = { kind = "expr_text", text = "idx = 1" }, then = [{ kind = "assign", target = "buf1", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "idx = 2" }, then = [{ kind = "assign", target = "buf2", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "idx = 3" }, then = [{ kind = "assign", target = "buf3", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "idx = 4" }, then = [{ kind = "assign", target = "buf4", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "idx = 5" }, then = [{ kind = "assign", target = "buf5", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "idx = 6" }, then = [{ kind = "assign", target = "buf6", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "idx = 7" }, then = [{ kind = "assign", target = "buf7", value = { kind = "var", name = "val" } }] }] }]

[[functions]]
name = "buf_read"
params = ["idx"]
body = [{ kind = "if", condition = { kind = "expr_text", text = "idx = 0" }, then = [{ kind = "return", value = { kind = "var", name = "buf0" } }], elif = [{ condition = { kind = "expr_text", text = "idx = 1" }, then = [{ kind = "return", value = { kind = "var", name = "buf1" } }] }, { condition = { kind = "expr_text", text = "idx = 2" }, then = [{ kind = "return", value = { kind = "var", name = "buf2" } }] }, { condition = { kind = "expr_text", text = "idx = 3" }, then = [{ kind = "return", value = { kind = "var", name = "buf3" } }] }, { condition = { kind = "expr_text", text = "idx = 4" }, then = [{ kind = "return", value = { kind = "var", name = "buf4" } }] }, { condition = { kind = "expr_text", text = "idx = 5" }, then = [{ kind = "return", value = { kind = "var", name = "buf5" } }] }, { condition = { kind = "expr_text", text = "idx = 6" }, then = [{ kind = "return", value = { kind = "var", name = "buf6" } }] }, { condition = { kind = "expr_text", text = "idx = 7" }, then = [{ kind = "return", value = { kind = "var", name = "buf7" } }] }] }, { kind = "return", value = { kind = "uint", value = 0 } }]

[[functions]]
name = "drain_next"
params = []
body = [{ kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(TO_STRING(drainCount), \",\", TO_STRING(buf_read(bufTail)))" }] }, { kind = "assign", target = "bufTail", value = { kind = "expr_text", text = "MOD(bufTail + 1, BUF_SIZE)" } }, { kind = "assign", target = "drainCount", value = { kind = "expr_text", text = "drainCount + 1" } }, { kind = "if", condition = { kind = "expr_text", text = "drainCount >= captureCount" }, then = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 15 }, { kind = "bool", value = false }] }] }]
