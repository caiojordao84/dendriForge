body = [{ kind = "assign", target = "passCount", value = { kind = "var", name = "_p" } }, { kind = "call", name = "fill_matrix_from_adc", args = [] }, { kind = "call", name = "compute_row_max", args = [] }, { kind = "call", name = "compute_col_sum", args = [] }, { kind = "call", name = "find_hot_cell", args = [] }, { kind = "call", name = "log_matrix_pass", args = [{ kind = "var", name = "_p" }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 2 }, { kind = "bool", value = false }] }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(\"scan_done t=\", TO_STRING(GET_SYS_TIME()), \"ms passes=\", TO_STRING(passCount))" }] }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "LOOP_DELAY" }] }]

