 = "m30", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "row = 3 AND col = 1" }, then = [{ kind = "assign", target = "m31", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "row = 3 AND col = 2" }, then = [{ kind = "assign", target = "m32", value = { kind = "var", name = "val" } }] }, { condition = { kind = "expr_text", text = "row = 3 AND col = 3" }, then = [{ kind = "assign", target = "m33", value = { kind = "var", name = "val" } }] }] }]

