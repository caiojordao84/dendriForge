body = [{ kind = "if", condition = { kind = "expr_text", text = "row = 0 AND col = 0" }, then = [{ kind = "return", value = { kind = "var", name = "m00" } }], elif = [{ condition = { kind = "expr_text", text = "row = 0 AND col = 1" }, then = [{ kind = "return", value = { kind = "var", name = "m01" } }] }, { condition = { kind = "expr_text", text = "row = 0 AND col = 2" }, then = [{ kind = "return", value = { kind = "var", name = "m02" } }] }, { condition = { kind = "expr_text", text = "row = 0 AND col = 3" }, then = [{ kind = "return", value = { kind = "var", name = "m03" } }] }, { condition = { kind = "expr_text", text = "row = 1 AND col = 0" }, then = [{ kind = "return", value = { kind = "var", name = "m10" } }] }, { condition = { kind = "expr_text", text = "row = 1 AND col = 1" }, then = [{ kind = "return", value = { kind = "var", name = "m11" } }] }, { condition = { kind = "expr_text", text = "row = 1 AND col = 2" }, then = [{ kind = "return", value = { kind = "var", name = "m12" } }] }, { condition = { kind = "expr_text", text = "row = 1 AND col = 3" }, then = [{ kind = "return", value = { kind = "var", name = "m13" } }] }, { condition = { kind = "expr_text", text = "row = 2 AND col = 0" }, then = [{ kind = "return", value = { kind = "var", name = "m20" } }] }, { condition = { kind = "expr_text", text = "row = 2 AND col = 1" }, then = [{ kind = "return", value = { kind = "var", name = "m21" } }] }, { condition = { kind = "expr_text", text = "row = 2 AND col = 2" }, then = [{ kind = "return", value = { kind = "var", name = "m22" } }] }, { condition = { kind = "expr_text", text = "row = 2 AND col = 3" }, then = [{ kind = "return", value = { kind = "var", name = "m23" } }] }, { condition = { kind = "expr_text", text = "row = 3 AND col = 0" }, then = [{ kind = "return", value = { kind = "var", name = "m30" } }] }, { condition = { kind = "expr_text", text = "row = 3 AND col = 1" }, then = [{ kind = "return", value = { kind = "var", name = "m31" } }] }, { condition = { kind = "expr_text", text = "row = 3 AND col = 2" }, then = [{ kind = "return", value = { kind = "var", name = "m32" } }] }, { condition = { kind = "expr_text", text = "row = 3 AND col = 3" }, then = [{ kind = "return", value = { kind = "var", name = "m33" } }] }] }, { kind = "return", value = { kind = "real", value = 0.0 } }]

[[functions]]
name = "compute_row_max"
params = []
body = [{ kind = "assign", target = "rowMax0", value = { kind = "expr_text", text = "MAX(MAX(m00, m01), MAX(m02, m03))" } }, { kind = "assign", target = "rowMax1", value = { kind = "expr_text", text = "MAX(MAX(m10, m11), MAX(m12, m13))" } }, { kind = "assign", target = "rowMax2", value = { kind = "expr_text", text = "MAX(MAX(m20, m21), MAX(m22, m23))" } }, { kind = "assign", target = "rowMax3", value = { kind = "expr_text", text = "MAX(MAX(m30, m31), MAX(m32, m33))" } }]

[[functions]]
name = "compute_col_sum"
params = []
body = [{ kind = "assign", target = "colSum0", value = { kind = "expr_text", text = "m00 + m10 + m20 + m30" } }, { kind = "assign", target = "colSum1", value = { kind = "expr_text", text = "m01 + m11 + m21 + m31" } }, { kind = "assign", target = "colSum2", value = { kind = "expr_text", text = "m02 + m12 + m22 + m32" } }, { kind = "assign", target = "colSum3", value = { kind = "expr_text", text = "m03 + m13 + m23 + m33" } }]

[[functions]]
name = "get_row_max"
params = ["row"]
body = [{ kind = "if", condition = { kind = "expr_text", text = "row = 0" }, then = [{ kind = "return", value = { kind = "var", name = "rowMax0" } }], elif = [{ condition = { kind = "expr_text", text = "row = 1" }, then = [{ kind = "return", value = { kind = "var", name = "rowMax1" } }] }, { condition = { kind = "expr_text", text = "row = 2" }, then = [{ kind = "return", value = { kind = "var", name = "rowMax2" } }] }, { condition = { kind = "expr_text", text = "row = 3" }, then = [{ kind = "return", value = { kind = "var", name = "rowMax3" } }] }] }, { kind = "return", value = { kind = "real", value = 0.0 } }]

[[functions]]
name = "get_col_sum"
params = ["col"]
body = [{ kind = "if", condition = { kind = "expr_text", text = "col = 0" }, then = [{ kind = "return", value = { kind = "var", name = "colSum0" } }], elif = [{ condition = { kind = "expr_text", text = "col = 1" }, then = [{ kind = "return", value = { kind = "var", name = "colSum1" } }] }, { condition = { kind = "expr_text", text = "col = 2" }, then = [{ kind = "return", value = { kind = "var", name = "colSum2" } }] }, { condition = { kind = "expr_text", text = "col = 3" }, then = [{ kind = "return", value = { kind = "var", name = "colSum3" } }] }] }, { kind = "return", value = { kind = "real", value = 0.0 } }]

[[functions]]
name = "find_hot_cell"
params = []
body = [{ kind = "assign", target = "hotCell", value = { kind = "string", value = "none" } }, { kind = "assign", target = "_r", value = { kind = "uint", value = 0 } }, { kind = "while", condition = { kind = "expr_text", text = "_r < ROWS" }, body = [{ kind = "assign", target = "_c", value = { kind = "uint", value = 0 } }, { kind = "while", condition = { kind = "expr_text", text = "_c < COLS" }, body = [{ kind = "if", condition = { kind = "expr_text", text = "get_cell(_r, _c) > THRESHOLD" }, then = [{ kind = "assign", target = "hotCell", value = { kind = "expr_text", text = "CONCAT(\"r\", TO_STRING(_r), \"c\", TO_STRING(_c))" } }, { kind = "return" }, { kind = "assign", target = "_c", value = { kind = "expr_text", text = "_c + 1" } }, { kind = "assign", target = "_r", value = { kind = "expr_text", text = "_r + 1" } }] }] }] }]

[[functions]]
name = "log_matrix_pass"
params = ["pass"]
body = [{ kind = "for", counter = "_r", to = { kind = "var", name = "ROWS" }, body = [{ kind = "for", counter = "_c", to = { kind = "var", name = "COLS" }, body = [{ kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(TO_STRING(pass), \",\", TO_STRING(_r), \",\", TO_STRING(_c), \",\", TO_STRING_FMT(get_cell(_r, _c), 4), \",\", TO_STRING_FMT(get_row_max(_r), 4), \",\", TO_STRING_FMT(get_col_sum(_c), 4), \",\", hotCell)" }] }] }] }]
