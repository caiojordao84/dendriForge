# Migrated from core/asl/v010/golden/G04-rotary-encoder-counter.toon
# Legacy TOON retained under core/asl/v010/ (read-only).

[metadata]
asl_version = "0.0.1"
project_name = "G04-rotary-encoder-counter"
editor = "dendriForge"
author = "dendriForge Golden Suite"
notes = "Migrated from legacy v010 TOON — ASL 0.0.1"

[[hardware]]
pin = 0
hw_type = "digital"
io_mode = "BI"
label = "sdaPin"
target_role = "i2c-sda"

[[hardware]]
pin = 1
hw_type = "digital"
io_mode = "BI"
label = "sclPin"
target_role = "i2c-scl"

[[hardware]]
pin = 20
hw_type = "digital"
io_mode = "DI"
label = "encA"
target_role = "int-change"

[[hardware]]
pin = 21
hw_type = "digital"
io_mode = "DI"
label = "encB"
target_role = "digital-int"

[[hardware]]
pin = 22
hw_type = "digital"
io_mode = "DI"
label = "encBtn"
target_role = "int-falling"

[[hardware]]
pin = 23
hw_type = "digital"
io_mode = "DO"
label = "ledIndicator"
target_role = "digital-out"

[[data]]
name = "COUNT_MIN"
type = "INT"
scope = "CONST"
init = "-100"
unit = "-"

[[data]]
name = "COUNT_MAX"
type = "INT"
scope = "CONST"
init = "100"
unit = "-"

[[data]]
name = "DEBOUNCE_BTN"
type = "TIME"
scope = "CONST"
init = "T#200ms"
unit = "ms"

[[data]]
name = "LOOP_DELAY"
type = "TIME"
scope = "CONST"
init = "T#20ms"
unit = "ms"

[[data]]
name = "encoderCount"
type = "INT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "lastEncA"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "btnPressed"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "lastBtnTime"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "ms"

[[data]]
name = "displayDirty"
type = "BOOL"
scope = "VAR"
init = "TRUE"
unit = "-"

[[data]]
name = "nowTime"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "ms"

[[data]]
name = "encAState"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[setup]]
kind = "call"
name = "CFG_I2C"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "uint", value = 1 }, { kind = "uint", value = 400000 }]

[[setup]]
kind = "call"
name = "CFG_LCD"
args = [{ kind = "hex", value = "0x27" }, { kind = "uint", value = 16 }, { kind = "uint", value = 2 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT_PULLUP"
args = [{ kind = "uint", value = 20 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT_PULLUP"
args = [{ kind = "uint", value = 21 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT_PULLUP"
args = [{ kind = "uint", value = 22 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 23 }]

[[setup]]
kind = "call"
name = "CFG_ATTACH_INTERRUPT"
args = [{ kind = "uint", value = 20 }, { kind = "var", name = "isr_enc_a" }, { kind = "string", value = "CHANGE" }]

[[setup]]
kind = "call"
name = "CFG_ATTACH_INTERRUPT"
args = [{ kind = "uint", value = 22 }, { kind = "var", name = "isr_btn" }, { kind = "string", value = "FALLING" }]

[[setup]]
kind = "call"
name = "LCD_CLEAR"
args = []

[[setup]]
kind = "call"
name = "LCD_PRINT"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "Count:" }]

[[loop]]
kind = "if"
condition = { kind = "var", name = "displayDirty" }
then = [{ kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 7 }, { kind = "uint", value = 0 }, { kind = "expr_text", text = "CONCAT(TO_STRING(encoderCount), \"   \")" }] }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 23 }, { kind = "expr_text", text = "encoderCount > 0" }] }, { kind = "assign", target = "displayDirty", value = { kind = "bool", value = false } }]

[[loop]]
kind = "if"
condition = { kind = "var", name = "btnPressed" }
then = [{ kind = "assign", target = "encoderCount", value = { kind = "uint", value = 0 } }, { kind = "assign", target = "displayDirty", value = { kind = "bool", value = true } }, { kind = "assign", target = "btnPressed", value = { kind = "bool", value = false } }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "LOOP_DELAY" }] }]

[[functions]]
name = "isr_enc_a"
params = []
body = [{ kind = "assign", target = "encAState", value = { kind = "expr_text", text = "GET_BOOL(20)" } }, { kind = "if", condition = { kind = "expr_text", text = "encAState AND NOT lastEncA" }, then = [] }, { kind = "if", condition = { kind = "expr_text", text = "GET_BOOL(21)" }, then = [{ kind = "assign", target = "encoderCount", value = { kind = "expr_text", text = "encoderCount - 1" } }], else = [{ kind = "assign", target = "encoderCount", value = { kind = "expr_text", text = "encoderCount + 1" } }] }, { kind = "assign", target = "encoderCount", value = { kind = "expr_text", text = "CLAMP(encoderCount, COUNT_MIN, COUNT_MAX)" } }, { kind = "assign", target = "lastEncA", value = { kind = "var", name = "encAState" } }, { kind = "assign", target = "displayDirty", value = { kind = "bool", value = true } }]

[[functions]]
name = "isr_btn"
params = []
body = [{ kind = "assign", target = "nowTime", value = { kind = "expr_text", text = "GET_SYS_TIME()" } }, { kind = "if", condition = { kind = "expr_text", text = "TIME_DIFF(nowTime, lastBtnTime) > DEBOUNCE_BTN" }, then = [{ kind = "assign", target = "btnPressed", value = { kind = "bool", value = true } }, { kind = "assign", target = "lastBtnTime", value = { kind = "var", name = "nowTime" } }] }]
