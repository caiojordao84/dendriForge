# Migrated from core/asl/v010/golden/G15-i2c-multi-device-scan.toon
# Legacy TOON retained under core/asl/v010/ (read-only).

[metadata]
project_name = "G15-i2c-multi-device-scan"
editor = "dendriForge"
author = "dendriForge Golden Suite"
notes = "Migrated from legacy v010 TOON — ASL unversioned"

[[hardware]]
pin = 0
hw_type = "digital"
io_mode = "BI"
label = "sda0Pin"
target_role = "i2c-sda"

[[hardware]]
pin = 1
hw_type = "digital"
io_mode = "BI"
label = "scl0Pin"
target_role = "i2c-scl"

[[hardware]]
pin = 4
hw_type = "digital"
io_mode = "BI"
label = "sda1Pin"
target_role = "i2c-sda"

[[hardware]]
pin = 5
hw_type = "digital"
io_mode = "BI"
label = "scl1Pin"
target_role = "i2c-scl"

[[hardware]]
pin = 6
hw_type = "digital"
io_mode = "DO"
label = "ledReady"
target_role = "digital-out"

[[hardware]]
pin = 7
hw_type = "digital"
io_mode = "DO"
label = "ledError"
target_role = "digital-out"

[[hardware]]
pin = 8
hw_type = "digital"
io_mode = "DI"
label = "alertPin"
target_role = "int-falling"

[[data]]
name = "BAUD_RATE"
type = "DINT"
scope = "CONST"
init = "115200"
unit = "-"

[[data]]
name = "I2C_FREQ"
type = "DINT"
scope = "CONST"
init = "400000"
unit = "-"

[[data]]
name = "SAMPLE_INTERVAL"
type = "TIME"
scope = "CONST"
init = "T#2000ms"
unit = "ms"

[[data]]
name = "LOOP_DELAY"
type = "TIME"
scope = "CONST"
init = "T#50ms"
unit = "ms"

[[data]]
name = "TEMP_ALARM_HI"
type = "REAL"
scope = "CONST"
init = "40.0"
unit = "degC"

[[data]]
name = "HUM_ALARM_HI"
type = "REAL"
scope = "CONST"
init = "85.0"
unit = "pct"

[[data]]
name = "PRESS_SEA_HPA"
type = "REAL"
scope = "CONST"
init = "1013.25"
unit = "hPa"

[[data]]
name = "temperature"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "degC"

[[data]]
name = "humidity"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "pct"

[[data]]
name = "pressure"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "hPa"

[[data]]
name = "pressureAlt"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "m"

[[data]]
name = "alarmTemp"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "alarmHum"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "sensorError"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "lastSampleTime"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "ms"

[[data]]
name = "nowMs"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "ms"

[[data]]
name = "alertFlag"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "sampleCount"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[setup]]
kind = "call"
name = "CFG_SERIAL"
args = [{ kind = "uint", value = 115200 }]

[[setup]]
kind = "call"
name = "CFG_I2C"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "uint", value = 1 }, { kind = "uint", value = 400000 }]

[[setup]]
kind = "call"
name = "CFG_I2C"
args = [{ kind = "uint", value = 1 }, { kind = "uint", value = 4 }, { kind = "uint", value = 5 }, { kind = "uint", value = 400000 }]

[[setup]]
kind = "call"
name = "CFG_SENSOR_I2C"
args = []

[[setup]]
kind = "call"
name = "CFG_LCD"
args = [{ kind = "hex", value = "0x27" }, { kind = "uint", value = 20 }, { kind = "uint", value = 4 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 6 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 7 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "uint", value = 8 }]

[[setup]]
kind = "call"
name = "CFG_ATTACH_INTERRUPT"
args = [{ kind = "uint", value = 8 }, { kind = "var", name = "isr_alert" }, { kind = "string", value = "FALLING" }]

[[setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "uint", value = 6 }, { kind = "bool", value = true }]

[[setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "uint", value = 7 }, { kind = "bool", value = false }]

[[setup]]
kind = "call"
name = "LCD_CLEAR"
args = []

[[setup]]
kind = "call"
name = "LCD_PRINT"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "I2C Multi-Sensor" }]

[[setup]]
kind = "call"
name = "SERIAL_PRINTLN"
args = [{ kind = "string", value = "ts_ms,temp_C,hum_pct,press_hPa,alt_m" }]

[[loop]]
kind = "assign"
target = "nowMs"
value = { kind = "expr_text", text = "GET_SYS_TIME()" }

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "TIME_DIFF(nowMs, lastSampleTime) >= SAMPLE_INTERVAL" }
then = [{ kind = "assign", target = "temperature", value = { kind = "expr_text", text = "READ_TEMPERATURE()" } }, { kind = "assign", target = "humidity", value = { kind = "expr_text", text = "READ_HUMIDITY()" } }, { kind = "assign", target = "pressure", value = { kind = "expr_text", text = "READ_PRESSURE()" } }, { kind = "assign", target = "pressureAlt", value = { kind = "expr_text", text = "calc_pressure_altitude(pressure)" } }, { kind = "assign", target = "alarmTemp", value = { kind = "expr_text", text = "temperature > TEMP_ALARM_HI" } }, { kind = "assign", target = "alarmHum", value = { kind = "expr_text", text = "humidity > HUM_ALARM_HI" } }, { kind = "assign", target = "sampleCount", value = { kind = "expr_text", text = "sampleCount + 1" } }, { kind = "call", name = "update_lcd", args = [] }, { kind = "call", name = "log_csv", args = [] }, { kind = "assign", target = "lastSampleTime", value = { kind = "var", name = "nowMs" } }, { kind = "call", name = "SET_BOOL", args = [{ kind = "uint", value = 7 }, { kind = "expr_text", text = "alarmTemp OR alarmHum OR alertFlag" }] }]

[[loop]]
kind = "if"
condition = { kind = "var", name = "alertFlag" }
then = [{ kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(\"ALERT pin triggered t=\", TO_STRING(nowMs), \"ms\")" }] }, { kind = "assign", target = "alertFlag", value = { kind = "bool", value = false } }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "LOOP_DELAY" }] }]

[[functions]]
name = "isr_alert"
params = []
body = [{ kind = "assign", target = "alertFlag", value = { kind = "bool", value = true } }]

[[functions]]
name = "calc_pressure_altitude"
params = ["pressHpa"]
body = [{ kind = "return", value = { kind = "expr_text", text = "44330.0 * (1.0 - EXPT(pressHpa / PRESS_SEA_HPA, 0.1903))" } }]

[[functions]]
name = "update_lcd"
params = []
body = [{ kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 1 }, { kind = "expr_text", text = "CONCAT(\"T:\", TO_STRING_FMT(temperature, 1), \"C  H:\", TO_STRING_FMT(humidity, 1), \"%   \")" }] }, { kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 2 }, { kind = "expr_text", text = "CONCAT(\"P:\", TO_STRING_FMT(pressure, 1), \"hPa      \")" }] }, { kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 3 }, { kind = "expr_text", text = "CONCAT(\"Alt:\", TO_STRING_FMT(pressureAlt, 0), \"m   \")" }] }, { kind = "if", condition = { kind = "expr_text", text = "alarmTemp OR alarmHum" }, then = [{ kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "!! ALARM !!         " }] }], else = [{ kind = "call", name = "LCD_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "string", value = "I2C Multi-Sensor    " }] }] }]

[[functions]]
name = "log_csv"
params = []
body = [{ kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(TO_STRING(GET_SYS_TIME()), \",\", TO_STRING_FMT(temperature, 2), \",\", TO_STRING_FMT(humidity, 2), \",\", TO_STRING_FMT(pressure, 2), \",\", TO_STRING_FMT(pressureAlt, 1))" }] }]
