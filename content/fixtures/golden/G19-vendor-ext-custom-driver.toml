# Migrated from core/asl/v010/golden/G19-vendor-ext-custom-driver.toon
# Legacy TOON retained under core/asl/v010/ (read-only).

[metadata]
asl_version = "0.0.1"
project_name = "G19-vendor-ext-custom-driver"
editor = "dendriForge"
author = "dendriForge Golden Suite"
notes = "Migrated from legacy v010 TOON — ASL 0.0.1"

[[hardware]]
pin = 0
hw_type = "digital"
io_mode = "BI"
label = "uartTxPin"
target_role = "uart-tx"

[[hardware]]
pin = 1
hw_type = "digital"
io_mode = "BI"
label = "uartRxPin"
target_role = "uart-rx"

[[hardware]]
pin = 4
hw_type = "digital"
io_mode = "DO"
label = "dcPin"
target_role = "tft-dc"

[[hardware]]
pin = 5
hw_type = "digital"
io_mode = "DO"
label = "csPin"
target_role = "spi-cs"

[[hardware]]
pin = 6
hw_type = "digital"
io_mode = "DO"
label = "rstPin"
target_role = "tft-rst"

[[hardware]]
pin = 7
hw_type = "digital"
io_mode = "DO"
label = "ledStatus"
target_role = "digital-out"

[[hardware]]
pin = 8
hw_type = "digital"
io_mode = "DO"
label = "ledVendor"
target_role = "digital-out"

[[hardware]]
pin = 9
hw_type = "digital"
io_mode = "DI"
label = "extIrqPin"
target_role = "int-rising"

[[hardware]]
pin = 34
hw_type = "analog"
io_mode = "DI"
label = "sensorRaw"
target_role = "adc:t"

[[data]]
name = "BAUD_RATE"
type = "DINT"
scope = "CONST"
init = "115200"
unit = "-"

[[data]]
name = "LOOP_DELAY"
type = "TIME"
scope = "CONST"
init = "T#500ms"
unit = "ms"

[[data]]
name = "VENDOR_FALLBACK_EN"
type = "BOOL"
scope = "CONST"
init = "TRUE"
unit = "-"

[[data]]
name = "TEMP_SCALE"
type = "REAL"
scope = "CONST"
init = "0.0625"
unit = "degC"

[[data]]
name = "TEMP_OFFSET"
type = "REAL"
scope = "CONST"
init = "-40.0"
unit = "degC"

[[data]]
name = "VENDOR_INIT_RETRIES"
type = "UINT"
scope = "CONST"
init = "3"
unit = "-"

[[data]]
name = "vendorReady"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "tftReady"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "sensorReady"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "vendorEventFlag"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[data]]
name = "lastEventTime"
type = "DWORD"
scope = "VAR"
init = "0"
unit = "ms"

[[data]]
name = "rawTemp"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "tempC"
type = "REAL"
scope = "VAR"
init = "0.0"
unit = "degC"

[[data]]
name = "initRetries"
type = "UINT"
scope = "VAR"
init = "0"
unit = "-"

[[data]]
name = "vendorInitCount"
type = "UINT"
scope = "RETAIN"
init = "0"
unit = "-"

[[data]]
name = "logLine"
type = "STRING"
scope = "VAR"
init = ""
unit = "-"

[[setup]]
kind = "call"
name = "CFG_SERIAL"
args = [{ kind = "uint", value = 115200 }]

[[setup]]
kind = "call"
name = "CFG_ADC_INPUT"
args = [{ kind = "var", name = "sensorRaw" }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "var", name = "ledStatus" }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "var", name = "ledVendor" }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "var", name = "extIrqPin" }]

[[setup]]
kind = "call"
name = "CFG_ATTACH_INTERRUPT"
args = [{ kind = "var", name = "extIrqPin" }, { kind = "var", name = "isr_vendor_ext_irq" }, { kind = "string", value = "RISING" }]

[[setup]]
kind = "vendor_extension"
reason = "UNRESOLVED_TFT_DRIVER:target=bare-metal-stm32"

[[setup]]
kind = "assign"
target = "tftReady"
value = { kind = "bool", value = false }

[[setup]]
kind = "vendor_extension"
reason = "UNRESOLVED_SENSOR_I2C:label=sensorRaw,bus=0"

[[setup]]
kind = "assign"
target = "sensorReady"
value = { kind = "bool", value = false }

[[setup]]
kind = "vendor_extension"
reason = "SD_CARD_INIT:spi_bus=0,cs=5"

[[setup]]
kind = "vendor_extension"
reason = "PERIPHERAL_INIT:DMA_ENGINE,channel=2,priority=HIGH"

[[setup]]
kind = "assign"
target = "vendorInitCount"
value = { kind = "expr_text", text = "vendorInitCount + 1" }

[[setup]]
kind = "call"
name = "SERIAL_PRINTLN"
args = [{ kind = "expr_text", text = "CONCAT(\"Vendor init #\", TO_STRING(vendorInitCount))" }]

[[setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "var", name = "ledStatus" }, { kind = "bool", value = true }]

[[loop]]
kind = "assign"
target = "rawTemp"
value = { kind = "expr_text", text = "READ_ADC(34)" }

[[loop]]
kind = "assign"
target = "tempC"
value = { kind = "expr_text", text = "INT_TO_REAL(rawTemp) * TEMP_SCALE + TEMP_OFFSET" }

[[loop]]
kind = "if"
condition = { kind = "var", name = "sensorReady" }
then = [{ kind = "assign", target = "tempC", value = { kind = "expr_text", text = "READ_TEMPERATURE()" } }]
else = [{ kind = "vendor_extension", reason = "UNRESOLVED_SENSOR_FB:READ_TEMPERATURE" }]

[[loop]]
kind = "if"
condition = { kind = "var", name = "tftReady" }
then = [{ kind = "call", name = "TFT_PRINT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "expr_text", text = "CONCAT(\"T:\", TO_STRING_FMT(tempC, 1), \"C\")" }] }]
else = [{ kind = "vendor_extension", reason = "UNRESOLVED_TFT_DRIVER:TFT_PRINT" }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(\"[TFT-FALLBACK] T=\", TO_STRING_FMT(tempC, 1), \"C\")" }] }]

[[loop]]
kind = "if"
condition = { kind = "var", name = "vendorEventFlag" }
then = [{ kind = "assign", target = "vendorEventFlag", value = { kind = "bool", value = false } }, { kind = "assign", target = "lastEventTime", value = { kind = "expr_text", text = "GET_SYS_TIME()" } }, { kind = "vendor_extension", reason = "PERIPHERAL_EVENT:DMA_ENGINE,action=DRAIN" }, { kind = "call", name = "SET_BOOL", args = [{ kind = "var", name = "ledVendor" }, { kind = "bool", value = true }] }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(\"vendor_event t=\", TO_STRING(lastEventTime), \"ms\")" }] }]
else = [{ kind = "call", name = "SET_BOOL", args = [{ kind = "var", name = "ledVendor" }, { kind = "bool", value = false }] }, { kind = "assign", target = "logLine", value = { kind = "expr_text", text = "CONCAT(TO_STRING(GET_SYS_TIME()), \",\", TO_STRING_FMT(tempC, 2), \",\", SEL(sensorReady, \"adc\", \"i2c\"), \",\", SEL(vendorReady, \"N\", \"Y\"))" } }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "var", name = "logLine" }] }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "LOOP_DELAY" }] }]

[[functions]]
name = "isr_vendor_ext_irq"
params = []
body = [{ kind = "vendor_extension", reason = "ISR_ATTRIBUTE:bare-metal-stm32" }, { kind = "assign", target = "vendorEventFlag", value = { kind = "bool", value = true } }]

[[functions]]
name = "write_sd_record"
params = ["line"]
body = [{ kind = "vendor_extension", reason = "SD_CARD_WRITE:line" }, { kind = "vendor_extension", reason = "SD_CARD_FLUSH" }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(\"[SD] \", line)" }] }]

[[functions]]
name = "vendor_init_retry"
params = []
body = [{ kind = "assign", target = "initRetries", value = { kind = "uint", value = 0 } }, { kind = "assign", target = "vendorReady", value = { kind = "bool", value = false } }, { kind = "while", condition = { kind = "expr_text", text = "NOT vendorReady AND initRetries < VENDOR_INIT_RETRIES" }, body = [{ kind = "vendor_extension", reason = "PERIPHERAL_INIT:DMA_ENGINE,channel=2,retry=true" }, { kind = "assign", target = "initRetries", value = { kind = "expr_text", text = "initRetries + 1" } }, { kind = "if", condition = { kind = "expr_text", text = "initRetries < VENDOR_INIT_RETRIES" }, then = [{ kind = "assign", target = "vendorReady", value = { kind = "bool", value = true } }] }, { kind = "call", name = "SERIAL_PRINTLN", args = [{ kind = "expr_text", text = "CONCAT(\"vendor_init retries=\", TO_STRING(initRetries), \" ready=\", SEL(vendorReady, \"N\", \"Y\"))" }] }] }]
