[metadata]
asl_version = "0.0.1"
project_name = "G06-adc-multi-channel-logger"
editor = "dendriForge"
author = "dendriForge Golden Suite"
notes = "Migrated from legacy v010 TOON — ASL 0.0.1"

[[hardware]]
pin = 34
hw_type = "analog"
io_mode = "DI"
label = "adcCh0"
target_role = "adc:t"

[[hardware]]
pin = 35
hw_type = "analog"
io_mode = "DI"
label = "adcCh1"
target_role = "adc:t"

[[hardware]]
pin = 36
hw_type = "analog"
io_mode = "DI"
label = "adcCh2"
target_role = "adc:t"

[[hardware]]
pin = 37
hw_type = "analog"
io_mode = "DI"
label = "adcCh3"
target_role = "adc:t"

[[data]]
name = "SAMPLE_COUNT"
type = "UINT"
scope = "CONST"
init = "8"
