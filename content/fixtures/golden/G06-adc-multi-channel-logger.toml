[[data]]
name = "LOG_INTERVAL"
type = "TIME"
scope = "CONST"
init = "T#100ms"
unit = "ms"

[[data]]
name = "ADC_MIN"
type = "UINT"
scope = "CONST"
init = "0"
unit = "-"

[[data]]
name = "ADC_MAX"
