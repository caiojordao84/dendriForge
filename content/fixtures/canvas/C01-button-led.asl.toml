# Canvas fixture C01 — button input drives LED output (scenario-1 MVP trio).
# Pins: D2 = cmd-pushbutton-no-start, D13 = led (matches P01 wiring).

[metadata]
project_name = "C01-button-led"
editor = "dendriForge"
author = "dendriForge Priority 4"
notes = "Deterministic button→LED canvas binding fixture"

[[hardware]]
pin = 2
hw_type = "digital"
io_mode = "DI"
label = "btnPin"
target_role = "digital-in"

[[hardware]]
pin = 13
hw_type = "digital"
io_mode = "DO"
label = "ledPin"
target_role = "digital-out"

[[data]]
name = "pressed"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "uint", value = 2 }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "uint", value = 13 }]

[[setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "uint", value = 13 }, { kind = "bool", value = false }]

[[loop]]
kind = "assign"
target = "pressed"
value = { kind = "call", name = "GET_BOOL", args = [{ kind = "uint", value = 2 }] }

[[loop]]
kind = "call"
name = "SET_BOOL"
args = [
  { kind = "uint", value = 13 },
  { kind = "var", name = "pressed" },
]
