[metadata]
asl_version = "0.0.1"
project_name = "C01-button-led"
editor = "dendriForge"
author = "dendriForge Priority 4"
notes = "Uno + LED module with integrated 220-ohm SMD resistor + normally open pushbutton. LED on while button is pressed."

[board]
profile = "arduino-uno-r3"
instance_id = "board"
x = 1.0
y = 2.0
rotation = 0
mirror_x = false
mirror_y = false

[[components]]
instance_id = "led1"
profile = "led"
label = "Status LED"
x = 13.25
y = 2.25
rotation = 0
mirror_x = false
mirror_y = false

[components.params]
color = "red"
integrated_resistance = 220

[[components]]
instance_id = "btn_start"
profile = "cmd-pushbutton-no-start"
label = "Start button"
x = 13.0
y = 6.0
rotation = 0
mirror_x = false
mirror_y = false

[components.params]

[[wiring]]
from = "board.D13"
to = "led1.A"
signal = "digital"

[[wiring]]
from = "board.GND"
to = "led1.K"
signal = "gnd"

[[wiring]]
from = "board.D2"
to = "btn_start.NO"
signal = "digital"

[[wiring]]
from = "board.GND"
to = "btn_start.COM"
signal = "gnd"

[asl]
functions = []

[asl.metadata]
asl_version = "0.0.1"
project_name = "C01-button-led"
editor = "dendriForge"
author = "dendriForge Priority 4"

[[asl.hardware]]
pin = 2
hw_type = "digital"
io_mode = "DI"
label = "btnPin"
target_role = "digital-in"
pull = "pullup"

[[asl.hardware]]
pin = 13
hw_type = "digital"
io_mode = "DO"
label = "ledPin"
target_role = "digital-out"

[[asl.data]]
name = "pressed"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[asl.setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "var", name = "btnPin" }]

[[asl.setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "var", name = "ledPin" }]

[[asl.setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "var", name = "ledPin" }, { kind = "bool", value = false }]

[[asl.loop]]
kind = "assign"
target = "pressed"

[asl.loop.value]
kind = "unary"
op = "not"

[asl.loop.value.expr]
kind = "call"
name = "GET_BOOL"
args = [{ kind = "var", name = "btnPin" }]

[[asl.loop]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "var", name = "ledPin" }, { kind = "var", name = "pressed" }]
