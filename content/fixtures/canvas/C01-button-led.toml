[metadata]
asl_version = "0.0.1"
project_name = "C01-button-led"
editor = "dendriForge"
author = "dendriForge Priority 4"
notes = "Scenario-1 hardware: Uno + modular LED(+resistor) + pushbutton"

[board]
profile = "arduino-uno-r3"
instance_id = "board"

[[components]]
instance_id = "r_led"
profile = "resistor"
label = "LED series resistor"

[components.params]
resistance = 220

[[components]]
instance_id = "led1"
profile = "led"
label = "Status LED"

[components.params]
color = "red"

[[components]]
instance_id = "btn_start"
profile = "cmd-pushbutton-no-start"
label = "Start button"

[components.params]

[[wiring]]
from = "board.D13"
to = "r_led.A"
signal = "digital"

[[wiring]]
from = "r_led.B"
to = "led1.A"
signal = "digital"

[[wiring]]
from = "board.GND"
to = "led1.K"
signal = "gnd"

[[wiring]]
from = "board.D2"
to = "btn_start.NO"
signal = "digital"

[[wiring]]
from = "board.GND"
to = "btn_start.COM"
signal = "gnd"

[asl]
functions = []

[asl.metadata]
asl_version = "0.0.1"
project_name = "C01-button-led"
editor = "dendriForge"
author = "dendriForge Priority 4"

[[asl.hardware]]
pin = 2
hw_type = "digital"
io_mode = "DI"
label = "btnPin"
target_role = "digital-in"

[[asl.hardware]]
pin = 13
hw_type = "digital"
io_mode = "DO"
label = "ledPin"
target_role = "digital-out"

[[asl.data]]
name = "pressed"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[asl.setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "var", name = "btnPin" }]

[[asl.setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "var", name = "ledPin" }]

[[asl.setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "var", name = "ledPin" }, { kind = "bool", value = false }]

[[asl.loop]]
kind = "assign"
target = "pressed"
value = { kind = "call", name = "GET_BOOL", args = [{ kind = "var", name = "btnPin" }] }

[[asl.loop]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "var", name = "ledPin" }, { kind = "var", name = "pressed" }]
