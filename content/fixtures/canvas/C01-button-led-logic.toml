# Canvas fixture C01 — button input drives LED output (scenario-1 MVP trio).
# Pins: D2 = cmd-pushbutton-no-start (pull-up, active-low), D13 = integrated LED.

[metadata]
asl_version = "0.0.1"
project_name = "C01-button-led"
editor = "dendriForge"
author = "dendriForge Priority 4"
notes = "Deterministic button→LED canvas binding fixture (NOT GET_BOOL for pull-up)"

[[hardware]]
pin = 2
hw_type = "digital"
io_mode = "DI"
label = "btnPin"
target_role = "digital-in"
pull = "pullup"

[[hardware]]
pin = 13
hw_type = "digital"
io_mode = "DO"
label = "ledPin"
target_role = "digital-out"

[[data]]
name = "pressed"
type = "BOOL"
scope = "VAR"
init = "FALSE"
unit = "-"

[[setup]]
kind = "call"
name = "CFG_DIGITAL_INPUT"
args = [{ kind = "var", name = "btnPin" }]

[[setup]]
kind = "call"
name = "CFG_DIGITAL_OUTPUT"
args = [{ kind = "var", name = "ledPin" }]

[[setup]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "var", name = "ledPin" }, { kind = "bool", value = false }]

[[loop]]
kind = "assign"
target = "pressed"

[loop.value]
kind = "unary"
op = "not"

[loop.value.expr]
kind = "call"
name = "GET_BOOL"
args = [{ kind = "var", name = "btnPin" }]

[[loop]]
kind = "call"
name = "SET_BOOL"
args = [{ kind = "var", name = "ledPin" }, { kind = "var", name = "pressed" }]
