[restrictions]
max_io_current = "40mA"
total_current_limit = "500mA"
warnings = ["GPIO11/GPIO12 are the internal I2C bus shared by ALL onboard ICs: AXP2101 PMU (0x34), FT6336U touch (0x38), BMI270 IMU (0x69), BMM150 (0x10 via BMI270 aux), BM8563 RTC (0x51), ES7210 mic (0x40), AW88298 amp (0x36), AW9523B expander (0x58), LTR-553 (0x23), GC0308 (0x21); do NOT connect external devices to GPIO11/GPIO12; use Grove PORT.A (GPIO1/GPIO2) for external I2C; address conflicts will cause bus lockup", "LCD and microSD share HSPI SPI bus (MOSI=G37, SCK=G36, MISO=G35); CS are separate (LCD=G3, SD=G4); firmware must arbitrate SPI bus with mutex when using both; set bus speed to the lower of ILI9342C (40MHz max) and microSD (25MHz max), or use separate SPIClass instances", "LCD backlight and reset are controlled by AW9523B I/O expander (0x58) and AXP2101 PMU via I2C; there is NO direct GPIO for backlight or LCD reset; use M5Unified or M5GFX library which handles AXP2101/AW9523B automatically; direct GPIO writes for backlight have no effect", "Touch controller FT6336U interrupt is routed through AW9523B pin P1_2; the ESP32 receives touch events via GPIO21 (AW9523B INT output); software must read touch coordinates over I2C (GPIO11/GPIO12 bus) after the interrupt; GPIO21 only signals touch-detected, not coordinates", "GPIO0 is I2S MCLK for ES7210 microphone; must be configured as I2S output before enabling audio; GPIO0 is also adjacent to BOOT strapping logic; using GPIO0 as regular GPIO while I2S is active will corrupt audio output", "Camera uses 11 GPIO pins: G39-G42 (D0-D3), G15, G16, G47, G48 (D4-D7), G45 PCLK, G46 VSYNC, G38 HREF; none of these are available for other use; camera reset and power-down are controlled via AW9523B expander, not direct GPIO", "AXP2101 PMU controls all power rails (3.3V, 5V, LCD backlight DLDO1, camera power); improper I2C writes to AXP2101 registers can shut down power rails causing immediate reset; always use official M5Stack AXP2101 driver; do NOT write arbitrary values to AXP2101 registers", "BMM150 magnetometer (0x10) is connected through BMI270 sensor hub auxiliary I2C interface, not directly on the main I2C bus; access BMM150 via BMI270 API passthrough mode; direct I2C 0x10 address scan will not find it; sensor is sensitive to nearby magnets; do not pair with M5Stack accessories containing magnets", "GPIO19/GPIO20 are native USB D-/D+; do not use as GPIO when USB CDC is active; long-press RESET 3s (green LED on) to enter download mode; long-press POWER 6s to power off; board powers from USB-C 5V, LiPo 3.7V, or HVIN 9-24V on DinBase; do not connect HVIN without DinBase"]
compatibility = "pio m5stack-cores3 | frameworks \"arduino;espidf\" | languages \"arduino-cpp;micropython;uiflow2\" | bootloader \"esp-idf-bootloader\""

