[restrictions]
max_io_current = "40mA"
total_current_limit = "1200mA"
warnings = ["GPIO21 controls the TFT backlight (HIGH=on); it is ALSO exposed on the P3 connector; as long as the display backlight is on, GPIO21 is driven HIGH by the display driver; if GPIO21 is used as a free GPIO output, it will conflict with the backlight state; to use GPIO21 freely, either control backlight manually and accept it tied to GPIO21 state, or physically cut the PCB trace from GPIO21 to the backlight FET and wire backlight to 3.3V permanently", "GPIO35 and GPIO39 are INPUT ONLY pins on ESP32 — they have NO internal pull-up/pull-down, NO output driver, and CANNOT be configured as outputs; attempting digitalWrite() on GPIO35 or GPIO39 will silently fail; GPIO34 and GPIO36 are also input-only; never connect these pins to circuits expecting bidirectional data", "The TFT (HSPI) and the touchscreen plus microSD (VSPI) use TWO separate SPI buses; TFT uses HSPI (GPIO13/14/15/2); touchscreen XPT2046 and microSD share VSPI (GPIO23/19/18 MOSI/MISO/SCK with separate CS GPIO5 and GPIO33); mixing TFT and touch/SD SPI calls on the wrong bus will cause display corruption or touch failure; always verify SPIClass(HSPI) vs SPIClass(VSPI) in firmware", "GPIO1 (TX) and GPIO3 (RX) are connected to BOTH the ESP32 UART0 AND the CH340C USB-serial chip; when the USB cable is connected and serial monitor is active, the CH340C drives these lines; connecting external serial devices to GPIO1/GPIO3 via the P1 connector while USB is active will cause bus contention; P1 serial use requires disconnecting USB or using a different UART (UART1 or UART2 on GPIO22/GPIO27)", "RGB LED uses active-LOW logic: write LOW to illuminate, HIGH to turn off; GPIO4=Red, GPIO16=Green, GPIO17=Blue; GPIO16 may share the TFT MISO line on some board revisions — if TFT MISO is needed (for display readback), avoid using GPIO16 as RGB LED simultaneously; most ILI9341 applications do not require MISO so this is rarely an issue in practice", "The onboard LDR (GPIO34) has 1M ohm pull-up (R15) and 1M ohm parallel resistor (R19) to GND as shipped; this results in very low ADC swing between light and dark conditions (approximately 0.016V to 0.617V); for useful light sensing, remove R19 and replace R15 with 10k ohm; GPIO34 has a pull-up to 3.3V in the stock circuit so analogRead without modification will always read near-maximum in normal room lighting", "GPIO27 has a 10k ohm pull-up resistor R18 to 3.3V soldered on the PCB; analogRead(27) on an unconnected GPIO27 returns 4095 (3.3V); this pull-up assists I2C use (SDA with no external pull-up needed) but means GPIO27 is not a clean floating input; sensors that require a floating or pull-DOWN input will not work correctly without removing R18; GPIO27 is recommended for I2C SDA with GPIO22 as SCL for external sensors via CN1", "Speaker output on GPIO26 uses the ESP32 DAC2 (8-bit resolution) or LEDC PWM; there is no onboard amplifier — the 1.25mm JST connector connects directly to a small passive speaker; output voltage swing is 0-3.3V at GPIO26 current limits (40mA max); do not connect a low-impedance speaker (less than 8 ohm) directly; use a PAM8403 or similar amplifier module for adequate volume; GPIO26 is shared with DAC2 and cannot be used for other digital output while DAC audio is active", "The board has NO dedicated 5V or GND screw/pin header for external power; the only power input is USB Micro-B (5V); power can be injected via P1 connector VIN pin (5V) or by soldering to USB 5V pads; there is NO 3.3V output header exposed for external use except on CN1; free GPIO count is critically low: only GPIO22, GPIO27, and GPIO35 (input-only) are fully accessible without hardware modification; projects requiring more GPIO must use I2C expanders (PCF8574) or remove the RGB LED (frees GPIO4, GPIO16, GPIO17)"]
compatibility = "pio esp32dev | frameworks \"arduino;espidf\" | languages \"arduino-cpp;micropython\" | bootloader \"esp-idf-bootloader\""

