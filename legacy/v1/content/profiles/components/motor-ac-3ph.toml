[[ports]]
direction = "input"
id = "PE"
notes = "protective earth / frame ground"
type = "ground"

[simulation]
bidirectional = false
dynamic = true
equation = "T = (power_rated * efficiency/100) / (2 * pi * speed_rated / 60); I = power_rated / (sqrt(3) * voltage_rated * power_factor * efficiency/100)"
model = "basic-analog"
motion = "rotary"
noise_model = false
states = ["off", "starting", "running", "fault"]
thermal_model = true

[limits]
ip_rating = "IP55"
max_current = "2000A"
max_temp = 40
max_voltage = "11000V"
min_temp = -20
warnings = ["Always verify phase sequence before starting — incorrect sequence causes reverse rotation", "Provide overcurrent and thermal overload protection sized to rated current", "Star-delta starters must not switch under full load — use adequate timing relay", "Do not exceed insulation class temperature limit including ambient and self-heating"]

[connections]
allowed_with = ["ac-source-3phase", "contactor-*", "act-vfd", "act-starter-dol", "act-starter-sd"]
forbidden_with = ["dc-source", "ac-source", "battery"]
requires = ["ac-source-3phase"]
typical_context = ["pump-drive", "fan-drive", "compressor", "conveyor", "industrial-machine"]

