# component profile — hyd-cylinder-telescopic-da (migrated from legacy TOON)
# Source: hyd-cylinder-telescopic-da.toon
# ASL 0.0.1 lives on program IR (metadata.asl_version), not profiles.


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "hyd-cylinder-telescopic-da-profile"

[identification]
category = "actuator"
family = "hydraulics"
id = "hyd-cylinder-telescopic-da"
image = "hyd-cylinder-telescopic-da.svg"
name = "Double-Acting Telescopic Hydraulic Cylinder (Cilindro telescópico DA)"
standard = "custom"
subfamily = "hydraulic-actuators"
symbol = "hyd-cylinder-telescopic-da-symbol.svg"
symbol_standard = "ISO"

[params.bore]
default = 100
editable = true
label = "Max Bore Diameter"
options = [63, 80, 100, 125, 160]
type = "enum"
unit = "mm"

[params.initial_position]
default = "retracted"
editable = true
label = "Initial Position"
options = ["retracted", "extended"]
type = "enum"

[params.operating_pressure]
default = 200
editable = true
label = "Operating Pressure"
max = 350
min = 10
type = "float"
unit = "bar"

[params.port_size]
default = "G1/2"
editable = true
label = "Port Size"
options = ["G3/8", "G1/2", "G3/4", "G1"]
type = "enum"

[params.stages]
default = 3
editable = true
label = "Number of Stages"
options = [2, 3, 4, 5]
type = "enum"

[params.stroke]
default = 1500
editable = true
label = "Total Stroke"
max = 6000
min = 200
type = "float"
unit = "mm"
ports = []

[[hydraulic_ports]]
direction = "bidirectional"
id = "A"
notes = "port A — extend"
pressure_max = "{operating_pressure}bar"
type = "hydraulic"

[[hydraulic_ports]]
direction = "bidirectional"
id = "B"
notes = "port B — retract"
pressure_max = "{operating_pressure}bar"
type = "hydraulic"

[[sensor_slots]]
compatible_sensors = ["hyd-pressure-switch-no", "sensor-limit-switch"]
id = "S1"
position = "retracted-end"

[[sensor_slots]]
compatible_sensors = ["hyd-pressure-switch-no", "sensor-limit-switch"]
id = "S2"
position = "extended-end"

[simulation]
bidirectional = true
dynamic = true
leakage_model = true
model = "hydraulic-linear-actuator"
motion = "linear"
noise_model = false
position_feedback = true
states = ["retracted", "extending", "extended", "retracting"]
thermal_model = false
velocity_model = "simplified"

[limits]

[limits.max_force]
extend = "calc:pi*(bore/2)^2 * operating_pressure * 0.1"
retract = "calc:pi*((bore/2)^2-(bore*0.8/2)^2) * operating_pressure * 0.1"
max_pressure = "{operating_pressure}"
max_temp = 80
min_pressure = 10
min_temp = -20
warnings = ["Extend force and speed change non-linearly as consecutive stages deploy", "Retract area is significantly smaller; pull force is inherently restricted", "Ensure the hydraulic system tank can handle the differential oil volume during retraction"]

[connections]
allowed_with = ["hyd-valve-4-2-*", "hyd-valve-4-3-*", "hyd-flow-control-*", "hyd-manifold-block"]
forbidden_with = ["pneu-*", "act-motor-*"]
requires = ["hyd-power-unit"]
typical_context = ["dump-trucks", "heavy-lifting", "compact-installation"]

[canvas]
animated = true
height = 40
label_position = "bottom"

[canvas.port_A]
x = 20
y = 0

[canvas.port_B]
x = 100
y = 0
ports_layout = "custom"
value_display = "DA-Tele Ø{bore}mm × {stroke}mm"
width = 120

[dendri]
component_family_skill_id = "hydraulics-family"
component_profile_id = "hyd-cylinder-telescopic-da"
palette_group = "Hydraulics > Hydraulic Actuators"
simulation_engine = "hydraulic-motion"
svg_path = "content/assets/svg/components/hyd-cylinder-telescopic-da.svg"
tags = ["cylinder", "telescopic", "hydraulic", "double-acting", "actuator", "linear"]
svg_status = "missing"
