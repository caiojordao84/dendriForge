# component profile — act-stepper-motor (migrated from legacy TOON)
# Source: act-stepper-motor.toon
# ASL 0.0.1 lives on program IR (metadata.asl_version), not profiles.


[metadata]
author = "schemasmith"
editor = "dendriForge"
project_name = "act-stepper-motor-profile"

[identification]
category = "actuator"
family = "actuators"
id = "act-stepper-motor"
image = "act-stepper-motor.svg"
name = "Stepper Motor"
standard = "IEC 60034-1"
subfamily = "industrial-electrical"
symbol = "act-stepper-motor-symbol.svg"
symbol_standard = "IEC"

[params.current_per_phase]
default = 1
editable = false
label = "Current per Phase"
max = 10
min = 0.1
type = "float"
unit = "A"

[params.frame_size]
default = "NEMA17"
editable = true
label = "NEMA Frame Size"
options = ["NEMA8", "NEMA11", "NEMA14", "NEMA17", "NEMA23", "NEMA34"]
type = "enum"

[params.holding_torque]
default = 0.4
editable = false
label = "Holding Torque"
max = 50
min = 0.01
type = "float"
unit = "V"

[params.steps_per_rev]
default = 200
editable = true
label = "Steps per Revolution"
options = [48, 100, 200, 400]
type = "enum"

[params.voltage]
default = 12
editable = true
label = "Rated Voltage"
options = [5, 12, 24, 48]
type = "enum"
unit = "V"

[params.winding_type]
default = "bipolar"
editable = true
label = "Winding Type"
options = ["bipolar", "unipolar"]
type = "enum"

[[ports]]
current_max = "10A"
direction = "input"
id = "A_POS"
notes = "Phase A positive coil terminal"
type = "power"
voltage_max = "48V"

[[ports]]
current_max = "10A"
direction = "input"
id = "A_NEG"
notes = "Phase A negative coil terminal"
type = "power"
voltage_max = "48V"

[[ports]]
current_max = "10A"
direction = "input"
id = "B_POS"
notes = "Phase B positive coil terminal"
type = "power"
voltage_max = "48V"

[[ports]]
current_max = "10A"
direction = "input"
id = "B_NEG"
notes = "Phase B negative coil terminal"
type = "power"
voltage_max = "48V"

[simulation]
bidirectional = true
dynamic = true
model = "basic-analog"
motion = "rotary"
noise_model = false
states = ["idle", "stepping", "holding", "fault"]
thermal_model = true

[limits]
max_current = "10A"
max_temp = 85
max_voltage = "48V"
min_temp = -20
warnings = ["Do not disconnect stepper windings while driver is energised — may damage driver", "Provide flyback diode protection in driver if not built-in", "Current must be limited by driver — never apply rated voltage without current limiting"]

[connections]
allowed_with = ["ind-stepper-driver", "mcu-*", "plc-*"]
forbidden_with = ["ac-source"]
requires = ["dc-source"]
typical_context = ["cnc-axis", "3d-printer", "precision-positioning"]

[canvas]
animated = true
height = 60
label_position = "right"

[canvas.port_A_NEG]
x = 0
y = 25

[canvas.port_A_POS]
x = 0
y = 10

[canvas.port_B_NEG]
x = 0
y = 55

[canvas.port_B_POS]
x = 0
y = 40
ports_layout = "custom"
value_display = "{frame_size} / {steps_per_rev}spr / {winding_type}"
width = 70

[dendri]
component_family_skill_id = "actuators-family"
component_profile_id = "act-stepper-motor"
palette_group = "Actuators > Industrial Electrical"
simulation_engine = "digital-io"
svg_path = "content/assets/svg/components/act-stepper-motor.svg"
tags = ["stepper-motor", "actuator", "industrial-electrical", "stepping", "bipolar", "cnc"]
svg_status = "missing"
