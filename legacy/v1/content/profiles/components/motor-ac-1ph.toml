type = "analog"
voltage_max = "240V"

[simulation]
bidirectional = false
dynamic = true
equation = "T = (power_rated * efficiency/100) / (2 * pi * speed_rated / 60); I = power_rated / (voltage_rated * power_factor * efficiency/100)"
model = "basic-analog"
motion = "rotary"
noise_model = false
states = ["off", "starting", "running", "fault"]
thermal_model = true

[limits]
ip_rating = "IP44"
max_current = "50A"
max_temp = 40
max_voltage = "240V"
min_temp = -15
warnings = ["Start capacitor must be disconnected automatically after reaching operating speed — use centrifugal switch or relay", "Run capacitor must be rated for continuous AC operation (polypropylene type) — never use electrolytic as run capacitor", "Single-phase motors produce pulsating torque — avoid use in vibration-sensitive applications", "Provide thermal overload relay sized to rated current to protect against locked-rotor condition"]

[connections]
allowed_with = ["ac-source", "contactor-*"]
forbidden_with = ["dc-source", "battery", "ac-source-3phase"]
requires = ["ac-source"]
typical_context = ["pump", "fan", "compressor", "washing-machine", "domestic-appliance"]

