<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="16mm"
   height="16mm"
   viewBox="0 0 60 60"
   version="1.1"
   id="potentiometer"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:df="https://dendriforge.dev/ns/1.0"
   df:profile="potentiometer"
   df:version="0.1.0">
  <title>Potentiometer (minimal D1 stub)</title>
  <desc>Required ids: #wiper, #actuator. Analog live path is D2; this SVG satisfies svg_status authored.</desc>
  <defs>
    <style type="text/css"><![CDATA[
      .body { fill: #4a5568; stroke: #2d3748; stroke-width: 1.5; }
      .track { fill: none; stroke: #a0aec0; stroke-width: 3; }
      #actuator { fill: #718096; stroke: #2d3748; stroke-width: 1.2; cursor: pointer; }
      #wiper { fill: #ed8936; stroke: #c05621; stroke-width: 1; }
      .label { fill: #e2e8f0; font-family: sans-serif; font-size: 6px; text-anchor: middle; }
    ]]></style>
  </defs>
  <rect class="body" x="6" y="6" width="48" height="48" rx="4"/>
  <circle class="track" cx="30" cy="30" r="16"/>
  <g id="actuator">
    <circle cx="30" cy="30" r="10"/>
  </g>
  <g id="wiper">
    <line x1="30" y1="30" x2="30" y2="16" stroke="#ed8936" stroke-width="2"/>
    <circle cx="30" cy="16" r="3"/>
  </g>
  <text class="label" x="30" y="56">POT</text>
</svg>
