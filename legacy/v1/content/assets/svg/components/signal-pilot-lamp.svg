<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="24mm"
   height="24mm"
   viewBox="0 0 90 90"
   version="1.1"
   id="signal-pilot-lamp"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:df="https://dendriforge.dev/ns/1.0"
   df:profile="signal-pilot-lamp"
   df:version="0.1.0">
  <title>Signal Pilot Lamp 22 mm</title>
  <desc>Required id: #led-body (brightness/burned pipeline, same as LED). 24×24 mm outer (2 mm quantum).</desc>
  <defs>
    <style type="text/css"><![CDATA[
      :root {
        --df-led-fill: #27ae60;
        --df-state-opacity: 0.35;
      }
      .housing { fill: #2c3e50; stroke: #1a252f; stroke-width: 2; }
      .bezel { fill: #7f8c8d; stroke: #566573; stroke-width: 1.5; }
      #led-body.off { opacity: 0.35; }
      #led-body.on { opacity: 1.0; filter: url(#df-glow); }
      #led-body.burned { opacity: 0.25; fill: #1a1a1a; }
      .label { fill: #ecf0f1; font-family: sans-serif; font-size: 7px; text-anchor: middle; }
    ]]></style>
    <filter id="df-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect class="housing" x="8" y="8" width="74" height="74" rx="6" ry="6"/>
  <circle class="bezel" cx="45" cy="42" r="24"/>
  <circle
     id="led-body"
     class="off"
     cx="45" cy="42" r="18"
     style="fill:var(--df-led-fill); opacity:var(--df-state-opacity);"/>
  <ellipse id="lens" cx="42" cy="36" rx="10" ry="7"
     style="fill:#ffffff; fill-opacity:0.25; mix-blend-mode:screen;"/>
  <text class="label" x="45" y="82">PILOT</text>
</svg>
