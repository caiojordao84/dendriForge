[[setup]]
kind = "call"
name = "CFG_I2C_BUS"
args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "uint", value = 1 }, { kind = "uint", value = 400000 }]

[[setup]]
kind = "call"
name = "CFG_OLED_I2C"
args = [{ kind = "hex", value = "0x3C" }, { kind = "uint", value = 128 }, { kind = "uint", value = 64 }]

[[setup]]
kind = "call"
name = "OLED_CLEAR"
args = []

[[setup]]
kind = "call"
name = "drawCourt"
args = []

[[setup]]
kind = "call"
name = "OLED_DISPLAY"
args = []

[[setup]]
kind = "assign"
target = "ballUpdate"
value = { kind = "expr_text", text = "GET_TIMESTAMP()" }

[[setup]]
kind = "assign"
target = "paddleUpdate"
value = { kind = "var", name = "ballUpdate" }

[[loop]]
kind = "assign"
target = "currentTime"
value = { kind = "expr_text", text = "GET_TIMESTAMP()" }

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "currentTime > ballUpdate" }
then = [{ kind = "call", name = "update_ball", args = [] }]

[[loop]]
kind = "if"
condition = { kind = "expr_text", text = "currentTime > paddleUpdate" }
then = [{ kind = "call", name = "update_paddles", args = [] }]

[[loop]]
kind = "if"
condition = { kind = "var", name = "gameOver" }
then = [{ kind = "call", name = "reset_game", args = [] }]

[[loop]]
kind = "call"
name = "draw_score"
args = []

[[loop]]
kind = "call"
name = "OLED_DISPLAY"
args = []

[[loop]]
kind = "call"
name = "WAIT_TIME"
args = [{ kind = "var", name = "LOOP_INTERVAL" }]

[[functions]]
name = "drawCourt"
params = []
body = [{ kind = "call", name = "OLED_DRAW_RECT", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 0 }, { kind = "uint", value = 128 }, { kind = "uint", value = 54 }, { kind = "var", name = "WHITE" }] }]

[[functions]]
name = "update_ball"
params = []
body = [{ kind = "assign", target = "newX", value = { kind = "expr_text", text = "ballX + ballDirX" } }, { kind = "assign", target = "newY", value = { kind = "expr_text", text = "ballY + ballDirY" } }, { kind = "if", condition = { kind = "expr_text", text = "newX == 0 OR newX == 127" }, then = [{ kind = "assign", target = "ballDirX", value = { kind = "expr_text", text = "-ballDirX" } }] }, { kind = "if", condition = { kind = "expr_text", text = "newX < 64" }, then = [{ kind = "assign", target = "playerScore", value = { kind = "expr_text", text = "playerScore + 1" } }, { kind = "call", name = "play_score_tone", args = [] }], else = [{ kind = "assign", target = "mcuScore", value = { kind = "expr_text", text = "mcuScore + 1" } }, { kind = "call", name = "play_score_tone", args = [] }] }, { kind = "if", condition = { kind = "expr_text", text = "playerScore == SCORE_LIMIT OR mcuScore == SCORE_LIMIT" }, then = [{ kind = "assign", target = "win", value = { kind = "expr_text", text = "playerScore > mcuScore" } }, { kind = "assign", target = "gameOver", value = { kind = "bool", value = true } }] }, { kind = "if", condition = { kind = "expr_text", text = "newY == 0 OR newY == 53" }, then = [{ kind = "assign", target = "ballDirY", value = { kind = "expr_text", text = "-ballDirY" } }, { kind = "call", name = "play_wall_tone", args = [] }] }, { kind = "if", condition = { kind = "expr_text", text = "newX == 12 AND newY >= mcuY AND newY <= mcuY + PADDLE_HEIGHT" }, then = [{ kind = "assign", target = "ballDirX", value = { kind = "expr_text", text = "-ballDirX" } }, { kind = "call", name = "play_mcu_tone", args = [] }] }, { kind = "if", condition = { kind = "expr_text", text = "newX == 115 AND newY >= playerY AND newY <= playerY + PADDLE_HEIGHT" }, then = [{ kind = "assign", target = "ballDirX", value = { kind = "expr_text", text = "-ballDirX" } }, { kind = "call", name = "play_player_tone", args = [] }, { kind = "call", name = "OLED_DRAW_PIXEL", args = [{ kind = "var", name = "ballX" }, { kind = "var", name = "ballY" }, { kind = "var", name = "BLACK" }] }, { kind = "call", name = "OLED_DRAW_PIXEL", args = [{ kind = "var", name = "newX" }, { kind = "var", name = "newY" }, { kind = "var", name = "WHITE" }] }, { kind = "assign", target = "ballX", value = { kind = "var", name = "newX" } }, { kind = "assign", target = "ballY", value = { kind = "var", name = "newY" } }, { kind = "assign", target = "ballUpdate", value = { kind = "expr_text", text = "ballUpdate + BALL_RATE" } }] }]

[[functions]]
name = "update_paddles"
params = []
body = [{ kind = "call", name = "OLED_DRAW_VLINE", args = [{ kind = "uint", value = 12 }, { kind = "var", name = "mcuY" }, { kind = "var", name = "PADDLE_HEIGHT" }, { kind = "var", name = "BLACK" }] }, { kind = "call", name = "OLED_DRAW_VLINE", args = [{ kind = "uint", value = 115 }, { kind = "var", name = "playerY" }, { kind = "var", name = "PADDLE_HEIGHT" }, { kind = "var", name = "BLACK" }] }, { kind = "if", condition = { kind = "expr_text", text = "GET_BOOL(2) == FALSE" }, then = [{ kind = "assign", target = "playerY", value = { kind = "expr_text", text = "playerY - 2" } }] }, { kind = "if", condition = { kind = "expr_text", text = "GET_BOOL(3) == FALSE" }, then = [{ kind = "assign", target = "playerY", value = { kind = "expr_text", text = "playerY + 2" } }] }, { kind = "if", condition = { kind = "expr_text", text = "playerY < 1" }, then = [{ kind = "assign", target = "playerY", value = { kind = "uint", value = 1 } }] }, { kind = "if", condition = { kind = "expr_text", text = "playerY + PADDLE_HEIGHT > 53" }, then = [{ kind = "assign", target = "playerY", value = { kind = "expr_text", text = "53 - PADDLE_HEIGHT" } }] }, { kind = "if", condition = { kind = "expr_text", text = "mcuY + 4 > ballY" }, then = [{ kind = "assign", target = "mcuY", value = { kind = "expr_text", text = "mcuY - 1" } }] }, { kind = "if", condition = { kind = "expr_text", text = "mcuY + 4 < ballY" }, then = [{ kind = "assign", target = "mcuY", value = { kind = "expr_text", text = "mcuY + 1" } }] }, { kind = "call", name = "OLED_DRAW_VLINE", args = [{ kind = "uint", value = 12 }, { kind = "var", name = "mcuY" }, { kind = "var", name = "PADDLE_HEIGHT" }, { kind = "var", name = "WHITE" }] }, { kind = "call", name = "OLED_DRAW_VLINE", args = [{ kind = "uint", value = 115 }, { kind = "var", name = "playerY" }, { kind = "var", name = "PADDLE_HEIGHT" }, { kind = "var", name = "WHITE" }] }, { kind = "assign", target = "paddleUpdate", value = { kind = "expr_text", text = "paddleUpdate + PADDLE_RATE" } }]

[[functions]]
name = "draw_score"
params = []
body = [{ kind = "call", name = "OLED_SET_TEXT_COLOR", args = [{ kind = "var", name = "WHITE" }, { kind = "var", name = "BLACK" }] }, { kind = "call", name = "OLED_SET_CURSOR", args = [{ kind = "uint", value = 0 }, { kind = "uint", value = 56 }] }, { kind = "call", name = "OLED_PRINT", args = [{ kind = "expr_text", text = "TO_STRING(mcuScore)" }] }, { kind = "call", name = "OLED_SET_CURSOR", args = [{ kind = "uint", value = 122 }, { kind = "uint", value = 56 }] }, { kind = "call", name = "OLED_PRINT", args = [{ kind = "expr_text", text = "TO_STRING(playerScore)" }] }]

[[functions]]
name = "reset_game"
params = []
body = [{ kind = "call", name = "OLED_CLEAR", args = [] }, { kind = "if", condition = { kind = "var", name = "win" }, then = [{ kind = "call", name = "OLED_SET_CURSOR", args = [{ kind = "uint", value = 40 }, { kind = "uint", value = 28 }] }, { kind = "call", name = "OLED_PRINT", args = [{ kind = "string", value = "YOU WIN!" }] }], else = [{ kind = "call", name = "OLED_SET_CURSOR", args = [{ kind = "uint", value = 40 }, { kind = "uint", value = 28 }] }, { kind = "call", name = "OLED_PRINT", args = [{ kind = "string", value = "YOU LOSE!" }] }, { kind = "call", name = "OLED_DISPLAY", args = [] }, { kind = "call", name = "WAIT_TIME", args = [{ kind = "var", name = "RESET_DELAY" }] }, { kind = "assign", target = "playerScore", value = { kind = "uint", value = 0 } }, { kind = "assign", target = "mcuScore", value = { kind = "uint", value = 0 } }, { kind = "assign", target = "gameOver", value = { kind = "bool", value = false } }, { kind = "assign", target = "ballX", value = { kind = "uint", value = 53 } }, { kind = "assign", target = "ballY", value = { kind = "uint", value = 26 } }, { kind = "assign", target = "ballDirX", value = { kind = "uint", value = 1 } }, { kind = "assign", target = "ballDirY", value = { kind = "uint", value = 1 } }, { kind = "call", name = "OLED_CLEAR", args = [] }, { kind = "call", name = "drawCourt", args = [] }] }]

[[functions]]
name = "play_player_tone"
params = []
body = [{ kind = "call", name = "PLAY_TONE", args = [{ kind = "var", name = "buzzerPin" }, { kind = "uint", value = 250 }, { kind = "time", value = "T#25ms" }] }]

[[functions]]
name = "play_mcu_tone"
params = []
body = [{ kind = "call", name = "PLAY_TONE", args = [{ kind = "var", name = "buzzerPin" }, { kind = "uint", value = 225 }, { kind = "time", value = "T#25ms" }] }]

[[functions]]
name = "play_wall_tone"
params = []
body = [{ kind = "call", name = "PLAY_TONE", args = [{ kind = "var", name = "buzzerPin" }, { kind = "uint", value = 200 }, { kind = "time", value = "T#25ms" }] }]

[[functions]]
name = "play_score_tone"
params = []
body = [{ kind = "call", name = "PLAY_TONE", args = [{ kind = "var", name = "buzzerPin" }, { kind = "uint", value = 500 }, { kind = "time", value = "T#100ms" }] }]
