name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  hygiene-and-tests:
    name: Gates 1-3, 5 & 12 (Hygiene, Lints, Tests, Provenance, Ledger)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.100.0"
          components: rustfmt, clippy

      - name: Gate 1 — Formatting check
        run: cargo fmt --all -- --check

      - name: Gate 1 & 2 — Clippy strict lints (-D warnings, zero panics/wildcards/hash-iter)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Gate 1 — Single usvg version guard
        run: |
          count=$(cargo tree --workspace --duplicates 2>/dev/null | grep -c '^usvg ' || true)
          if [ "$count" -gt 0 ]; then
            echo "ERROR: Multiple usvg versions detected in workspace dependency graph!"
            cargo tree --workspace --duplicates
            exit 1
          fi

      - name: Gate 3 — Unit & property tests
        run: cargo test --workspace

      - name: Gate 5 — Standards & provenance/license check
        run: |
          cargo run -q -p dendri-cli -- standards-check
          cargo run -q -p dendri-cli -- provenance-check

      - name: Gate 12 — Stub & deferral ledger check
        run: cargo run -q -p dendri-cli -- ledger-check
