name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.86.0"
      - name: cargo test
        run: cargo test --workspace
      - name: golden round-trip (CLI)
        run: |
          cargo build -p dendri-cli
          for f in content/fixtures/golden/*.asl.toml content/fixtures/examples/*.asl.toml content/fixtures/sim/*.asl.toml; do
            echo "== roundtrip $f"
            cargo run -q -p dendri-cli -- roundtrip "$f"
          done
          cargo run -q -p dendri-cli -- roundtrip content/fixtures/projects/P01-uno-led-blink.dendri.toml
      - name: sim trace snapshots
        run: cargo test -p dendri-sim --test trace_snapshots
      - name: profiles MVP load
        run: cargo run -q -p dendri-cli -- profiles
      - name: frontend round-trips (C++ / MicroPython / ST / Ladder / SFC)
        run: |
          for lang in cpp micropython st ladder sfc; do
            echo "== frontend-roundtrip $lang S01"
            cargo run -q -p dendri-cli -- frontend-roundtrip --lang "$lang" content/fixtures/sim/S01-blink-set-bool-wait.asl.toml
          done
          for lang in cpp micropython st; do
            echo "== frontend-roundtrip $lang S02"
            cargo run -q -p dendri-cli -- frontend-roundtrip --lang "$lang" content/fixtures/sim/S02-ton-on-delay.asl.toml
            echo "== frontend-roundtrip $lang S03"
            cargo run -q -p dendri-cli -- frontend-roundtrip --lang "$lang" content/fixtures/sim/S03-control-flow-get-bool.asl.toml
            echo "== frontend-roundtrip $lang S04"
            cargo run -q -p dendri-cli -- frontend-roundtrip --lang "$lang" content/fixtures/sim/S04-pwm-adc-map.asl.toml
            echo "== frontend-roundtrip $lang S05"
            cargo run -q -p dendri-cli -- frontend-roundtrip --lang "$lang" content/fixtures/sim/S05-uart-i2c-spi.asl.toml
            echo "== frontend-roundtrip $lang S06"
            cargo run -q -p dendri-cli -- frontend-roundtrip --lang "$lang" content/fixtures/sim/S06-iec-tof-trig.asl.toml
            echo "== frontend-roundtrip $lang S07"
            cargo run -q -p dendri-cli -- frontend-roundtrip --lang "$lang" content/fixtures/sim/S07-iec-counters.asl.toml
          done
          cargo test -p dendri-frontends --test frontend_acceptance
          cargo test -p dendri-frontends --test visual_acceptance
          cargo run -q -p dendri-cli -- sync-visual content/fixtures/projects/P01-uno-led-blink.dendri.toml
      - name: build visual editor (iced)
        run: cargo build -p dendri-editor
