[[boards.program.pous.body]]
kind = "call"
id = "n_s1"
callee = "DISPLAY_PRINT"
args = [{ value = "\"lcd1\"" }, { value = "\"Temp: 25°C 🚀\"" }]

[[components]]
id = "lcd1"
profile = "lcd-16x2"
label = "LCD"
