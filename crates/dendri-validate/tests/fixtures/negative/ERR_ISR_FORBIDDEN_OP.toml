[project]
schema_version = "2.0"
asl_version = "0.1.0"
requires = ["asl-core@1"]
name = "Fixture"

[[boards]]
id = "uno"
profile = "arduino-uno-r3"
authoring_language = "cpp"
execution = "cooperative"

[[boards.program.hardware]]
id = "n_h1"
label = "BTN"
pin = "D2"
kind = "digital_in"
pull = "pull_up"

[[boards.program.pous]]
id = "n_isr"
name = "OnBtn"
kind = { pou_kind = "ob", ob = { type = "hw_int", pin_label = "BTN", edge = "rising", priority = 1 } }
body_kind = "statements"

[[boards.program.pous.body]]
kind = "wait"
id = "n_s1"
duration = "T#10ms"
