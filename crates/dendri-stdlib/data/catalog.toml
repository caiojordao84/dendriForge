# dendri-stdlib catalog — ASL v0.1.0 / IEC 61131-3 Naming Edition
# Source: docs/stdlib.md (ported). Canonical names are IEC-style identifiers.
# Aliases normalize to canonical at Pass 0. Generators always see canonical.

asl_version = "0.1.0"
naming = "IEC 61131-3 canonical; aliases accepted at Pass 0"

