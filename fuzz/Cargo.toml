[package]
name = "dendri-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
toml = "0.8"
dendri-assets = { path = "../crates/dendri-assets" }
dendri-cli = { path = "../crates/dendri-cli" }
dendri-expr = { path = "../crates/dendri-expr" }
dendri-frontend-core = { path = "../crates/dendri-frontend-core" }
dendri-lang-cpp = { path = "../crates/dendri-lang-cpp" }
dendri-lang-ladder = { path = "../crates/dendri-lang-ladder" }
dendri-lang-sfc = { path = "../crates/dendri-lang-sfc" }
dendri-lang-st = { path = "../crates/dendri-lang-st" }
dendri-project = { path = "../crates/dendri-project" }
dendri-wm = { path = "../crates/dendri-wm" }

[[bin]]
name = "ledger_toml"
path = "fuzz_targets/ledger_toml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "expr_parser"
path = "fuzz_targets/expr_parser.rs"
test = false
doc = false
bench = false

[[bin]]
